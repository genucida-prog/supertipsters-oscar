      "history": "El Club Atlético de Madrid, S. A. D. es un club de fútbol español fundado el 26 de abril de 1903 en la ciudad de Madrid, España. Es el quinto equipo que más temporadas ha estado en Primera División, ha disputado 89 de las 94 ediciones, siendo uno de los diez clubes fundadores de la competición y participantes en la edición inaugural de 1929. En 1991 alcanzó el 3.er puesto en la clasificación histórica del fútbol español, perdiendo dicha posición en el año 2001, recuperándola en 2016 y manteniéndola desde entonces.​ Disputa sus encuentros como local en el estadio Metropolitano, con capacidad para 70 692 espectadores. Es considerado uno de los tres clubes considerados grandes, así como los más importantes en la historia del fútbol español, junto con el Real Madrid y el FC Barcelona.\nIdentificado por sus colores rojos y blancos —de los que recibe el apelativo de «rojiblancos» o «colchoneros»—,​ es uno de los clubes españoles más laureados, superando la treintena entre títulos nacionales e internacionales. Con once títulos ligueros, es el tercer club más laureado de la competición. En la competición nacional de Copa del Rey ha logrado otros diez títulos, siendo finalista en nueve ediciones más. Además de los mencionados veintiún títulos, el club ha ganado dos títulos de Supercopa de España, junto con otros tres títulos predecesores de esta competición (siendo el primero de ellos de oficialidad discutida).​\nA nivel continental, es uno de los diez equipos europeos más laureados en competiciones UEFA:​ Ha disputado diecinueve ediciones de Copa de Europa/Liga de Campeones, siendo finalista en 1974, 2014 y 2016, y semifinalista en cuatro ocasiones, veinticuatro de Copa de la UEFA/Liga Europa, logrando tres títulos, y nueve de la Recopa de Europa, logrando un título y dos subcampeonatos. Además, se ha proclamado tricampeón de la Supercopa de Europa y campeón en 1975 de la Copa Intercontinental, siendo por ello uno de los 32 clubes reconocidos por la FIFA c       "history": "El Club Atlético Osasuna es un club de fútbol de la ciudad de Pamplona, Navarra, que compite en LaLiga EA Sports, la máxima categoría de fútbol en España. Fue fundado el 24 de octubre de 1920, fruto de la fusión de dos clubes de Pamplona: la Sportiva Foot-ball Club y el New Club, por lo que es el club decano de Navarra.​ Investigaciones del Archivo Real y General de Navarra indican que el club Sportiva Foot-Ball Club, fundado el 31 de mayo de 1919, cambió de nombre a Club Osasuna el 24 de octubre de 1920; es esta última fecha la que se ha tomado como referencia del nacimiento del club.​ En 1926 el nombre de la entidad sufrió una última modificación por la de Club Atlético Osasuna, que se mantiene desde entonces. \nEl Club Atlético Osasuna ha participado en una fase previa de la UEFA Champions League, en cuatro ediciones de la antigua Copa de la UEFA, ahora denominada UEFA Europa League, en la que llegó a las semifinales en la temporada 2006/2007; y en una fase previa de la UEFA Conference League. Entre sus mayores logros está el haber disputado dos finales de la Copa del Rey, en las ediciones de 2005 y 2023, que perdió por 2-1 ante Real Betis y Real Madrid respectivamente. Otro logro importante tras la gran temporada 2022/23, es el haber disputado por primera vez en su historia la Supercopa de España en 2024. \nEs el club de fútbol más importante de Navarra por palmarés y por historia y el único que ha militado en Primera División, con un total de 45 temporadas. Además, ha disputado 38 en Segunda y 13 en Tercera.​ Históricamente, es el 13.º mejor equipo de España.​​ Fue nombrado mejor club del mundo del mes de diciembre de 2006 por la IFFHS gracias a cuatro victorias ligueras consecutivas y un triunfo en la Copa de la UEFA.​\nPor otro lado, es uno de los cuatro únicos clubes profesionales de España, junto con el Real Madrid, F. C. Barcelona y Athletic Club, que no es una sociedad anónima deportiva, de manera que sus socios tienen la propiedad del club.​\n\nHistoria\n\nEl nombre de Osasuna, propuesto por Benjamín Andoáin, significa salud, fuerza o vigor en euskera. Es el único equipo de fútbol con nombre en euskera de la Liga.\n\nInicios\nEl Club Atlético Osasuna nació de la fusión de otros dos clubes de fútbol pamploneses anteriores: el Sportiva Foot-Ball Club (cuyo presidente y jugador fue Eduardo Aizpún Andueza) y el New Club, tras previa reunión de sus representantes en el famoso Café Kutz de Pamplona.…",

Cine Palacio.​ Este club llegó a militar durante seis temporadas consecutivas en la Segunda División. En la temporada 1981-82 el Club Getafe Deportivo acaba en puestos de descenso a Segunda División B, pero a causa del descalabro económico en el que se encuentra y obligado al impago de sus deudas, es descendido a la Tercera División. En una asamblea extraordinaria celebrada el 1 de julio de 1983 en los salones Costa de Vigo se disuelve legalmente esta sociedad.​\n\nGetafe Club de Fútbol​…",

      "history": "Málaga Club de Fútbol, S. A. D. es un club de fútbol español con sede en la ciudad de Málaga, en la comunidad autónoma de Andalucía, España. Su primer equipo compite en LaLiga desde la temporada 2026-27, mientras que su equipo femenino lo hace en Segunda Federación; su máximo accionista es el jeque catarí​ Abdullah ben Nasser Al Thani,​ siendo el primer jeque árabe en convertirse en máximo accionista de un club de fútbol en España.​ Disputa sus encuentros como local en el estadio de La Rosaleda, con capacidad para 30 778 espectadores.​\nEl Málaga Club de Fútbol actual se fundó como Club Atlético Malagueño el 25 de mayo de 1948 y se convirtió en sociedad anónima deportiva el 29 de junio de 1994 con el nombre de Málaga Club de Fútbol. El primer equipo de la ciudad fue el Málaga Football Club, que disputó el 3 de abril de 1904 el primer partido de fútbol en Málaga del que existe constancia. Su equipo filial es el Atlético Malagueño, fundado en 1990, que milita en el grupo IX de la Tercera Federación. \nLos mejores momentos del club se dieron en la temporada 2002-03, año en el cual, tras ganar la Copa Intertoto de la UEFA, compitió en la Copa de la UEFA.​​ En la temporada 2011-12 obtuvo la cuarta posición del campeonato de Primera División, siendo su mejor resultado en liga, y disputó por primera vez la Liga de Campeones de la UEFA al año siguiente, alcanzando la fase de cuartos de final del torneo continental.​\n\nHistoria\n\nMálaga Football Club\nEl primer equipo de fútbol de Málaga fue el Málaga Football Club fundado en los primeros meses de 1903 y validado en el Gobierno Civil.​ Los principales impulsores del club fueron, entre otros, don Antonio López, cariñosamente apodado Mr. López por su británico aspecto, don Félix Pérez Montault, don Ernesto Rittwagen, don Enrique García de Toledo, que propugnaría la construcción del campo del Balneario del Carmen, y don Emilio Andersen Menard, que estuvo poco tiempo en activo como jugador, pero se hizo longe       "history": "El Real Madrid Club de Fútbol o simplemente Real Madrid, es una entidad polideportiva con sede en Madrid, España. Fue registrada oficialmente como club de fútbol por sus socios el 6 de marzo de 1902 con el objeto de la práctica y desarrollo de este deporte —si bien sus orígenes datan del año 1900,​ y su denominación de (Sociedad) Madrid Foot-ball Club de octubre de 1901—. Decano del fútbol madrileño,​ tuvo a Julián Palacios y los hermanos Juan Padrós y Carlos Padrós como principales valedores de su creación.​\nIdentificado por su color blanco —del que recibe el apelativo de «blancos» o «merengues»—,​​ es uno de los cuatro clubes profesionales de fútbol del país cuya entidad jurídica no es la de sociedad anónima deportiva (S. A. D.),​ ya que su propiedad recae en sus más de 90 000 socios.​ Otra salvedad comparte con el Athletic Club y el Fútbol Club Barcelona al participar sin interrupción en la máxima categoría de la Liga Nacional de Fútbol Profesional, la Primera División de España, desde su establecimiento en 1929.​​ En ella posee los honores de haber sido el primer líder histórico de la competición,​ el de equipo con más títulos, y el de la máxima puntuación en una sola edición.​​\nAbocado desde sus inicios al desarrollo del fútbol, pronto adquirió un carácter multideportivo y desarrolló varias otras disciplinas que fueron desapareciendo con el devenir de los años,​​ a excepción de la sección de baloncesto, denominada Real Madrid Baloncesto.​​ Hubo varias especulaciones en la historia reciente de la entidad sobre la posibilidad de recuperar algunas de ellas como la sección de balonmano,​ o la sección de rugby que no llegaron a materializarse,​ al contrario que una sección femenina de fútbol, parcela que desde los años 2010 el club trabajaba por crear con una base desde el ciclo formativo hasta la máxima categoría.​​ Finalmente en 2019, y tomando otra de las posibles vías para su creación, se produjo la fusión por absorción del Club Deportivo TAC       "history": "El Rayo Vallecano de Madrid, S. A. D. es un club de fútbol español del distrito de Puente de Vallecas, en la ciudad de Madrid, España. Fue fundado el 29 de mayo de 1924 como Agrupación Deportiva El Rayo, cambiando su nombre a Rayo Vallecano en 1947.​ Actualmente milita en la LaLiga EA Sports, la máxima categoría del fútbol en España. En la clasificación histórica del fútbol español ocupa el 22.º puesto.​​\nEl club tiene un título oficial al ser campeón de la Segunda División de España 2017-18, con el exfutbolista Míchel como entrenador.​​ En Primera División, ha participado en 23 de 95 temporadas, siendo su mejor posición el 8° puesto, logrado en 2012-13, 2024-25 y 2025-26. A nivel continental, clasificó a la Copa de la UEFA 2000-01, cayendo en cuartos de final contra el Deportivo Alavés, y resultó subcampeón de la Liga Conferencia de la UEFA en 2025-26, donde se convirtió en el decimotercer equipo español en disputar una final europea.​\nLos vallecanos disputan sus encuentros como local en el Estadio de Vallecas, propiedad de la Comunidad de Madrid, cedido al club de fútbol. El recinto fue inaugurado en 1976 y tiene una capacidad de 14 708 espectadores. Además, el lugar de entrenamiento del primer equipo masculino y sede del equipo femenino, así como del resto de categorías, es la Ciudad Deportiva del Rayo Vallecano, también en régimen de cesión por parte de la Comunidad de Madrid.\nSu primer equipo femenino, por otra parte, participa en la Segunda Federación Femenina, tercera categoría del fútbol femenino de España, y ha alzado tres Ligas de Primera División y una Copa de la Reina (que fue el primer título oficial del club),​siendo un clásico del fútbol femenino español y habiendo disputado la Liga de Campeones Femenina de la UEFA en tres ocasiones.\nAdemás de por sus logros deportivos, el club es conocido internacionalmente por sus particularidades socioculturales (un club de barrio, obrero, etc.), con repercusión tanto a nivel literario​​​​​ como audiovisual.​​​\n\nHistoria\n\nPrimera Etapa (1924-1991)​\nEl 29 de mayo de 1924 se fundó la Agrupación Deportiva El Rayo, en el domicilio de Prudencia Priego, viuda de Huerta, siendo su primer presidente Julián Huerta Priego. El uniforme original del equipo fue camiseta y pantalón blanco, con medias negras y vuelta blanca. Su primer terreno de juego fue el Campo de las Erillas, situado en un descampado el cual alquilaban y acondicionaban para los partidos. Actualmente, se encontraría en la manzana que forman las calles Manuel Maroto, Palomeras, Cordillera de Cuera y Blanca Luna.…",

      "history": "El Real Betis Balompié, S. A. D., también conocido como Real Betis, es una entidad polideportiva con sede en la ciudad de Sevilla, la capital de Andalucía, en España. Se fundó el 12 de septiembre de 1907 como Sevilla Balompié para la práctica del fútbol y así consta como fecha fundacional para el propio club. Oficialmente se registró el 1 de febrero de 1908.​ Disputa sus encuentros como local en el Estadio Benito Villamarín, con capacidad para 60 721 espectadores.\nEs uno de los nueve clubes españoles que han conquistado Liga y Copa. En 1935 se convirtió en el cuarto club de la historia en conquistar la Primera División de España, una década en la que se popularizó su conocido lema \"Viva el Betis manquepierda\".​ Es, además, el primer club que levantó la Copa del Rey con esta denominación en democracia, título que consiguió en 1977, 2005 y 2022. No siempre ha competido en la máxima división nacional. Es uno de los dos únicos clubes españoles​ que se han proclamado campeones de Primera, de Segunda y de Tercera División, y se encuentra pese a ello en el noveno puesto de la clasificación histórica de la Primera División, habiendo disputado 59 temporadas en la máxima categoría del fútbol en España.\nSu trayectoria en las competiciones nacionales le ha llevado a disputar competiciones internacionales en diecisiete ocasiones: una de la UEFA Champions League, máximo torneo a nivel de clubes en Europa, once de la Copa de la UEFA/Liga Europa, dos en la Liga Conferencia (resultando subcampeón en 2024-25), dos de la extinta Recopa de Europa y una en la extinta Copa de Ferias; a ello se suman otras participaciones en la también extinta Copa Ibérica. Es el noveno club español que más veces ha competido en Europa y el duodécimo que ha disputado una final.\nTambién ha completado la mejor campaña de un equipo andaluz en primera división en número de puntos y en goles a favor (77 puntos y 81 goles, temporada 1996-97; 79 % del total de los puntos obtenidos, temporada 34/35).\nSe situó en el vigésimo puesto del top-25 de la clasificación de clubes del mundo elaborada por la Federación Internacional de Historia y Estadística de Fútbol (IFFHS) en los años 1995,​ 1997​ y 2005.​\nTiene una de las aficiones más reconocidas de España. Más de un 3 % de los entrevistados reconocieron en 2014 para el CIS ser seguidor del Betis, lo que le sitúa entre los seis equipos que más seguimiento acumulan en territorio nacional, triplicando el número de simpatizantes del Sevilla FC.…",

      "history": "La Real Sociedad de Fútbol, S. A. D., más conocida como la Real Sociedad o simplemente la Real, es un club de fútbol español con sede en San Sebastián (Guipúzcoa). Se fundó el 7 de septiembre de 1909, si bien sus orígenes datan del año 1904 con la antigua sociedad Donostiarra Recreation Club,​ de la cual varios integrantes pasaron a conformar en 1907 el San Sebastián Foot-Ball Club, que dio después con la fundación del club bajo su denominación de Sociedad de Foot-Ball de San Sebastián.​​\nIdentificado por sus colores blanquiazules, de los que recibe el apelativo de txuri-urdin, es uno de los nueve clubes que se han proclamado campeones del Campeonato Nacional de Liga de Primera División, con dos títulos consecutivos en las temporadas 1980-81 y 1981-82, además de otros tres subcampeonatos.​ \nEn la actualidad, ocupa el octavo puesto de la clasificación histórica. En la segunda competición nacional del país, el Campeonato de Copa, ha logrado cuatro títulos, el primero como Club Ciclista de San Sebastián en 1909, el segundo en 1987, el tercero en 2020, y el cuarto en 2026, y fue finalista en cuatro ediciones más. El primero de dichos títulos coperos le permitió ser uno de los equipos que conformaron la primera edición en 1929 de la vigente máxima categoría de la Liga Nacional de Fútbol Profesional, la Primera División, la cual disputa ininterrumpidamente desde 2010 con un total de 80 participaciones. \nCompleta su palmarés con una Supercopa en 1982, su primera edición, y, a nivel continental, ha disputado quince ediciones de la Liga Europa de la UEFA (anteriormente Copa de la UEFA), una de la Recopa de Europa y cinco de la Liga de Campeones, máxima competición a nivel de clubes en el Viejo Continente.\nDisputa sus encuentros como local en el estadio de Anoeta, con capacidad para 42 300 espectadores.​ Cuenta con más de 37 000 abonados​ y es, según encuestas del Centro de Investigaciones Sociológicas (CIS), el séptimo club con mayor número de simpatizantes en España.​ La FIFA lo señala como uno de los «clubes clásicos» del país.​ \nEl club mantiene una rivalidad histórica con el Athletic Club, con quien disputa el «derbi vasco», uno de los enfrentamientos con más tradición de España.​ \nEs, además, el sexto equipo que más internacionales ha aportado a la selección española de fútbol.​\n\nHistoria\n\nLos orígenes y la fundación de la Real Sociedad de Fútbol datan a principios del siglo xx, en torno al año 1903, si bien no fue hasta el 7 de septiembre de 1909 cuando fue oficialmente legalizada como Sociedad de Foot-Ball (de San Sebastián).…",

      "history": "El Valencia Club de Fútbol, S. A. D., es una entidad deportiva con sede en la ciudad de Valencia, capital de la Comunidad Valenciana (España). Fue fundado el 18 de marzo de 1919 bajo el nombre de Valencia Foot-ball Club, y el acta de constitución, redactada el 1 de marzo de ese mismo año en el desaparecido Bar Torino, se conserva en la actualidad.​ Su primer equipo compite en la Primera División de España, conocida por motivos de patrocinio como LaLiga EA Sports, y en la clasificación histórica del fútbol español ocupa el 5.º puesto, habiendo sido tercero hasta 2016 y cuarto hasta 2025. También ha disputado 91 de las 95 ediciones de la máxima categoría del fútbol en España.​ \nEl 20 de mayo de 1923 se inauguró el estadio de Mestalla, donde el club disputa sus encuentros como local, con una capacidad para 49 430 espectadores.​ En 2027 está previsto que disputen sus encuentros en el Nou Mestalla, con capacidad para 70 044 espectadores.​\nEs el quinto club español en cuanto a títulos internacionales (7), el cuarto en disputar competiciones europeas (41) y el 5.º club español con más títulos con un total de 25 trofeos oficiales, donde también obtuvo un «doblete» en 2003-04, en su palmarés cuenta con 6 títulos de Primera División y 6 subcampeonatos, 2 de Segunda División, 8 Copas del Rey, 1 Supercopa de España, 1 Copa Eva Duarte, 1 Copa de la UEFA, 2 Copas de Ferias, 2 Supercopas de Europa, 1 Recopa de Europa y 1 Copa Intertoto. El club fue campeón de la Pequeña Copa del Mundo de Clubes en 1966, y subcampeón en 1955, pese a no contar con el reconocimiento de título mundial de la FIFA, y cuarto en la Copa Latina de 1953 en su única participación. Ha disputado trece ediciones de la Liga de Campeones de la UEFA, siendo dos veces subcampeón en 2000 y 2001,​ y cuartofinalista en dos ocasiones. Es uno de los quince clubes que han conseguido disputar las tres finales (Liga de Campeones de la UEFA, Recopa de Europa y Copa de la UEFA-Liga Europa de la UEFA) en alguna ocasión, hasta la extinción de la Recopa en 1999. El 11 de enero de 2005 la Federación Internacional de Historia y Estadística de Fútbol (IFFHS) le reconoció como mejor club del mundo en la clasificación mundial de clubes del año 2004, así como en el 20.º puesto del mejor club del siglo XXI (2001-2020).\nCinco exintegrantes del club fueron incluidos en el Salón de la Fama del Fútbol Internacional de la FIFA, un proyecto dedicado a preservar la memoria de relevantes personajes de la historia del fútbol.​​ Entre ellos se incluyen Alfredo Di Stéfano, Mario Kempes, Romário, Jorge Valdano y Didier Deschamps.…",

ndo en cantidad de trofeos, detrás del Real Madrid (15); dos de la extinta Recopa de Europa, cinco de la Supercopa de Europa y dos de la extinta Copa Europea Latina además de otros cuatro títulos intercontinentales o mundiales; tres de la Copa Intercontinental, y uno de su sucesora; la Copa Mundial de Clubes.​…",

n en 1961-62.​ Además, fue subcampeón de la Liga Conferencia de la UEFA en 2022-23 y 2023-24.\nIdentificado por su color púrpura —del que recibe el apelativo de «viola»—​ disputa sus encuentros como local desde 1931 en el Estadio Artemio Franchi —denominado en su fundación como Stadio Giovanni Berta—, el cual cuenta con una capacidad aproximada de 47 300 espectadores, el sexto de mayor capacidad de Italia. El recinto es considerado como una de las obras arquitectónicas más influyentes del racionalismo italiano y de la ciudad, a su vez considerada como una de las grandes cunas del arte.\n\nHistoria…",

      "history": "La Atalanta Bergamasca Calcio, conocido simplemente como Atalanta, es un club de fútbol de Bérgamo, en Lombardía, Italia. Fue fundado en 1907 como SBG Atalanta, la sociedad tiene su sede en la cercana localidad de Zingonia, en la provincia de Bérgamo. Disputa sus encuentros como local en el estadio bergamasco Atleti Azzurri d' Italia, con capacidad para 24 642 espectadores. Actualmente compite en la Serie A, la máxima categoría del fútbol en Italia, tras haber obtenido el ascenso de la Serie B en 2011. Ocupa el undécimo puesto en la clasificación histórica de la Serie A, así como el vigésimo cuarto en la de la Serie B.\nEs el equipo que más ediciones de Serie A, a grupo único, ha disputado sin representar a una capital de región, por ello se la considera la Reina de las Provincias. Es el conjunto que ha jugado más veces en la primera división italiana que nunca ha ganado un scudetto. Por el contrario, junto al Genoa, es la escuadra que más ocasiones ha ganado un campeonato de segunda división italiana, seis, y más promociones a la más alta división, trece. En su palmarés aparece un título de Copa Italia conseguido en la temporada 1962-63, y a nivel continental la Liga Europa de la UEFA 2023-24, dónde ganaron al Bayer Leverkusen 3-0 en la final. Además, llegaron a las semifinales de la Recopa de Europa en 1988, cuando jugaba en Serie B, y resultaron subcampeones de la Supercopa de la UEFA 2024.\nAtalanta ocupa el duodécimo lugar en la clasificación de la tradición deportiva italiana según los criterios de la Federación Italiana de Fútbol (FIGC), y es miembro de la Asociación de Clubes Europeos desde 2019.​\n\nHistoria\n\nEn los albores del fútbol\nLa Atalanta tiene sus orígenes en la escisión de la Giovane Orobia, surgida en 1901. La primera sociedad futbolística de Bérgamo fue La Foot Ball Club Bérgamo, fundada por emigrantes suizos en 1903 y que participa en campeonatos regionales lombardos de la Federación Italiana de Fútbol hasta el año 1910.\nFue fundada el 17 de octubre de 1907 por los estudiantes Eugenio Urio, Giulio e Ferruccio Amati, Alessandro Forlini y Giovanni Roberti como Società Bergamo di Ginnastica e Sports Atletici Atalanta. El nombre se debe a la heroína griega Atalanta. La entidad ya tenía en 1907 una sección de fútbol, aunque fue reconocida por la federación correspondiente siete años más tarde, en 1914.…",

      "history": "El Bologna Football Club 1909 es un club de fútbol de Italia, de la ciudad de Bolonia, en la región de Emilia-Romaña. Juega en la Serie A desde la temporada 2015-16, el nivel más alto del sistema de ligas del fútbol italiano. Sus colores característicos son el rojo y el azul, y la camiseta cuenta con franjas verticales alternadas de los mismos colores.​ Desde 1927, el equipo disputa sus encuentros en el Estadio Renato Dall'Ara, nacido como Estadio Littoriale y llamado desde el período de posguerra hasta 1983 como Estadio Comunale, el cual puede albergar a 36 462 espectadores.\nEl club fue fundado el 3 de octubre de 1909 por Emilio Arnstein,​ cayó en bancarrota en 1993 y se reconstituyó a nivel de sociedad con el nombre actual luego de haber adquirido nuevamente los derechos y el título deportivo de la asociación anterior.​ Con la participación en 73 campeonatos de la Serie A de un total de 88 desde que se disputa a grupo único, el Bologna se ubica en el noveno lugar en la clasificación histórica de la máxima división italiana, que tiene en cuenta las apariciones totales en el campeonato; contando las 16 apariciones en las ligas de la máxima categoría antes de que disputara a grupo único, divididas en Prima Categoria, Prima Divisione y Divisione Nazionale, Bologna cuenta con 89 apariciones en la máxima categoría nacional en total. Según la Federación Italiana de Fútbol, es el club con la octava mejor tradición deportiva en Italia.\nEl equipo cuenta con 7 títulos de campeón de Italia, tres títulos de Copa Italia (rompiendo una racha de 51 años sin títulos en 2025) y una Copa de la Alta Italia. A nivel internacional, el Bologna fue el primer club italiano en ganar un trofeo continental, la Copa de la Europa Central en 1932; cuenta con 3 Copas Mitropa, un récord italiano en la competencia, y una Copa Intertoto.​ Con la conquista del Torneo Internacional de l'Expo Universal de París 1937, la escuadra se estableció como uno de los mejores equipos en el panorama de la Europa continental. El Bologna tiene el récord singular de dos títulos de liga ganados en una final de definición: uno contra el Torino en 1929​ y otro contra el Inter de Milán en 1964.​\n\nHistoria\nEl Bologna Football Club fue fundado en 1909 como una «sección de ejercicios deportivos al aire libre» del Circolo Turistico Bolognese, por iniciativa de Emilio Arnstein y bajo la presidencia del suizo Louis Rauch.…",

      "history": "El Cagliari Calcio es un club de fútbol de Italia, de la ciudad de Cagliari en Cerdeña. Fue fundado en 1920 y actualmente juega en la Serie A, la primera categoría del fútbol italiano.\nLos mayores éxitos deportivos del Cagliari son el campeonato de Serie A conseguido en la temporada 1969-70 y el subcampeonato obtenido año antes. En el plano internacional, llegó a octavos de final de la Copa de Europa 1970-71 y semifinales de la Copa de la UEFA 1993-94.\nEl equipo ocupa el puesto 14.º en la clasificación histórica de la Serie A y es, junto a Bologna, Genoa, Napoli y Hellas Verona, uno de los cinco clubes italianos que ha sido campeón de liga en primer, segundo y tercer nivel.\n\nHistoria\n\nEl 20 de agosto de 1920, Fichera, funda el equipo Cagliari Football Club. En 1934 se fusiona con el Club Sportivo Cagliari y nace la Unione Sportiva Cagliari. Finalmente el equipo se llama Cagliari Calcio.\nEl equipo logró su primer ascenso a la Serie A en 1964. En la primera mitad del campeonato, Cagliari finalizó último con tan solo 9 puntos, pero luego se recuperó finalizando sexto con 34 puntos.\nEn la temporada 1968-69, Cagliari luchó hasta el final por el Scudetto con el AC Milan y la Fiorentina. Finalmente Fiorentina se quedaría con el título y Luigi Riva se consagró como goleador del torneo. Cagliari finalizó 2° con 41 puntos y se clasificó a la Copa de Ferias.\nEn esa misma temporada, Cagliari llegó a la final de la Copa Italia, que perdió contra del AS Roma.\nEn la temporada 1969-70, ganó su primer y único scudetto. Ese año el equipo tan solo perdió dos encuentros y recibió 11 goles en contra (hasta ahora récord para un torneo de 16 equipos). Riva ganó el trofeo de máximo goleador. Muchos de los jugadores campeones del Cagliari fueron convocados para disputar el Mundial de 1970, en el que llegaron a la final.\n\nUniforme\nUniforme titular: Camiseta dividida en dos mitades roja y azul, pantalón azul y medias azules.\nUniforme alternativo: Camiseta blanca, pantalón blanco y medias blancas.\nTercer uniforme: Camiseta celeste, pantalón celeste y medias celestes.\n\nUniforme titular\n\nUniforme alternativo\n\nTercer uniforme\n\nCuarto uniforme\n\nEstadio\n\nEl Cagliari jugaba de local en el Estadio Sant'Elia. Fue inaugurado en 1970 y su superficie es de pasto. Tiene una capacidad para 23.486 espectadores y fue una de las sedes de la Copa Mundial de Fútbol de 1990. Sus dimensiones son de 105 x 68 m. En 2017 fue derribado para dejar paso a un futuro estadio en los mismos terrenos.\n\nEl Cagliari construyó en 2012 su nuevo estadio prefabricado denominado Is Arenas.…",

      "history": "El Genoa Cricket and Football Club, comúnmente llamado simplemente Genoa (pronunciación en italiano: /ˈdʒɛːnoa/), es un club de fútbol de Italia con sede en Génova, Liguria. Compite en la Serie A de Italia y disputa sus partidos como local en el Estadio Luigi Ferraris.\nFue fundado con el nombre de Genoa Cricket and Athletic Club el 7 de septiembre de 1893, lo que lo convierte en el equipo de fútbol más antiguo de Italia. A lo largo de su historia, el Genoa ha ganado nueve campeonatos italianos, una Copa de Italia y seis títulos de Serie B. Es el cuarto club que más veces ha ganado el scudetto, únicamente superado por Juventus, Inter y Milan.\nSu rival histórico es la Unione Calcio Sampdoria, con quien comparte el Estadio Luigi Ferraris y disputa el Derbi de Génova.\n\nHistoria\n\n1893-1897: Fundación y primeros años\n\nEl Genoa Cricket and Football Club fue fundado el 7 de septiembre de 1893 en Via Palestro 10, sede del consulado británico de Génova, por representantes de la importante comunidad inglesa de Génova, ciudad industrial y dotada de uno de los puertos más importantes del Mediterráneo.​ Fue uno de los primeros clubes de fútbol creados en Italia. En el momento de su fundación, los únicos clubes existentes eran de Turín: el Internazionale Torino, el Ginnastica Torino y el Football Club Torinese.​\nEl nombre original del equipo fue Genoa Cricket and Athletic Club, centrándose principalmente en la práctica del críquet y el atletismo. Entre sus actividades figuraba el fútbol, deporte que se venía practicando desde hacía unos treinta años en Inglaterra. En pocos años este deporte se hizo cada vez más popular y se convirtió en la principal actividad del club, aunque se siguieron practicando otros.​ James Spensley es considerado el padre futbolístico del Genoa porque fue determinante en la valorización del fútbol dentro de la entidad.\nEl primer partido amistoso se llevó a cabo en casa, contra un combinado de jugadores del Internazionale Torino y el FBC Torinese. El Genoa perdió 1-0.​ No mucho después, Genoa registró su primera victoria como visitante contra la UPS Alessandria ganando 2-0. También se llevaron a cabo amistosos contra varios marineros británicos como los del HMS Revenge, entre otros.​\n\n1898-1911: Los años dorados\n\nEl 8 de mayo de 1898 el Genoa participó en la primera edición del Campeonato Italiano de Fútbol.…",

      "history": "El Football Club Internazionale Milano 1908 S. P. A.,​ comúnmente llamado Internazionale (pronunciado /ˌinternattsjoˈnaːle/) o Inter,​ y más conocido como Inter de Milán,​​​ es un club de fútbol de la ciudad de Milán, capital de la región de Lombardía, Italia. Fue fundado el 9 de marzo de 1908 bajo el nombre de Foot-Ball Club Internazionale.\nEs uno de los clubes más laureados y con mayor renombre históricamente de Italia, Europa y del mundo.​ El Inter es el segundo equipo más exitoso del fútbol italiano, con 39 títulos a nivel nacional (21 Ligas, 10 Copas y 8 Supercopas), siendo solo superado por la Juventus. A nivel internacional se ha proclamado tres veces campeón de la Copa de Europa/Liga de Campeones de la UEFA en 1963-64, 1964-65 y 2009-10, además de cuatro subcampeonatos, y tres veces campeón de la Copa de la UEFA, tras lo cual obtuvo en dos ocasiones la Copa Intercontinental y en una la Copa Mundial de Clubes de la FIFA.​\nEl club siempre ha jugado en la máxima categoría del campeonato nacional desde su primer partido oficial en 1909 y es el único equipo que ha participado en todas las ediciones de la Serie A, competición instaurada en 1929, circunstancia que compartió hasta 2006 con la Juventus, descendido administrativamente a la Serie B tras el escándalo del Calciopoli.\nEl Inter de Milán ejerce de local en el estadio Giuseppe Meazza (también conocido por el nombre del barrio, San Siro) desde 1947, y lo comparte con el A. C. Milan.​ el estadio es el más grande del fútbol italiano con una capacidad de 75 923 espectadores. Los colores que identifican al equipo son el negro con el azul, y han sido utilizados en los colores de su uniforme desde 1908,​ salvo un breve interludio en 1928 cuando adoptó una camiseta blanca cruzada roja. Sus rivales tradicionales son el A. C. Milan, con el que disputa el derbi de Milán (conocido popularmente en Italia como el Derby della Madonnina) y la Juventus de Turín, con quien se enfrenta en el derbi de Italia (Derby d'Italia en italiano).​​\nUn hecho a destacar es que el Inter es el primer y único equipo italiano que ha conseguido un triplete (tres títulos en una misma temporada), al proclamarse campeón de la Serie A, Copa Italia y Liga de Campeones de la UEFA en la temporada 2009-10,​ además de conseguir un quintuplete (ganando también la Supercopa de Italia y el Mundial de Clubes), logrando este hito en 2010.​…",

      "history": "La Juventus Football Club S. p. A. (del latín iuventūs,​ español juventud, AFI: juˈvɛntus), conocida simplemente como Juventus o simplificado en Juve (AFI: ˈjuːve),​ es un club de fútbol italiano con sede en la ciudad de Turín, capital de la región del Piamonte. La Ortografía de la lengua española recoge la forma Juventus de Turín como denominación recomendada en español, por emplear el exónimo tradicional del topónimo; dicha forma se documenta asimismo en medios hispanoamericanos.​​​ Fue fundado el 1 de noviembre de 1897 con el nombre de «Sport Club Juventus» por un grupo de estudiantes locales.​\nEs el segundo equipo de fútbol italiano más antiguo entre los que siguen activos —después de la sección de fútbol del Genoa— y, junto con el Torino, es uno de los dos clubes de fútbol profesional de la capital piamontesa. Vinculada a la familia Agnelli desde la década de 1920,​ el club ha militado ininterrumpidamente en la máxima categoría profesional del fútbol italiano (denominada desde 1929 Serie A) desde su debut en 1900,​ con la única excepción de la temporada 2006-07. El club ejerce de local desde el año 2011 en el Allianz Stadium, que cuenta con una capacidad o aforo total para 41 507 espectadores.​\nLa Juventus es el equipo más exitoso de Italia y al mismo tiempo uno de los clubes más laureados y renombrados del mundo.​ Es el club con el mayor número de títulos oficiales conquistados en el fútbol italiano con un total de 60 campeonatos (36 Ligas, 15 Copas, 9 Supercopas).​ Fue el primer club italiano y del sur europeo en ganar la Copa de la UEFA (temporada 1976-77),​ en el ámbito internacional; cabe destacar que es el sexto club europeo y decimotercero en el mundo con la mayor cantidad de títulos oficiales internacionales a nivel confederativo e interconfederativo,​​ siendo además el primer club en la historia del fútbol europeo en ganar las tres principales competiciones organizadas por la Unión Europea de Asociaciones de Fútbol​​ y el primer club en el mundo —y único hasta 2022— en ganar todas las competiciones (sin contar la conference league) confederativas y el título mundial interclubes.​​​\nEn el año 2009, fue reconocido como el mejor club italiano del siglo XX y segundo a nivel europeo durante ese mismo periodo por la Federación Internacional de Historia y Estadística de Fútbol, institución reconocida por la FIFA.​ Sus clásicos rivales son el Torino F. C. con el que disputa el «derbi de Turín», el A. C. Milan con el que disputa el «derbi de los campeones» y el Inter de Milán, club frente al cual disputa el denominado «derbi de Italia».…",

      "history": "La Società Sportiva Lazio, es un club deportivo de Italia, de la ciudad de Roma. Fue fundado el 9 de enero de 1900 y juega en la Serie A de Italia. Utiliza camiseta celeste con pantalón blanco, y juega de local en el Estadio Olímpico de Roma, el segundo estadio más grande de Italia, únicamente por detrás de San Siro.\nSu histórico rival es el otro equipo de la capital italiana, la A.S. Roma, con quien disputa el Derby di Roma y a su vez comparten estadio. Hasta el momento ha ganado dos veces el Scudetto de la Serie A, en siete ocasiones se adjudicó la Copa de Italia y cinco veces la Supercopa en su país. El 26 de mayo de 2013 se adjudicó la Copa de Italia contra la A.S. Roma, en el primero y hasta ahora único Derby di Roma que ha habido en una final entre los dos equipos de la Capital italiana en la historia de esta competición. Actualmente es el equipo de fútbol de la capital italiana con más títulos oficiales (16). En el ámbito internacional, la Lazio ganó en 1999 la Recopa y la Supercopa de Europa, y alcanzó la final de la Copa de la UEFA en 1998.\n\nHistoria\n\nComienzos\n\nLa Società Sportiva Lazio fue fundada el 9 de enero de 1900 en el barrio Prati de Roma por nueve amigos y atletas romanos, entre los cuales se encontraba Luigi Bigiarelli, suboficial de los Bersaglieri. La Lazio se unió a la liga en 1912, tan pronto como la Federación Italiana de Fútbol comenzó a organizar campeonatos en el centro y al sur de Italia, y llegó a la final de los playoffs del campeonato nacional en tres ocasiones, pero nunca ganó, perdiendo en 1913 contra el Pro Vercelli, en el año 1914 contra el Casale y en 1923 contra el Génova 1893.\nEn 1927 fue el único equipo a rechazar la fusión que condujo a la creación de la AS Roma.\nLa década de los 1950s produjo una combinación de los resultados de mitad de la tabla y la parte superior con una victoria en la Copa de Italia de 1958. La Lazio descendió por primera vez en 1961, pero regresó a la máxima categoría dos años 1954, gracias a los 15 goles del atacante checoslovaco Július Korostelev y la conducción de su compatriota (y luego el entrenador) Čestmír Vycpálek, consigue el título de la Serie C y la primera promoción a la Serie B, donde permanece en el 11 años posteriores, dos jugadores importantes en esta época fueron el goleador Pablo Grass (que se consagró en la temporada 1956-57 de la Serie B el máximo goleador con 16 goles) e Ivo Cocconi, que en aquellos años suma 308 partidos con la cruzada.…",

      "history": "La Società Sportiva Calcio Napoli S.p.A., también conocida como S. S. C. Napoli o simplemente Napoli, es un club de fútbol con sede en la ciudad de Nápoles, en la región de Campania, Italia. Fue fundado como Associazione Calcio Napoli en 1926, tomando el nombre actual en 1964 y tras la refundación en 2006, siendo refundado como Napoli Soccer en 2004. Actualmente participa en la Serie A, máxima división del fútbol en Italia.​\nUtiliza camiseta de color azul cielo y pantalón blanco, motivo por el cual es conocido como Gli Azzurri (Los Azules). Desde 1959 disputa sus encuentros como local en el Estadio Diego Armando Maradona (conocido hasta 2020 como Estadio San Paolo), con capacidad para 54 726 espectadores.​\nCon un palmarés que incluye cuatro ligas de Italia, siendo la última la conquistada en 2025, nueve subcampeonatos, seis Copas de Italia y tres Supercopas italianas a nivel nacional, y una Copa UEFA, una Copa de los Alpes y una Copa de la Liga anglo-italiana a escala internacional, el Napoli es el equipo del Mezzogiorno con más títulos y con más presencias en la Serie A.​ Además es el cuarto equipo con más hinchas de toda Italia (12 %),​ que representan alrededor de una quinta parte de los aficionados en el Mezzogiorno.​\n\nLos principales rivales del Napoli son la A. S. Roma, con la que juega el derby del Sole,​ y los grandes clubes del Norte: Juventus de Turín (derbi norte-sur), A. C. Milan e Inter de Milán. Con relación a la región que representa, disputó los últimos derbis de Campania en la Serie A contra U. S. Salernitana,​ Benevento Calcio​​ y U. S. Avellino.​\n\nHistoria\n\nDel Naples al Napoli\n\nLos orígenes del fútbol en Nápoles se remontan a 1904, cuando de la mano del inglés William Poths,​ empleado de la sede local de la compañía naviera británica Cunard Line, y de dos napolitanos, el ingeniero Emilio Anatra​ y el médico Ernesto Bruschini,​ se fundó el Naples Foot-Ball & Cricket Club. En 1906 cambió su nombre a Naples Foot-Ball Club, siendo presidente el ingeniero Amedeo Salsi. El primer partido de relieve se disputó contra la tripulación del barco inglés Arabik, que anteriormente había derrotado al galardonado Genoa: el conjunto napolitano logró ganar por 3 a 2.​\nEn 1912, la parte napolitana del club se dividió de la inglesa, dando vida así a la Unione Sportiva Internazionale Napoli. En 1921, por problemas financieros, los equipos se vieron obligados a unirse de nuevo llamándose Foot-Ball Club Internazionale-Naples, más conocido como F.B.C. Internaples.​…",

      "history": "El Udinese Calcio es un club de fútbol italiano de la ciudad de Údine, en la región de Friul-Venecia Julia (Italia). Fue fundado en 1896, lo que lo convierte en uno de los clubes más antiguos que siguen activos en el país. Actualmente compite en la Serie A, la máxima categoría del fútbol en Italia. Disputa sus encuentros como local en el Estadio Friuli, con capacidad para 25 000 espectadores.\nSus colores son el blanco y el negro, tomados del escudo municipal; debido a esta combinación de colores, los jugadores se ganaron el apodo de bianconeri y zebrette.\nA nivel nacional, los mejores resultados deportivos fueron la final de la Coppa Italia de 1922 (perdió 0-1 contra el Vado) y el subcampeonato de la Serie A de 1954-55, además de ganar tres campeonatos de Segunda División y de la Serie B, y una Coppa Italia Semiprofesional. En el ámbito internacional, además de ganar una Copa Anglo-Italiana en 1978 y una Copa Mitropa en 1980, el club cuenta con varias participaciones en competiciones de la UEFA, entre las que destacan la llegada a cuartos de final de la Copa de la UEFA en 2009 y la conquista de la Copa Intertoto en 2000.\nEl Udinese es miembro asociado de la Asociación de Clubes Europeos (ECA) y posee la 14.ª mejor tradición deportiva según los parámetros de la FIGC.\n\nHistoria\n\nLos inicios\nEl club fue fundado en 1896 como parte de la Società Udinese di Ginnastica e Scherma. En su año inaugural, el club ganó el torneo FNGI en Treviso venciendo a Ferrara 2-0. Sin embargo, el título no es reconocido como oficial. El 5 de julio de 1911, algunos miembros del Udinese, liderados por Luigi Dal Dan, fundaron el A.C. Udinese, el cual se unió a la FIGC. Debutó en un amistoso en contra de la Juventus Palmanova ganando 6-0. Recién en 1912-13 el Udinese tomó parte de un campeonato oficial de la FIGC. En ese año se enroló en el campeonato Veneto Di Promozione, el cual consistía en 3 equipos (los otros eran el Petrarca y el Padova). Con dos victorias sobre el Padova (3-1 y 5-0), Udinese finalizó ensegundo lugar detrás del Petrarca y fue promovido a la Prima Categoría. En dicha liga, el Udi falló en alcanzar la liga nacional, siendo eliminado en la Eliminatoria Veneta.\n\nSiglo XXI\nEn marzo de 2001, el nuevo entrenador ha sido elegido por la directiva del Udinese, Luciano Spalletti con el que han de conseguir asegurar el mantenimiento del club en la Serie A en la penúltima jornada de la temporada.…",

      "history": "El Deportivo Alavés, S. A. D., más conocido como Alavés, es un club de fútbol con sede en la ciudad de Vitoria, España. Fundado el 23 de enero de 1921 como Sport Friend's Club, participa, desde la temporada 2023-24, en la Primera División de España. Desde el 7 de febrero de 2020 ocupa el 26.º puesto en su clasificatoria histórica.\nEl club cuenta en su palmarés con cuatro ligas de Segunda División, otras cuatro de Segunda B, seis de Tercera y una Copa RFEF. Uno de sus mayores logros deportivos tuvo lugar en el año 2001, cuando, en su debut en competición europea, fue subcampeón de la Copa de la UEFA —actual Liga Europa— tras perder frente al Liverpool Football Club por un gol de oro en la prórroga para un 5-4 final.​ Merced a dicha actuación se encuentra entre los veintiocho equipos españoles en haber disputado una competición internacional. En cuanto a títulos, ha logrado cinco campeonatos de liga en divisiones inferiores nacionales como mejores distinciones.\nIdentificado por sus colores azul y blanco – por lo que recibe el apelativo de «albiazul»—, su entidad jurídica es la de sociedad anónima deportiva (S. A. D.) mediante el Decreto de la Ley del Deporte 10/1990,​​ para favorecer el asociacionismo deportivo de base, y establecer un modelo de responsabilidad jurídica y económica para entidades de carácter profesional. Repartida la propiedad entre socios accionistas, el propietario mayoritario es el club de baloncesto Saski Baskonia —personalizado en la figura de su máximo accionista Josean Querejeta—, mientras que el presidente del club es Alfonso Fernández de Trocóniz. Disputa sus encuentros como local en el estadio de Mendizorroza, con un aforo de 19.940 espectadores, y cuenta además con unas instalaciones deportivas en Ibaia dedicadas a la labor de formación.\nEntre ellos destaca el Deportivo Alavés \"B\", su equipo filial, que milita en el grupo II de la Segunda Federación. Anteriormente cuenta con un tercer equipo, el Deportivo Alavés \"C\", desaparecido en el año 2005 y vuelto a crear en 2022.​ Destaca actualmente por su expansión internacional con sus acuerdos de colaboración con equipos de Croacia, Finlandia, Francia y Japón.\n\nHistoria\n\nAntecedentes y origen\nLos orígenes del foot-ball en Vitoria datan de principios del siglo XX, influenciados por sus vecinos vizcaínos. Los primeros pasos se remontan al año 1908 con un primitivo Deportivo Alavés, club con dilatada historia en el ámbito regional vasco pero no vinculado al actual.…",

      "history": "El Elche Club de Fútbol, S. A. D. es un club de fútbol con sede en la ciudad de Elche, España. Se fundó como Elche Foot-ball Club el 10 de enero de 1923 a partir de la fusión de varios clubes de la ciudad. Desde la temporada 2025-26 compite en la Primera División de España, la máxima categoría de fútbol en España. Disputa sus encuentros como local en el Estadio Martínez Valero, con capacidad para 33 732 espectadores.\nEl Elche ha disputado 25 temporadas en Primera División (40 en Segunda), ocupando el 25.º puesto en la clasificación histórica de Primera División. En la temporada 1958-59 logró su primer ascenso a Primera División tras resultar campeón de su grupo en Segunda, título que repetiría en 2012-13 y permanecería doce temporadas consecutivas en la máxima categoría, también alcanzó un quinto puesto como mejor clasificación en la temporada 1963-64. En la competición nacional de copa —actual Copa del Rey—, alcanzó el subcampeonato de Copa de 1969, enfrentándose en la final disputada en el Estadio Santiago Bernabéu al Athletic Club, cuyo resultado fue de 1-0 favorable a los vascos.\n\nHistoria\n\nFundación y primeros años\nEl 6 de agosto de 1922, desde la revista Nueva Illice, surge la iniciativa de crear una selección ilicitana para hacer frente al C. A. Bellas Artes, de la vecina Alicante, club de referencia por esas fechas junto al potente Club Natación Alicante, y a petición del alcalde de la ciudad Lorenzo Fenoll Serrano, a finales de agosto de 1922 directivos de La Sportiva, Gimnástica F. C., Illice F. C. y Sporting de Elche, entre otros clubes locales, se dieron cita en una de las cuevas que hay junto al río Vinalopó, en la que se guardaba el material pirotécnico de Vicente Albarranch y en ella tuvo lugar la fundación de la Sociedad Deportiva Elche Foot-ball Club, ante el deseo unánime por parte de todos de crear un club potente que representase a la ciudad frente a otros rivales. Su primer presidente fue Mariano Rodríguez Irles. El unifo       "history": "El Hull City es un club de fútbol de Inglaterra, de la ciudad de Kingston upon Hull en Yorkshire. Fue fundado en 1904 y actualmente juega en la Premier League de Inglaterra, luego de 9 años de ausencia.\nLuego de quedar tercero en la temporada 2007-08 del Football League Championship, Hull City ascendió a la máxima categoría del fútbol inglés, la Premier League. Para ello derrotó en el Estadio de Wembley al Bristol City por 1-0.\nEn la temporada 2008-09 de la Premier League finalizó en el 17.º lugar, salvándose levemente del descenso.\n\nHistoria\nHull City AFC es un club de fútbol Inglés asociación con sede en Kingston en Hull, East Riding de Yorkshire, fundada en junio de 1904. El club participa en el Campeonato de Liga de Fútbol, el segundo nivel del fútbol Inglés. En 2007-08 logró el ascenso a la máxima categoría del fútbol Inglés, por primera vez en su historia, al ganar el play-off final del Championship en el estadio de Wembley. El club terminó en la 17 ª posición en la temporada 2008-09 de la Premier League, logró evitar el descenso por un punto.\nLa última vez que el Hull City terminó en una alta posición en la Football League fue en la temporada 1909-10 de la vieja Second Division donde terminaron terceros; posición que igualaron en 2007-08 cuando ganaron la promoción. Sus mayores logros en competiciones de copa fueron en 1930, cuando el equipo llegó a la semifinal y en 2014 a la final siendo subcampeón, ambas por FA Cup.\nHull City juega sus partidos de local en el KC Stadium. Antes jugaron en Boothferry Park, pero se mudaron a su actual hogar en 2002, con el Boothferry Park previsto para su demolición. Tradicionalmente su uniforme es negro y ámbar, a menudo con un diseño de camiseta a rayas, de ahí su apodo de Los Tigres. La mascota del club es Roary the Tiger.\n\nPremier League y vuelta al Championship\n\nFútbol Primera División (2008–2010)\nA pesar de ser uno de los favoritos para el descenso en la temporada 2008-09, Hull inició su an       "history": "El Leeds United Football Club es un club de fútbol de Inglaterra, de la ciudad de Leeds en Yorkshire del Oeste. Fue fundado en 1919 y milita en la Premier League (2025-26). Fue considerado uno de los equipos históricos y de mayor tradición tanto del fútbol inglés como del fútbol europeo. Entre sus principales conquistas y logros destacan a nivel continental: 2 Copas de Ferias logradas en 1968 y 1971, el subcampeonato de la misma en 1967, el subcampeonato de la Recopa de Europa en 1973 y el subcampeonato de la Copa de Europa de 1975 y a nivel nacional: tres Ligas inglesas (1969, 1974, 1992), una FA Cup, una Copa de la Liga de Inglaterra y 2 Community Shield.\n\nHistoria\n\nOrígenes\nEl Leeds United F. C. se fundó a finales de 1919 tras la desaparición del Leeds City Football Club ​. En 1920 fue elegido para participar en Football League One. El equipo dirigido por Arthur Fairclough terminó en un 14.º puesto venciendo 14 partidos y empató otros diez. Los goleadores de este equipo eran Tommy Howarth y Robert Thompson​.\nLa temporada siguiente Leeds United acabó en un octavo lugar.\n\nEn la temporada 1922-23 el Leeds fue subiendo puestos en la clasificación. Este año se incorporó al equipo el interior derecho Percy Whipp.\nEn la temporada siguiente, con el fichaje de Joe Richmond, Leeds United consiguió terminar campeón y ascendió a la Football League Championship que por entonces era la máxima categoría del fútbol inglés.\nLa primera temporada en primera división no fue fácil pero el equipo pudo terminar la temporada en 18.º lugar fuera de los puestos de descenso.\nLeeds United tuvo tres temporadas consecutivas en primera división antes de finalizar la década de 1920 con el descenso​.\nEn 1932 Leeds United volvió a la máxima categoría con un gran equipo que contaba con jugadores como Charlie Keetley, Joe Firth, Billy Furness, Ernie Hart y Wilf Copping. El equipo se mantuvo en la máxima categoría hasta 1939 en que estalló la Segunda Guerra Mundial​.\nDurante la guerra las instalaciones de Elland Road fueron usados por la administración militar​ y al terminar la contienda los jugadores volvieron al club pero la primera temporada tras la guerra (1946-47) Leeds United quedó último ganando solo seis partidos​. Al siguiente año la temporada fue mala y a punto estuvo de volver a bajar de categoría.\n\nDurante el resto de la década el Leeds United se mantuvo en medía tabla. La temporada 1949-50 terminó con un meritorio quinto puesto y alcanzó los cuartos de final de la FA Cup cayendo por un estrecho margen contra el Arsenal FC en el estadio de Highbury.…",

      "history": "Ipswich Town Football Club es un equipo de fútbol profesional de Inglaterra con base en la ciudad de Ipswich, Suffolk. Desde la temporada 2026-27 compite nuevamente en la Premier League, máxima categoría del fútbol inglés.\nEl club fue fundado en 1878 pero no se convirtió en profesional sino hasta 1936, y poco después fueron elegidos para unirse a la Football League en 1938. Tiene una larga y fiera rivalidad con el equipo de Norwich City, sus vecinos más cercanos al norte de Norfolk, con quienes han disputado el East Anglian Derby 134 veces desde 1902.​\nGanó la Primera División en la temporada 1961-62 y la FA Cup en la edición 1977-78 aunque su mayor logro fue la obtención de la Copa UEFA en la edición de 1980-81.\n\nHistoria\n\nPrimeros años en Football League\nEl club fue fundado como un equipo amateur en 1878. Conocido como Ipswich Association F.C. hasta 1888 cuando se fusionaron con el Ipswich Rugby Club para formar el Ipswich Town Football Club,​ el equipo ganó una serie de competiciones locales, incluyendo la Suffolk Challenge Cup y la Suffolk Senior Cup.​ Se unieron a la Southern Amateur League en 1907 y con sus resultados mejorando paulatinamente, se convirtieron en campeones en la temporada 1921-1922.​ El club ganó la liga en 3 ocasiones más, la 1929-1930, 1932-1933 y 1933-1934, antes de convertirse en miembros fundadores de la Eastern Counties Football League al final de la temporada 1933-1934. Un año después el club se hizo profesional y se unió a la Southern League, la cual ganaron en su primera temporada y terminaron terceros en la siguiente.​\nIpswich fue elegido para participar de la Football League el 30 de mayo de 1938 y fue inscrito en la Tercera División (Sur), donde permaneció hasta la temporada 1953/54, en la que se consagró campeón y logró el ascenso a la Segunda División. \n\nAscenso y éxito en First Division\nEl club fue relegado nuevamente la siguiente temporada a la Tercera División (Sur), donde no logró buenos resultados hasta que Scott Duncan fue reemplazado por Alf Ramsey en 1955. El equipo logra hacerse con la Tercera División (Sur) la temporada 1956/57 retornando a la Segunda División. Esta vez el Ipswich logró establecerse como uno de los mejores equipos, logrando el campeonato de la Segunda División en la temporada 1960/61, y también su primer ascenso a la First Division. Gracias a Leo maximo goleador de la categoría, para alcanzar la máxima categoría del fútbol inglés en aquella época.​…",

    "351": {
      "qid": "Q19490",

      "wikiUrl": "https://es.wikipedia.org/wiki/Nottingham_Forest_Football_Club",
      "history": "El Nottingham Forest Football Club es un club de fútbol de Inglaterra de la ciudad de Nottingham en los Midlands del Este. Fue fundado el 1 de enero de 1865. Desde la temporada 2022-2023 juega en la Premier League, la máxima categoría del fútbol inglés, luego de ganar el play-off de ascenso en la Championship después de 23 años. Fue, además, campeón consecutivo de la Copa de Europa —actual Liga de Campeones de la UEFA— en 1979 y 1980. Disputa sus encuentros como local en el City Ground, con capacidad para 30 500 espectadores.\nFue uno de los miembros fundadores de la Football Alliance en 1889 y su primer gran éxito lo consiguió en 1898 al ganar la FA Cup. Pasó gran parte del siglo XX en la Segunda División y su segundo gran trofeo vino en 1959 cuando ganó una nueva FA Cup. El período de mayor éxito del club vino de la mano de Brian Clough, que llegó al club en 1975. Bajo su dirección el Nottingham Forest ascendió a la Primera División, fue campeón de Inglaterra en 1978, ganó dos Copas de Europa consecutivas y la Supercopa de Europa 1979, con lo que es el único club europeo que ha ganado más Copas de Europa que ligas nacionales, y tiene en su palmarés cuatro League Cup y una Community Shield.\nParticiparon en 1992 en la primera temporada de la Premier League. Desde entonces ha sufrido una serie de descensos y ha llegado a caer en 2005 a la League One, la Tercera División. Tras tres temporadas en el tercer nivel del fútbol inglés consiguió el ascenso al Championship, en el cual estuvo catorce temporadas y luego ascendió a la Premier League.\nDespués de la salida de Brian Clough, el Nottingham Forest ha tenido una crisis institucional que lo ha perseguido hasta el año 2022, después de ascender a la Premier League.\nEl rival histórico del Nottingham Forest es el Derby County, al que se enfrenta en el derbi de los Midlands del Este donde se juegan el Trofeo Brian Clough. Otros rivales del Forest son el Notts County, el Leicester City y el Sheffield United. Durante los años 1970 y los 80 existió una gran rivalidad entre el legendario Liverpool y el Nottingham Forest.\n\nHistoria\n\nEl Nottingham Forest Football Club se fundó en 1865 en una reunión en el Clinton Arms de la calle Shakespeare. Se acordó también que el color representativo del nuevo club que acababa de nacer sería el rojo. El 22 de marzo de 1866 se disputó el primer partido oficial del Nottingham Forest ante sus rivales locales, el Notts County. Contra la creencia popular, el apelativo Forest no proviene del bosque de Sherwood sino del Forest Recreation Ground, donde se jugaba al shinty y al fútbol.…",

ony Pulis renunció a su cargo días antes de jugar la primera fecha, cuestionando la política de fichajes del club.​ Neil Warnock fue sucedido en su lugar, pero en la mitad de la campaña Crystal Palace se encontraba en puestos de descenso, por lo que fue despedido el 27 de diciembre, un día después de haberse jugado la fecha 18.​ Alan Pardew fue contratado para ocupar su cargo y el club quedó ubicado en el puesto 10 de la tabla al finalizar la temporada.​…",

      "history": "El Brighton & Hove Albion Football Club (pronunciación en inglés: /ˈbraɪtən ənd ˈhoʊv ˈælbiən/) es un club de fútbol británico con sede en la ciudad costera de Brighton & Hove, Sussex del Este. Su casa es el Falmer Stadium y juega en la Premier League, la máxima categoría del fútbol nacional. \nFundado en 1901, el equipo fue apodado «Gaviotas», en parte debido a que la ciudad se encuentra a orillas del mar y en parte como respuesta al apodo de «Águilas» de su tradicional rival, el Crystal Palace. Anteriormente se los conocía como «Delfines» o «camarones». El equipo ha jugado históricamente con camiseta a rayas azules y blancas, aunque la cambiaron por una completamente blanca en un periodo breve en la década de 1970 (en la época de Freddie Goodwin) y a una completamente azul durante la época de mayor éxito, al principio de la década de 1980.\n\nHistoria\nFundado en 1901, el Brighton desempeñó sus primeros pasos en el fútbol profesional en la Southern Football League, antes de ser elegidos para jugar en la Liga de Fútbol en 1920. El club tuvo su época más gloriosa entre 1979 y 1983 cuando subió a la ya inexistente Football League First Division. En 1983 llegaron a jugar la final de la FA Cup contra el Manchester United. Empataron 2-2 el primer partido, pero perdieron 4-0 en el segundo, el de repetición. Quedaron relegados de la Primera División esa misma temporada. Una mala gestión del club les llevó a ser casi relegados de la Football League Championship a la Football Conference, lo que evitaron en 1997 y 1998. En 2001 alcanzaron el Campeonato de la división. Lograron una segunda promoción, pero descendieron en la siguiente temporada. Consiguieron la promoción en el primer intento, pero las gaviotas bajarían de nuevo dos años más tarde.\n\nLlegada de Tony Bloom y ascenso a la Premier League (2009-presente)\nEn 2009 el club fue comprado por Tony Bloom, jugador de póker profesional oriundo de la ciudad de Brighton. El club se encontraba en la League One (tercera división).​\nBajo su gestión, impulsó la construcción del Falmer Stadium, inaugurado en 2011. En la temporada 2010-2011 logró el ascenso a la Championship bajo la dirección del uruguayo Gustavo Poyet, saliendo campeón de la categoría.\nEn la temporada 2016-2017 lograron hacer historia al asegurarse un puesto para jugar en la primera división inglesa, Premier League.​…",

      "history": "El Brentford Football Club es un club de fútbol inglés, de la ciudad de Brentford en Londres, Reino Unido. Fue fundado en 1889 y juega desde la temporada 2021-2022 en la Premier League por primera vez en su historia, en su regreso a la máxima división del futbol inglés después de 74 años.\n\nHistoria\nFundado en 1889 para servir como deporte de invierno para los remeros del Brentford Club, el club pasó sus primeros años en las divisiones inferiores de la Liga de Fútbol. Su sede es el estadio Griffin Park desde 1904. En 1921, fue uno de los miembros fundadores de la Tercera División de la Southern League. Durante finales de los años 1920 y los años 1930, el club comenzó a hacer el verdadero progreso. En la temporada 1929-30, el equipo ganó todos los 21 partidos en casa en la Tercera División de la Southern League (un registro que todavía está en pie en el fútbol inglés), pero todavía saltado la promoción. Después de varios intentos más, la promoción a la Segunda División finalmente fue conseguida en 1932-33. Dos años más tarde, Brentford alcanzó la Primera División y terminó quinto en su temporada de debut -que es la posición más alta conseguida por el club en la liga- para completar una subida notable para el club. El Brentford consiguió su ubicación más impresionante en la liga para el resto de la década (60 en las dos temporadas siguientes) antes de la Segunda Guerra Mundial.\nDurante la guerra, Brentford compitió en la Copa de Guerra de Londres, que pierde en la final en 1941 en el Estadio Wembley frente al Reading y gana la final contra Portsmouth un año más tarde. El club fue relegado en la primera temporada después de la Guerra, y un descenso en espiral, que culminó con la relegación a la Tercera División en 1953-54 y la Cuarta División en 1961-62. La supervivencia de Brentford FC fue amenazada por una entrada en funciones proyectada por el Queen's Park Rangers FC a finales de los años 1960, una oferta que solo fue por poco apartada con un préstamo de emergencia de 104,000 libras esterlinas, mientras el club siguió tambaleando entre las terceras y cuartas divisiones durante las próximas tres décadas. El club ganó la promoción en 1962-63, 1971-72 y 1977-78 pero solo en la ocasión final era ello capaz de consolidar su lugar en la tercera grada del fútbol inglés.…",

      "history": "Frosinone Calcio es un club de fútbol italiano de la ciudad de Frosinone, localizado en la provincia de Frosinone, en la región del Lacio. Fue fundado en 1906 y refundado dos veces. Desde la temporada 2026-27, disputará la Serie A, que es el primer nivel del fútbol de Italia.\n\nHistoria\n\nFrosinone se fundó en el 1906. En 1990, después de ascender con mucho sufrimiento a la Serie C1, el club fue cancelado por problemas financieros y después de ser refundado, comenzó a jugar en la Serie D. En 1994, aunque no quedó en zona de ascenso la FIGC le dejó entrar en la C2 porque había sobrado una vacante. En 1999 volvió a descender a la D después de playoffs. En 2001 volvió a la serie C2. En 2003 Maurizio Stripe comprò el club y al año siguiente ascendió a la C1.\nEn 2005 Frosinone perdió los playoff para entrar en la B pero al año siguiente finalizó segundo en la tabla, solo después del Napoli. Así pudo ascender a la B y en su primer año en esa categorìa, el club compró jugadores de renombre como come Massimo Margiotta, Francesco Lodi, Francesco Carbone, Juriy Cannarsa, Lucas Rimoldi, Fabio Di Venanzio y Andrea Mengoni. El 16 de mayo de 2015 el club consigue el ansiado ascenso y tras 87 años de historia juega por primera vez en la Serie A.​\n\nUniforme\nUniforme titular: Camiseta amarilla con vivos azules, pantalón amarillo y medias amarillas con azul.\nUniforme alternativo: Camiseta azul con vivos amarillos, pantalón azul y medias azules con amarillo.\nTercer uniforme: Camiseta blanca con franja diagonal amarilla y azul, pantalón blanco y medias blancas con azul.\n\nEvolución del uniforme\n\nEstadio\n\nEl Frosinone jugó sus partidos de local en el Estadio Comunal Matusa, inaugurado en el año 1932, que poseía una capacidad de 10 000 espectadores​ hasta el año 2017, en que se completó el traslado al Estadio Benito Stirpe, propiedad del municipio de Frosinone, que tiene una capacidad de más de 16 000 espectadores.\n\nJugadores\n\nPlantel 2026/27\n\nEntrenadores\n\nPalmarés\n\nTorneos nacionales\nSerie B (1): 2022-23\nSerie C2 (2): 1986-87 (Grupo D), 2003-04 (Grupo C)\nSerie D (2): 1965-1966 (Grupo D), 1970-1971 (Grupo F)\n\nReferencias\n\nEnlaces externos\n Wikimedia Commons alberga una categoría multimedia sobre Frosinone Calcio.\n Wikiquote alberga frases célebres de o sobre Frosinone Calcio.\nSitio web oficial (en italiano)\nFrosinone Archivado el 20 de junio de 2017 en Wayback Machine. en LegaSeriea.it\n\nFrosinone Calcio en Facebook\n\nFrosinone Calcio en X (antes Twitter)\nFrosinone Calcio en YouTube\n\nFrosinone Calcio en Instagram",

      "history": "La Unione Sportiva Sassuolo Calcio es un club de fútbol de la ciudad de Sassuolo, en la región italiana de Emilia-Romagna. Fue fundado en 1920 y utiliza camiseta negra y verde a franjas verticales, por lo que llevan el apodo de neroverdi. Desde la temporada 2025-26, tras un año de ausencia, volverá a disputar la Serie A, máxima categoría del fútbol italiano.\nOriginalmente jugaba de local en el Stadio Enzo Ricci de Sassuolo. Cuando ascendió a la Serie B en 2008, se mudó al Stadio Alberto Braglia en Módena. El Sassuolo consiguió el 18 de mayo de 2013 el ascenso a la Serie A por primera vez en su historia, por lo que se mudó al Stadio Città del Tricolore en Reggio Emilia.\n\nHistoria\n\nInicios y ascenso a Serie C2\nEl club fue fundado el 17 de julio de 1920, participando en las divisiones amateurs de Emilia-Romaña durante la mayor parte de su historia incluso hasta su primer ascenso a la Serie D en 1968. En esta época, el club se fusionó con otros equipos de fútbol local para formar finalmente al actual US Sassuolo Calcio en el año 1974.\nEn 1984 el club alcanzó su primer ascenso a la Serie C2, el nivel más bajo del fútbol profesional en Italia. Sin embargo, fueron relegados nuevamente para el año 1990 y, posteriormente, pasó la mayor parte de la década en la Serie D. Finalmente, en 1998, US Sassuolo alcanzó el segundo puesto y logró así el ascenso a la Serie C2 por segunda vez en poco tiempo.\n\nSerie C1\nLuego de una larga estadía en la Serie C2, el equipo logró en la temporada 2004-2005 el ascenso a la Serie C1 tras una dura lucha con el A.C Sansovino para alcanzar el último lugar de promoción.\n\nTras permanecer por un par de años en la Serie C1, en el año 2007 US Sassuolo contrató como técnico a Massimiliano Allegri, quien años después dirigiría a la Juventus de Turín ganando múltiples títulos. Una vez finalizada la temporada 2007-2008 logró el ascenso a la Serie B gracias al campeonato alcanzado a falta de cuatro fechas para la terminación del       "history": "Toulouse Football Club es un club de fútbol francés, de la ciudad de Toulouse en el departamento de Alto Garona (Pirineos Centrales). Fue fundado en 1970 y actualmente juega en la Ligue 1, la primera división del fútbol nacional. Fue fundado concretamente el 25 de mayo de tal año gracias al esfuerzo de Lilian Buzzichelli, importante empresario por aquel entonces de la zona franco-pirenaica.\n\nHistoria\nAunque existió otro TFC anterior al actual, lo cierto es que este sólo guarda relación con el actual en el nombre, ya que la historia del actual equipo de Toulouse se remonta a 1970, cuando el actual club es fundado concretamente el 25 de mayo de tal año por Lilian Buzzichelli, empresario por aquellos entonces de la zona franco-pirenaica. Fue él quien creó, junto con la ayuda de algunos industriales de Midi, el Union Sportive Toulouse (UST), predecesor del club aquí tratado. En un principio, el club adoptó como suyos los colores rojo y blanco tanto en el escudo como en las equipaciones. Viendo el esfuerzo aportado, son muchas las entidades que deciden colaborar con el club: El ayuntamiento les cede el Stadium; jugadores del Cadets de Gasconia y del AS Mermoz-Bonnefoy, dos equipos cercanos, vienen a jugar; Just Fontaine, un conocido jugador y entrenador de la época, se ofrece para descubrir alguna que otra promesa del fútbol. Tras todo el esfuerzo hecho, la Federación Francesa de Fútbol invitó al club a disputar el campeonato National en 1970 (campaña 1970/71).\n\nEn 1977, un cambio en la presidencia hizo que el club retomara el nombre actual, así como también se cambiaron los colores de las equipaciones por las actuales malvas. Empiezan buenos años para el equipo, el cual, en 1982 alcanza, por primera vez, la primera división. Debido al nivel, la calidad de jugadores y técnico aumenta (por aquellos entonces era Jacques Santini quien entrenaba al TFC) y, como resultado, el equipo acaba la temporada 1984/85 tercero, accediendo a la Copa de la UEFA.\nAl llegar los años 1990, la tendencia del ascensor (años entre divisiones, en este caso Ligue 1 y Ligue 2, sin consolidarse en ninguna categoría) se impuso, llegando al extremo en que, finalizada la temporada 2000-01, desciende deportivamente a la Ligue 2 y administrativamente desciende a la categoría de bronce: la División National. A pesar de perderlo casi todo salvo el estatus de club profesional y poco más, el Toulouse ascendió, de nuevo y en 2 años, a la primera división francesa, donde está desde la temporada 2003-04.…",

      "wikiUrl": "https://es.wikipedia.org/wiki/Olympique_de_Marsella",
      "history": "Olympique de Marsella, también conocido por sus siglas OM (en francés: Olympique de Marseille, en español: Olímpico de Marsella), es un club de fútbol profesional francés con sede en Marsella, Francia, que disputa la Ligue 1, máxima competición futbolística en dicho país. Fue declarada oficialmente registrada por sus socios en agosto de 1899​ con el objeto principal de la práctica y desarrollo del fútbol, si bien data sus orígenes como club polideportivo al año 1895 con su pionera sección de rugby.​ René Dufaure de Montmirail fue el principal artífice de su creación.\nExtintas algunas de sus históricas secciones, permanecen vigentes junto al fútbol la sección de atletismo y la de judo. Dicho carácter multidisciplinar fue desde sus inicios una seña de identidad estrechamente ligada a la de la ciudad, de origen griego y de la que toma su apelativo de «phocéens» (es., focenses), y que terminó también por dilucidar sus colores identitarios de blanco y azul, mismos del blasón de Marsella.\nEs considerado como uno de los clubes históricos de fútbol del país al ser uno de los que participaron en la primera edición del campeonato profesional de 1932, y el que más presencias acumula en la máxima categoría con 72. En ella posee el honor de haber sido el primer líder histórico de la competición​ y el de ser el club con más títulos tomando en cuenta los campeonatos amateur entre 1894 y 1932.​​ Completa su palmarés nacional con diez campeonatos de copa, tres campeonatos de copa liguera y tres campeonatos de supercopa.​\nEn cuanto a los logros a nivel internacional ostenta un título de la Copa Intertoto de la UEFA en 2005,​ y una Liga de Campeones de la UEFA obtenida de manera invicta en el año 1993, en la que fue la primera edición de la competición bajo el nuevo formato,​ siendo el primer club francés en conquistarla. Cabe destacar también tres subcampeonatos de la Liga Europa de la UEFA en los años 1999, 2004 y 2018.​\nEncuestas recientes entre los aficionados al fútbol francés lo sitúan como el club galo más popular, debido principalmente a sus registros deportivos, mientras que disputa sus encuentros como local en el Stade Vélodrome desde 1938,​ uno de los estadios más longevos de Francia. Desde los años 1990, sus principales adversarios son el Paris Saint-Germain, con quien se enfrenta en le Classique, y el Olympique de Lyon con quien disputa el choc des Olympiques. En cuanto a sus rivales más históricos son el Saint-Étienne y el Girondins de Burdeos.\n\nHistoria\n\nOrigen y primeras conquistas locales (1899-1920)…",

      "wikiUrl": "https://es.wikipedia.org/wiki/Association_de_la_Jeunesse_Auxerroise",
      "history": "La Asociación Juvenil Auxerre —en francés, Association de la Jeunesse Auxerroise—, conocido también como AJ Auxerre, es un club de fútbol francés, de la ciudad de Auxerre en Borgoña. Fue fundado en 1905, y competirá en la Ligue 1, la primera categoría del fútbol francés, a partir de la temporada 2024-25, tras haber ascendido.\n\nHistoria\nEl AJ Auxerre fue fundado el 29 de diciembre de 1905 por el abad Ernest Deschamps. El AJ Auxerre empezó siendo un club polideportivo en el que había diferentes secciones. La sección de fútbol se creó en 1906.\nEn 1964, asume la dirección técnica Guy Roux.\nEn 1980, el equipo debuta en la Ligue 1 francesa.\nEn 1994 el Auxerre consigue su primer título, la Copa de Francia.\nEn la temporada 1995-96, Auxerre hace historia al consagrarse campeón por primera vez en su historia de la Ligue 1. Además, también ganó la Copa de Francia, obteniendo el doblete. Laurent Blanc, Corentin Martins, Lilian Laslandes, Taribo West, Stéphane Guivarc'h, Lionel Charbonnier, Yann Lachuer, Fabien Cool, Sabri Lamouchi, entre otros futbolistas, fueron los protagonistas de aquellos años de gloria. En la siguiente temporada, el club no pudo repetir la excelente campaña anterior y finalizó 6° en la Liga de Francia. Como campeón de Francia disputó la UEFA Champions League 1996-97, compartiendo grupo con Ajax, Rangers y Grasshopper. Terminó como líder del grupo, pero fue eliminado en cuartos de final por el futuro campeón Borussia Dortmund.\nEn la década del 2000, Auxerre ganó dos Copas de Francia, todavía con Guy Roux como entrenador.\nEl 13 de mayo de 2012, la estadía de 32 años del Auxerre en la primera división llegó a su fin después de una derrota a domicilio por 3-0 a manos del Marsella.\nAuxerre es un club muy particular por su historia, su pequeña ciudad, su estilo de juego, no muy similar al resto de clubes franceses, su historia, y su gente. El antiguo e histórico jugador del Auxerre Éric Cantona, salido de la cantera del equipo, ha declarado sobre su antiguo club: \"Francia no merece al Auxerre. Inglaterra sin duda, pero no Francia.\" Declaraciones impactantes para la época.\n\nUniforme\nUniforme titular: Camiseta blanca, pantalón blanco y medias blancas.\nUniforme alternativo: Camiseta negra, pantalón negro y medias negras.\n\nEstadio\nStade de l'Abbé-Deschamps, fundado el 13 de octubre de 1918 con el nombre de Stade de la Route de Vaux. En 1950 el estadio se cambió el nombre por el actual en honor al fundador del club, que acababa de fallecer ese año. El estadio tiene una capacidad de 23.467 personas.\n\nDatos del club\nTemporadas en la Ligue 1: 25…",

      "wikiUrl": "https://es.wikipedia.org/wiki/Lille_Olympique_Sporting_Club",
      "history": "Lille Olympique Sporting Club, comúnmente conocido como Lille O. S. C. o, simplemente, LOSC es un club de fútbol francés con sede en la ciudad de Lille (Norte), Alta Francia. El club fue fundado en 1944 como resultado de una fusión entre el Olympique lillois y el Sporting Club fivois. Actualmente juega en la Ligue 1, la primera división del fútbol francés. El Lille anteriormente jugó sus partidos de local en el estadio Lille-Metropole en las cercanías de Villeneuve-d'Ascq. En 2012, el club se mudó a su nuevo estadio, el Stade Pierre-Mauroy.\nEl Lille fue fundado como resultado de una fusión entre el Olympique Lillois y el S. C. Fives. Ambos clubes fueron miembros fundadores de la División 1 francesa y el Lillois fue el campeón inaugural de la liga. Bajo el emblema del Lille, el club ha ganado cinco títulos de liga en 1933, 1946, 1954, 2011 y 2021 además de seis títulos de Copa de Francia, el cuarto club con más títulos de Copa. El Lille, el Red Star F. C. y el París Saint-Germain son los únicos equipos franceses en la historia de la competición que han ganado la Copa de Francia en tres temporadas consecutivas. El período más exitoso del Lille fue la década de 1946-1956, cuando el equipo fue dirigido por los entrenadores George Berry y André Cheuva.​​\nEl club tiene una tradicional rivalidad con sus vecinos del Racing Club de Lens. Los dos clubes regularmente disputan el Derby du Nord.\n\nHistoria\n\nOrígenes y primeros éxitos\nEl Olympique Lillois fue fundado en 1902 Su primer presidente fue André Nicodème. En 1933, el equipo ganó su primera Liga. El equipo tuvo diferentes nombres: O.I.C.L. (Olympique Iris Club de Lille) (1941 - 1944), Stade Lillois (1944) después de la fusión con el SC Fives, y el 23 de noviembre de ese mismo año finalmente se cambia el nombre por el actual.​\nEn 1946, el equipo se convierte en el primer ganador de la historia de la Ligue 1 francesa (formato de competición de la liga francesa de fútbol que se mantiene desde entonces).​ Además en esa temporada un jugador del equipo, René Bihel, es el máximo goleador al marcar 28 goles, con lo que se convierte en el primer jugador en obtener dicho galardón. El Lille OSC es el mejor club de Francia entre los años 1945 y 1955, junto con el Stade de Reims, ganando varias Copas y Ligas.\n\nDeclive deportivo y financiero\nEn 1956, el Lille vive su primer descenso a la Ligue 2,​ y entraría en un periodo gris. Entre los años 1970 y 2000, el equipo navega entre la primera y la segunda liga francesa y tiene problemas financieros.…",

    "522": {

      "history": "Olympique Gymnaste Club de Nice abreviado como O. G. C. Nice o también conocido por parte de la comunidad hispanohablante como O. G. C. Niza, es un club de fútbol francés, de la ciudad de Niza en Provenza-Alpes-Costa Azul. Fue fundado en 1904 y juega en la Ligue 1 de Francia.\n\nHistoria\nEl OGC Nice fue fundado el 9 de julio de 1904 con el nombre de Gymnaste Club como un club de Gimnasia. EL 6 de julio de 1908 se crea la sección de fútbol. El 22 de diciembre de 1924 el club se fusiona con otro equipo de la ciudad, el Gallia Football Athlétic Club de Nice, y el nuevo equipo se cambiará el nombre por el de Olympique Gymnaste Club de Nice . En 1932 el equipo se vuelve profesional.\nEn 1951 el equipo gana su primera Liga. Su último logro importante fue la obtención de la Copa de Francia en 1997.\nCon el objetivo de llevarlo a grandes metas deportivas en Francia y Europa, la multinacional`británica de productos químicos Ineos compró el equipo en agosto de 2019, por un valor de mercado de 100 millones de euros.​\n\nTrayectoria histórica\n\nUniforme\nUniforme titular: Camiseta con franjas verticales rojas y negras, pantalón negro y medias negras.\nUniforme alternativo: Camiseta blanca, pantalón blanco y medias blancas.\nTercer uniforme: Camiseta azul, pantalón negro y medias negras.\nEn un principio el color del equipo era el amarillo y el azul, hasta que en 1910 el club jugó un torneo contra el AC Milan. En ese partido el Milan prestó el uniforme (camiseta roji-negra) al Niza, ya que el equipo se había olvidado las equipaciones en Francia. Entonces los nizardos deciden que esos serán sus colores.\n\nUniforme titular\n\nUniforme alternativo\n\nTercer uniforme\n\nCuarto uniforme\n\nPatrocinio\n\nEstadio\n\nEl OGC Niza ha contado con dos estadios a lo largo de su historia. El Stade du Ray fue inaugurado en 1927 y utilizado hasta 2013. Debido a su poca capacidad. Desde entonces ejerce de local en el Allianz Riviera. Posee un aforo para 35 000 espectadores.\nOGC Nice jugó su primer partido en el Allianz Riviera el 22 de septiembre de 2013 contra Valenciennes (4-0), con motivo de la 6 ª jornada de la temporada 2013-2014 en la Ligue 1. El delantero argentino Darío Cvitanich es el primer goleador de Niza en marcar en la nueva arena. El récord de asistencia actual es de 35.596 espectadores durante el partido OGC Nice - AS Saint-Etienne (2-0) el 7 de mayo de 2016.\n\nRivalidades…",

    "523": {
      "qid": "Q704",
      "name": "Olympique Lyonnais",
      "esName": "Olympique de Lyon",
      "tla": "LYO",
      "league": "FL1",
      "founded": 1950,
