      "wikiUrl": "https://es.wikipedia.org/wiki/Olympique_de_Lyon",
      "history": "Olympique de Lyon​ —oficialmente en francés Olympique Lyonnais (pronunciación en francés: /ɔlɛ̃pik ljɔnɛ/)—, también conocido como OL, es un club de fútbol con sede en la metrópoli de Lyon, Francia. Actualmente participa en la Ligue 1. Es uno de los equipos más populares y el cuarto más laureado en la historia del fútbol francés, con siete campeonatos de Ligue 1. Disputa sus encuentros como local en el estadio Parc Olympique Lyonnais, con capacidad para 59.186 espectadores.\nEl club Lyon Olympique Universitaire (LOU, Universidad Olímpica de Lyon) se formó en 1896, de acuerdo con muchos partidarios y los historiadores del deporte, pero no se estableció a nivel nacional como un club profesional. En 1950 vio la fundación oficial del Olympique Lyonnais, por disidentes del LOU que querían hacer un club profesional de nivel nacional en Lyon. Su período más exitoso ha sido los años 2000. El club ganó su primer campeonato de la Ligue 1 en 2002, iniciando una racha récord de siete títulos nacionales consecutivos. El Lyon también ostenta en su palmarés ocho Trofeos de los Campeones, cinco Copas de Francia, una Coupe de la Ligue, y tres Campeonatos de la Ligue 2. Ha aparecido en la UEFA Champions League en once ocasiones y durante la temporada 2009-10 llegó a las semifinales de la competición por primera vez después de tres apariciones anteriores en los cuartos de final.\nEl Lyon era un miembro del G-14 grupo de clubes líderes europeos de fútbol y son miembros fundadores de su sucesora, la Asociación de Clubes Europeos. El presidente del Lyon es Jean-Michel Aulas. El club es dirigido por Laurent Blanc.\nEl OL es uno de los clubes más populares de Francia. Alrededor de un 11 % de la población del país apoya al club, esto es cerca de 7 millones de personas. Es, por tanto, el tercer equipo más seguido en Francia, por detrás del Olympique de Marsella y el Paris Saint-Germain respectivamente. Además, fue el club más rico del país en la temporada 2008-09, en la que generó un flujo de ingresos anuales de 139,6 millones de euros de acuerdo a los contadores Deloitte. Posee un equipo femenino (OL Lyonnes), cuyos éxitos son superiores a los de su par masculino en el plano local, siendo el club más laureado de Francia, consiguiendo 18 Ligas (récord), 10 Copas de Francia (récord) y 3 Supercopas de Francia (récord), y en Europa son aún mayores sus éxitos coronándose en 8 ocasiones, 5 de ellas consecutivas de la Liga de Campeones Femenina de la UEFA (2016, 2017, 2018, 2019 y 2020), siendo el club más laureado en la máxima competición continental.…",
      "historySource": "https://es.wikipedia.org/wiki/Olympique_de_Lyon",
      "honours": "En el total de sus secciones, el club cuenta con 9 títulos internacionales (1 en fútbol y 8 en fútbol femenino) y 23 títulos nacionales (7 en fútbol y 16 en fútbol femenino).\nTorneos nacionales (21)\nTorneos internacionales (1)\nPalmarés total\nOtros logros\nSemifinal UEFA Champions League (2): 2009-10, 2019-20.\nSemifinal UEFA Europa League (1): 2016-17.\nMedios de comunicación\nOtros equipos\nEquipo femenino\nVéase también…",

      "history": "Paris Saint-Germain Football Club, conocido popularmente por sus siglas PSG, es una entidad polideportiva francesa con sede en París, la capital de Francia. Fue fundada el 12 de agosto de 1970 tras la fusión del Paris Football Club y el Stade Saint-Germain. Disputa sus encuentros como local en el estadio Parc des Princes (en español: Parque de los Príncipes), con capacidad para 47 929 espectadores, siendo la sede del Paris Saint-Germain desde 1973,​​ mientras que el Camp des Loges ha estado funcionando como centro de formación para el club desde 1974.​ \nDisputa la Ligue 1, máxima categoría del fútbol francés, donde ha ganado trece Ligas, dieciséis Copas, nueve Copas de la Liga, catorce Supercopas y una Ligue 2, convirtiéndolo en el club más laureado de Francia con 54 títulos oficiales a nivel nacional.​ Con 7 títulos, es el club francés con el mayor número de títulos internacionales obtenidos, tras haberse coronado campeón de la Recopa de Europa de 1996, la Copa Intertoto de 2001, dos veces de la Supercopa de Europa en 2025 y 2026, dos veces de la Liga de Campeones de la UEFA en 2024-25​ y 2025-26,​ y la Copa Intercontinental de la FIFA de 2025.​ También resultó subcampeón de la Copa Mundial de Clubes de la FIFA 2025 y de la Liga de Campeones en 2019-20, perdiendo contra el Bayern de Múnich 1-0 en la final, además de ser tres veces semifinalista. El club fue nombrado el mejor equipo del año por la IFFHS en 1994​ y 2025, además de lograr el primer puesto en la clasificación por equipos de la UEFA en 1998.​\nPSG es el primer y único equipo francés en conseguir el póker doméstico,​ logro que ha alcanzado en cuatro temporadas distintas.​ Asimismo, es el único equipo francés que ha logrado un bicampeonato de Liga de Campeones entre 2024-25 y 2025-26, además de un triplete,​ al proclamarse campeón de la Ligue 1, Copa de Francia y Liga de Campeones en la temporada 2024-25.​ En 2025 logró un hito histórico al convertirse en el primer y único club francés y en el tercer equipo europeo en lograr un sextete (tras sumar a los títulos anteriores la Supercopa de Europa, la Copa Intercontinental de la FIFA y la Supercopa de Francia).​\nEs el único club francés que integra el grupo de los 32 clubes en el mundo que han ganado el máximo campeonato de clubes de fútbol a nivel mundial.​ La hazaña se concretó el 17 de diciembre de 2025 en el Estadio Áhmad bin Ali de Catar ante el representante de la Copa Libertadores, el Flamengo de Brasil, resolviéndose a favor de los franceses en la tanda de penaltis (2-1) tras igualar a un tanto en los 90 minutos.​​…",

      "history": "Football Club Lorient, comúnmente conocido como F. C. Lorient, es un club de fútbol francés, de la ciudad de Lorient en Bretaña. Fue fundado en 1926 y juega desde la temporada 2025-26, en la Ligue 1, la máxima categoría del fútbol francés.\n\nHistoria\nEl Football Club Lorient-Bretagne Sud fue fundado el 2 de abril de 1926 gracias a una reunión mantenida en el café Eon. El club se crea a partir de un club fundado el año anterior, La Marée Sportive.\nEn la temporada 98-99 el equipo debuta en la Ligue 1.\nEn 2002 el club gana su primer título profesional, la Copa de Francia.\nEn octubre de 2009, el club llegó a situarse en quinta posición. El Lorient, finalmente, terminó la campaña en el séptimo puesto; su mejor resultado de la historia en la Ligue 1.\n\nUniforme\n\nUniforme titular: Camiseta naranja, pantalón negro y medias blancas.\nUniforme alternativo: Camiseta blanca, pantalón blanco y medias blancas.\nTercer uniforme: Camiseta negra con mangas naranjas, pantalón negro y medias blancas.\n\nEstadio\nStade du Moustoir, es un estadio francés inaugurado en 1959 con capacidad para 18.890 personas, situado en la ciudad portuaria de Lorient. Es el campo de fútbol del F. C. Lorient, y recibe el nombre del barrio en el que está ubicado. Con una capacidad original para 6000 espectadores; tras su remodelación y ampliación en 1998, y con la construcción de la nueva tribuna sur, inaugurada en 2010, su capacidad ascendió a 18 500 espectadores (18 110 asientos).\n\nRivalidades\nSus principales rivales son los componentes del Derbi bretón, el F. C. Nantes y el Rennes, y en menor medida, el E. A. Guingamp y el Stade Brestois 29.\n\nJugadores\n\nPlantilla actual\n\nPalmarés\n\nNota: en negrita competiciones vigentes en la actualidad.\n\nReferencias\n\nEnlaces externos\n Wikimedia Commons alberga una categoría multimedia sobre Football Club Lorient.\nSitio web oficial (en francés)\nWeb no oficial Archivado el 17 de febrero de 2011 en Wayback Machine. (en francés)"       "history": "El Stade Rennes F. C. —oficialmente en francés: Stade Rennais Football Club—, comúnmente conocido como Stade Rennes, es un club de fútbol francés, de la ciudad de Rennes en Bretaña. Fue fundado en 1901 y juega en la Ligue 1, la primera división del fútbol nacional.\n\nHistoria\n\nOrigen y evolución del Stade Rennais Football Club (1901-1932)\nEl Stade Rennais Football Club fue fundado el 10 de marzo de 1901 por unos estudiantes como un club polideportivo.​ Su primer nombre fue Stade Rennes.​ El 4 de mayo de 1904 el club se fusiona con otro equipo de la ciudad, el FC Rennais. El nuevo equipo que saldrá de esa fusión se llamará Stade Rennais Université Club. En 1932 el club se convierte en profesional​ y en mayo de 1972 adoptará el nombre actual.​\n\nCrisis y Resurgimiento del Stade Rennais (1933-1963)\nDurante la década de 1930, el Stade Rennais Université Club enfrentó serias dificultades financieras, llevándolo a ser subvencionado por la ciudad de Rennes en 1937.​ La Segunda Guerra Mundial causó la disolución de la liga francesa de fútbol en 1939, y el Stade Rennais regresó al estatus de club amateur, compitiendo solo en la Copa de Francia y partidos amistosos.​\nEn 1943, el régimen de Vichy restableció la liga francesa de fútbol interfederal.​ A pesar de ser el único equipo de Bretaña en la División 1, el Stade Rennais solo aportó dos jugadores al equipo: Henri Guérin y Jean Prouff.​\n\nRevitalización y Ascenso del Stade Rennais (1964-1994)\nA principios de los años 90, el Rennes enfrentó desafíos, incluyendo una fallida temporada 1990-91.​ A pesar de descender en 1991-92, el club volvió a la División 1 gracias a jóvenes talentos de su academia.​ En 1993, el grupo Pinault se convirtió en su patrocinador principal.​ Desde entonces, Rennes ha mantenido su lugar en la primera división, con jugadores notables como Benjamin Bourigeaud y Romain Danzé.​\n\nTriunfos y Clasificación Histórica del Stade Rennais (1995-actualidad)\n\nEn 2019 le ganó la final de la Copa de Francia al París Saint-Germain Football Club.\nEn 2020 logró clasificarse por primera vez en su historia a la UEFA Champions League.\n\nUniforme\nUniforme titular: Camiseta roja y negra, pantalón negro y medias negras.\nUniforme alternativo: Camiseta azul, pantalón azul y medias azules.\n\nColores\n\nEvolución\n\nRivalidades\n\nSu máximo rival es FC Nantes con quien disputa el Derbi Bretón. \nTambién mantiene una tensa rivalidad con FC Lorient, EA Guingamp y Stade Brestois.\n\nEstadio…",

      "history": "Espérance Sportive Troyes Aube Champagne (en español, Esperanza Deportiva Troyes Aube de Champaña) es un club de fútbol francés (perteneciente al City Football Group), de la ciudad de Troyes en Aube (Champaña-Ardenas). Fue fundado en 1986 tal como es conocido ahora. Jugará en la temporada 2026-27, en la Ligue 1, la máxima categoría del fútbol del país, tras concretar su ascenso de la Ligue 2 en la temporada 2025-26.​\n\nHistoria\nLa historia del ESTAC, como también es llamado en Francia al Troyes, pasa por varios equipos antes de dar como resultado al actual club. Ya en 1900, el primer equipo de la ciudad francesa, el Union Sportive Troyenne (Unión Deportiva de Troyes) empieza a dar sus primeros pasos por el fútbol galo. Tras algunas décadas, en 1931, el UST se une con la Asociation Sportive de Sainte-Savine (Asociación Deportiva de Sainte Savine), un equipo de las afueras de Troyes, creando la Asociation Sportive Troyenne et Savinienne, o ASTS, haciéndose profesional en 1935. Pasó algunas temporadas en la Ligue 1 (54-55, 55-56 y 60-61) y llegó en 1956 a la final de la Copa de Francia, en la que perdió contra el Sedan: Esas fueron las mayores glorias del ASTS hasta que en 1967 desaparece el club.\nHabría que esperar hasta 1970, año de la creación del Troyes Aube Football, para que la ciudad volviera a tener un equipo de fútbol. Pocos años después, en 1973, el equipo vuelve a la gloria de la primera división francesa, en la que se mantiene hasta 1978. Tras la caída en la temporada 1978-79 a la segunda división francesa, el TAF, que queda 17.º esa campaña, desaparece. Sin embargo, años después, en 1986, la Asociation Troyes Aube Champagne lleva a Troyes la ilusión perdida del fútbol, después de pasar por todas las divisiones existentes en aquella época: 4.ª división, a la que llegó en 1987; 3.ª división, en 1990, 2.ª división en 1993 y, finalmente, la llegada a la Ligue 1 en 1999, donde se mantuvo hasta 2003.\nEn 2000, tuvo que cambiar su nombre por el actual debido a que el anterior era el usado por una cadena de supermercados francesa. Ganó una de las tres finales de la Copa Intertoto en la temporada 2001-02 y, aunque descendió a la Ligue 2 en 2003 y estuvo a punto de volver a descender en 2004 a National, ascendió en 2005 de nuevo a la D1, el nombre por el que también se habla de la Ligue 1.En la temporada 2005/2006 acabó 17.º y estuvo a punto de descender a Ligue 2, lo cual finalmente se dio en la temporada 2006/2007. ahora Troyes vuelve a jugar para la temporada 2013 en la Ligue 1 luego de quedar tercero en la Ligue 2.…",

      "history": "El Le Mans Football Club —club denominado desde 1985 hasta 2010: Mans Union Club 72— es un club de fútbol francés, de la ciudad de Le Mans en Países del Loira. Fue fundado en 1985, y liquidado en octubre de 2013, perdiendo su estatus profesional. El club fue refundado en 2014, y desde la temporada 2026-27 se desempeñará en la Ligue 1, la máxima división del fútbol en el país.\n\nHistoria\nEn 1889 se funda la US Le Mans, club polideportivo que crea una sección de fútbol en 1902.\nEl 12 de junio de 1985 surge el Le Mans Union Club 72 de la unión del US Le Mans y de le Stade Olympique du Maine .\nEn la temporada 03-04 el equipo debuta en la Ligue 1.\nEl club que anteriormente se denominaba Le Mans Union Club 72 desde 1985–2010, cambió su nombre el 1 de julio de 2010 al de Le Mans Football Club. Le dicen el Millonario.\nLa Federación Francesa de Fútbol excluyó al Le Mans FC de todas sus competiciones debido a la gran cantidad de deudas financieras generadas por el despilfarro de dinero, empezando por el MMArena.\nEn octubre de 2013 se anuncia la desaparición del equipo, tras descender en la temporada 2012-13 a la tercera división francesa.\nEn junio de 2019 asciende a la segunda división francesa. El equipo solo permaneció durante la temporada en la Ligue 2, ya que en el mes de marzo de 2020 la competición fue suspendida con 28 partidos disputados debido a la irrupción de la pandemia de COVID-19, en ese momento el Le Mans se encontraba en la 19.ª posición, en mayo de 2020 la federación declaró la temporada finalizada con los resultados obtenidos hasta marzo, por lo que el Le Mans fue descendido a la tercera categoría, el club intentó impulsar una propuesta para ampliar la Ligue 2 a 22 equipos pero fue descartada por las autoridades del fútbol francés.​\nEn mayo de 2025 el club logró regresar a la Ligue 2 al finalizar en segundo lugar en la temporada del Championnat National.​\nEn agosto de 2025 el Le Mans fue adquirido por el consorcio brasileño OutField, el cual está integrado por el tenista Novak Djokovic; los corredores de Fórmula 1 Felipe Massa y Kevin Magnussen y los empresarios Georgios Frangulis y Thierry Gomez.​En febrero de 2026 el portero belga Thibaut Courtois se integró como accionista del club a través de su fondo de inversión NxtPlay.​…",

      "history": "Racing Club de Lens, comúnmente conocido como R. C. Lens, es un club de fútbol de la ciudad de Lens en Alta Francia, fundado en 1906. Actualmente milita en la Ligue 1, la máxima categoría del fútbol francés, de la que se consagró campeón en 1998 y ha sido subcampeón en cinco ocasiones. Disputa sus encuentros como local en el Estadio Bollaert-Delelis, con capacidad para 38 058 espectadores.\n\nHistoria\n\nOrigen\n\nA finales del siglo XIX el fútbol empezó a difundirse por Francia. En la zona Nord-Paso de Calais surgieron varios club como el Racing Club de Roubaix (fundado en 1895), el Tourcoing (en 1898), el Amiens (en 1901), Racing Club de Arras (en 1901) o Olympique Lille (en 1902).\nEl Racing Club Lens nació en 1906 (aunque los primeros estatutos del club se firmaron en 1907), siendo los primeros presidentes los señores Lotin y Douterlungne. El nombre de Racing Club, se tomó en referencia al prestigioso Racing Club de France. Los camiseta original era a cuadros negros y verde, en referencia al carbón y a la Plaza Verde de Lens.\nEn la temporada 1907/08 participó por primera vez en la Liga de Artois. En 1914 comenzó la Primera Guerra Mundial y el Racing Club Lens tuvo que detener su actividad por culpa del avance alemán. Tras la guerra el club vuelve a recuperar su actividad bajo el patrocinio de Laroche, director del \"Comité de Auxilio Estadounidense\", quien demandó que el Racing Club Lens adoptara los colores estadounidenses: azul para la camisa, pantalones blancos y rojo para las medias.\nEn 1922 Racing Club Lens vuelve a competir en la Liga de Artois. El equipo se compone de muchos trabajadores extranjeros que se asientan en la zona del Paso de Calais, en su mayoría trabajadores polacos.\nEn 1923 el Racing Club Lens cambia de colores, por última vez, adoptando los colores rojo y oro. La tradición dice que el presidente René Moglia, adoptó estos colores al observar las ruinas de una iglesia de la ciudad, vestigio del dominio español en la reg       "history": "La Association Sportive Monaco Football Club, más conocida simplemente como A. S. Mónaco (pronunciación en francés: /ɑ.ɛs mɔnako/), es un club de fútbol monegasco que actualmente disputa la Ligue 1 de Francia, competición en la que ha participado durante más de cincuenta campañas.\n\nHistoria\nLa Association Sportive de Monaco Football Club nace en 1924 gracias a la fusión de varios equipos polideportivos de la ciudad: Swimming Club, Monaco Sports, A.S. Beausoleil, Etoile de Monaco y Riviera A.C.​ Aunque el equipo es de Mónaco, se le permitió jugar en la Liga de Francia, siéndole otorgado el número de afiliación 91 (lo que enmarca a Mónaco dentro del grupo más antiguo en la Liga).​​\nSus años como institución amateur los vivió dentro del circuito regional en Provenza-Alpes-Costa Azul, con un disímil tránsito. Integró la Ligue du Sud-Est desde 1924 y logró campeonar en la misma durante esa década y la siguiente. Todo cambió en 1932 cuando fue invitado a participar como profesional en la recientemente creada Liga de Francia por la Federación Francesa de Fútbol (FFF).​ Su andar se inicia en la Ligue 2 (Segunda División), con resultados poco satisfactorios que provocan el descenso a las ligas regionales perdiendo así su condición de conjunto profesional por varios años. En 1948, una vez finalizado el conflicto armado que detuvo la vida deportiva europea, Mónaco decide rearmarse profesionalmente gracias al impulso brindado por la monarquía monegasca, personificada en el príncipe Raniero. Durante toda su vida el príncipe sería promotor y fanático del club, aportando a la causa deportiva e impulsando su desarrollo económico con importantes donaciones y beneficios fiscales. Su generosidad se ve reflejada exitosamente para 1953, con el retorno a la máxima categoría francesa.​\n\nSurgimiento en Ligue 1: 1948-1972\n\nEl año 1958 es clave fundamental en el recorrido de las siguientes dos décadas, porque marca la llegada de un referente en la dirección técnica:       "history": "El Real Club Celta de Vigo, conocido también como Celta de Vigo,​ Real Club Celta o simplemente Celta,​ es un club de fútbol de la ciudad de Vigo, en Galicia. Su primer equipo milita en la Primera División de España y es el club gallego que ostenta más participaciones en la máxima competición nacional y el 9.º de España empatado con el Real Betis. Fue fundado el 23 de agosto de 1923 como consecuencia de la fusión del Real Fortuna y el Vigo Sporting.​ Disputa sus encuentros como local en el Estadio de Balaídos, con capacidad para 24 870 espectadores.\nUn equipo histórico en España tras disputar 60 temporadas en el Campeonato Nacional de Liga de Primera División,​ ocupando el décimo puesto histórico del campeonato,​empatado en temporadas con el noveno. En la Copa del Rey ha logrado tres subcampeonatos en 1948, 1994 y 2001, habiendo alcanzado las semifinales de la competición en ocho ocasiones. Ha sido tres veces campeón de liga en Segunda, una en Segunda B y otra en Tercera. Habiendo jugado solo 2 años fuera del fútbol profesional. \nA nivel continental, ha disputado una edición de la Liga de Campeones de la UEFA, la máxima competición de clubes en Europa, en la temporada 2003-04, en la que llegó a octavos de final y cayó ante el Arsenal, y también diez ediciones de la Copa de la UEFA/Liga Europa, alcanzando las semifinales en la campaña 2016-17. Además, ganó la extinta Copa Intertoto en el año 2000.​\nA nivel social cuenta con cerca de 40 000 abonados, contando a los abonados sin derecho a asiento (Carnet Celtista), siendo según el CIS el noveno club con mayor porcentaje de aficionados en España.​ Asimismo, mantiene una rivalidad histórica con el Real Club Deportivo de La Coruña, con quien disputa el derbi gallego, uno de los partidos con más rivalidad del fútbol español.​\n\nHistoria\n\nAntecedentes\nLa tradición del fútbol en Galicia data de finales del siglo XIX. Fue en Vigo donde esta modalidad deportiva tuvo sus primeras manifestaciones. El fútbol comenzó a practicarse en los ya desaparecidos muelles de la ciudad por los trabajadores británicos de Eastern Telegraph Company Ltd.,​ empresa instalada en 1873 en Vigo para encargarse de la instalación del cable telegráfico entre Gran Bretaña y la Península. Esta compañía promovió en 1895 el primer equipo estable de la ciudad del que se tiene constancia en la prensa, llamado Exiles Cable Club,​ el cual disputó varios encuentros contra tripulaciones mercantes y militares británicas de paso por la ciudad.​ Al poco tiempo nacieron sociedades mixtas de gallegos y británicos como el Petit F.C.…",

      "history": "El Sevilla Fútbol Club, S.A.D. es un club de fútbol español organizado como sociedad anónima deportiva. Tiene su sede en Sevilla, capital de la comunidad autónoma de Andalucía, y actualmente juega en Primera División. Fue fundado el 25 de enero de 1890​​ y su primer presidente fue el vicecónsul británico Edward Farquharson Johnston.​ Posteriormente fue inscrito en el registro de asociaciones el 14 de octubre de 1905, siendo su presidente el jerezano José Luis Gallegos.\nEl estadio Ramón Sánchez-Pizjuán, propiedad del club, es el escenario que utiliza el primer equipo para jugar sus partidos oficiales como local. Está situado en el barrio de Nervión y debe su nombre al que fuera presidente durante diecisiete años.\nActualmente tiene capacidad para 43.864 espectadores.​\nCuenta en su palmarés con varios trofeos y títulos que lo convierten en el equipo con más títulos regionales, nacionales e internacionales de Sevilla y de toda Andalucía. En el ámbito doméstico ha sido campeón de Liga en una ocasión (1945-46) y subcampeón cuatro veces, ha ganado cinco Copas del Rey y una Supercopa de España. A nivel internacional es el máximo vencedor de la Copa de la UEFA habiéndola ganado en siete ocasiones (cuatro de ellas como Europa League), además de también haber logrado una Supercopa de Europa en el año 2006. En la Liga de Campeones de la UEFA su mejor resultado fueron los cuartos de final de 2018. Ha militado 78 temporadas en Primera División y 13 en Segunda. El Sevilla F. C. está ubicado en la sexta posición de la clasificación histórica de la Liga Española de Fútbol.​ Fue designado por la Federación Internacional de Historia y Estadística de Fútbol como el mejor club del mundo en 2006 y 2007.​ Cuenta con diversos equipos en categorías inferiores, como el Sevilla Atlético, fundado en 1950 y que actualmente juega en Primera Federación.\nEn 2005 celebró el centenario de su fundación con gran cantidad de actos sociales y deportivos, habiendo quedado entre los más populares el himno del centenario, la bandera y logo diseñados para el aniversario o la portada especial de la Feria de Abril de dicho año, así como la concesión de la Medalla de Andalucía. En 2019 recibió del Consejo Superior de Deportes de España, la Placa de Oro de la Real Orden del Mérito Deportivo.​\nMantiene una histórica rivalidad con el otro equipo profesional de la ciudad, el Real Betis Balompié, con el que se enfrenta en el derbi sevillano.\n\nHistoria\n\nLos inicios del football sevillano…",

      "history": "El Real Club Deportivo de A Coruña, S. A. D. (en gallego Real Club Deportivo da Coruña ​) —anteriormente denominado Real Club Deportivo de La Coruña—,​ más conocido como Deportivo o simplemente Dépor, es un club de fútbol español de la ciudad de La Coruña, en Galicia.​ Fue fundado el 28 de marzo del 1906, lo que lo convierte en el equipo de fútbol decano de Galicia.​ En la temporada 2026-27 regresa a la Primera División luego de 8 temporadas de ausencia, de las cuales estuvo 4 en Segunda División, una en la extinta Segunda División B, y 3 en la Primera Federación. Disputa sus encuentros como local en el Estadio de Riazor, que dispone de una capacidad de 32 490 espectadores,​ siendo el estadio con mayor aforo de Galicia y el decimotercero de España.\nEl Deportivo es uno de los nueve clubes que se han proclamado campeones del Campeonato Nacional de Liga de Primera División, título conquistado en la última temporada del siglo XX, la 1999-2000, y ha logrado también cinco subcampeonatos. Ha disputado 46 ediciones de la Primera División y en la clasificación histórica ocupa el duodécimo puesto. El club también ha ganado en dos ocasiones la Copa del Rey, en 1995 y 2002, y se ha proclamado a su vez campeón de la Supercopa de España en 1995, 2000 y 2002, además de ganarle al Vigo FC la única edición completada del Concurso España en 1912.​​ A nivel continental, ha disputado cinco ediciones de la Liga de Campeones, consecutivamente entre 2000 y 2005, alcanzando las semifinales en 2004 y siendo el octavo club español con más participaciones en la competición y el cuarto con más participaciones consecutivas. También ha disputado cinco ediciones de la Copa de la UEFA y una de la Recopa de Europa, en la que también alcanzó las semifinales en 1996.\nA nivel social, es el equipo más popular de Galicia​ ya que cuenta con 30.055 socios.​Es según el CIS el noveno club con mayor porcentaje de aficionados en España.​ El club mantiene una rivalidad histórica con el Real Club Celta de Vigo, con quien disputa el derbi gallego, uno de los derbis con más tradición de España.\nEl 23 de junio de 2026, la Junta General de Accionistas de la entidad acordó el cambio de denominación social del club de Real Club Deportivo de La Coruña a Real Club Deportivo de A Coruña en castellano y Real Club Deportivo da Coruña en gallego, tras una consulta a los abonados del club que contó con una participación del 55,96% sobre el censo de abonados con derecho a voto y arrojó un resultado favorable a la modificación del nombre del 79,41% de los votos válidamente emitidos.​\n\nHistoria\n\nComienzos…",

    "576": {
      "qid": "Q126334",

      "wikiUrl": "https://es.wikipedia.org/wiki/Racing_Club_de_Estrasburgo_Alsacia",
      "history": "Racing Club de Estrasburgo Alsacia​ —oficialmente en francés Racing Club de Strasbourg Alsace​—, más conocido como Racing de Estrasburgo, es un club de fútbol francés, de la ciudad de Estrasburgo en Alsacia. Fue fundado en 1906 bajo el nombre de Erster Fußball Club Neudorf, en honor al barrio donde se estableció en Estrasburgo. Juega en la Ligue 1, la primera división del fútbol francés.​\nEl Racing es uno de los seis clubes que han ganado los tres principales trofeos franceses. Por un lado, ganó la Ligue 1 en la temporada 1978-79. Así mismo, tiene en sus palmarés tres Copas de Francia (1951, 1966 y 2001), y tres Copas de la Liga de Francia (1997, 2005 y 2019). El club también se encuentra entre los seis equipos que han jugado más de 2000 partidos en la máxima categoría de Francia (que abarcan 56 temporadas) y ha participado en 52 partidos europeos desde 1961. Ganó la desaparecida Copa Intertoto de la UEFA en la temporada 1995. A pesar de estos logros, el Racing nunca se ha podido establecer como uno de los clubes líderes de Francia, experimentando el descenso varias veces desde principios de la década de 1950. \nEl destino del club siempre ha estado ligado a la historia de la región de Alsacia. Como la región, el Racing ha cambiado de nacionalidad tres veces y tiene una historia convulsa. Fundado en lo que entonces era parte del Imperio alemán, el club insistió desde el principio en sus raíces alsacianas y populares, en oposición a los primeros clubes con sede en Estrasburgo que provenían de la burguesía nacida en Alemania. Cuando Alsacia fue devuelta a Francia en 1919, el club cambió su nombre de \"FC Neudorf\" a \"Racing Club de Estrasburgo\" imitando el nombre del club Racing Club de France Football (fundado por el mismísimo Pierre de Coubertin), un claro gesto de francofilia. Los jugadores del Racing vivieron la Segunda Guerra Mundial como la mayoría de los alsacianos: evacuados en 1939, anexados en 1940 y luchando por evitar la nazificación y la incorporación a la Wehrmacht entre 1942 y 1944. \nCuando Alsacia regresó definitivamente a Francia, la identidad de Racing cambió hacia el jacobinismo, con emocionantes victorias en la copa en 1951 y 1966 en medio de controversias franco-alsacianas. Más recientemente, el club ha estado ansioso por promover su vocación europea junto con sus fuertes lazos locales.\nEs además uno de los 10 equipos que nunca han perdido frente al F. C. Barcelona.\n\nHistoria\n\nDe Neudorf al Sueño: Los Primeros Pasos del Racing (1906-1935)…",

      "history": "El Torino Football Club, conocido simplemente como Torino o simplificado el Toro,​ es un club de fútbol italiano, de la ciudad de Turín, capital de la región de Piamonte. El equipo juega en la Serie A, la máxima categoría del fútbol profesional en Italia. Los colores tradicionales del club son el granate y el blanco.\nFundado como Foot-Ball Club Torino en 1906, está entre los clubes más exitosos de Italia con siete títulos de liga, incluyendo cinco títulos consecutivos de liga (un récord que también posee la Juventus e Internazionale) en la época del Grande Torino, ampliamente reconocido como uno de los equipos más fuertes de los años 1940. Ese equipo completo murió en la Tragedia de Superga en 1949. También ha ganado la Copa Italia cinco veces, la última de las cuales fue en la temporada 1992-93. A nivel internacional, el Torino ganó la Copa Mitropa en 1991 y fue finalista en la Copa de la UEFA 1991-92.\nEl Torino juega todos sus partidos como local en el Estadio Olímpico Grande Torino, antes conocido como Estadio Comunal. El símbolo y escudo del club es un toro desenfrenado, el símbolo tradicional de la ciudad de Turín, de la que deriva su apodo, Il Toro. El club mantiene una histórica rivalidad con la Juventus, el equipo más laureado del fútbol italiano, con quien disputa el derbi de Turín.\n\nHistoria\nLa sociedad original era el Foot-ball Club Torino, fundado el 3 de diciembre de 1906, pero debido a problemas económicos y burocráticos, el 9 de agosto de 2005 fue refundado y reinscrito en la federación italiana como Torino Football Club.\nEn 1890 nació el Internazionale Torino y en 1894 el equipo F.C. Torinese, sus padres. En los años 30, por orden del gobierno fascista, el equipo se llama Torino Calcio.\nEn la temporada 1927-1928 gana su primer scudetto.\n\nPara los años 1940, el presidente de la institución Ferruccio Novo, decide que era hora de armar un equipo con aspiraciones, y con la llegada de Ezio Loik y Valentino Mazzola (provenientes ambos del Venezia), termina de \"germinar\" lo que quedaría inmortalizado como Il Grande Torino. Cinco títulos consecutivos llevarían al Torino a lo más alto y lo harían el equipo más popular de Turín.\n\nCuando el equipo volvía de jugar un amistoso con Benfica en Lisboa el 4 de mayo de 1949, en el tramo final del vuelo del avión Fiat G.212 de Italian Airlines se produce el episodio conocido como la Tragedia de Superga en el que fallecen 18 jugadores del equipo, junto con dirigentes, entrenadores y periodistas sin ningún sobreviviente.…",

      "history": "El SpVgg 07 Elversberg Saar es un club de fútbol de la ciudad de Spiesen-Elversberg, en Alemania. A partir de la temporada 2026-27 disputará la Bundesliga, la máxima categoría del fútbol alemán, tras conseguir el ascenso desde la 2. Bundesliga en la campaña 2025-26.​\n\nHistoria\nFue fundado en el año 1907 en la ciudad de Spiesen-Elversberg, Saarland con el nombre FC Germania Elversberg, equipo que se disolvió en 1914 y constituido 4 años más tarde como Sportvereinigung VfB Elversberg y jugó en la Kreisliga Saar en la temporada 1921-22. Al terminar la Segunda Guerra Mundial, la sección de fútbol se declaró independiente y pasó a llamarse SV Elversberg VfB 07 en 1952. Jugaron en la Amateurliga Saarland (tercera división) entre 1951 y 1960, pero pasó vagando entre la Cuarta y quinta división al final de la década de los años 1980 hasta que emergió en la Oberliga Südwest (III) por 7 años. Posteriormente descenderían hasta la Verbandsliga Saarland (IV) y la Landesliga Saarland/Nordost (V), retornando al III nivel al ascender a la Regionalliga West/Südwest.\nDesde 1998 han jugado en la Regionalliga Süd (III) ocupando las posiciones de abajo de la tabla, pasando en la temporada 2008-09 a la Regionalliga West y en la temporada 2012-13 a la recién creada Regionalliga Südwest, logrando el ascenso a la 3. Liga para la temporada 2013-14.\nEn la temporada 2021-22, ganó la Regionalliga Südwest bajo la dirección del entrenador Horst Steffen, logrando el ascenso a la 3. Liga. El club continuó su ascenso al ganar la 3. Liga en la temporada 2022-23, asegurando un ascenso histórico a la 2. Bundesliga por primera vez en la historia el 21 de mayo de 2023, antes de lograr ganar la liga en la última jornada tras una victoria por 2-1 sobre el Ingolstadt.​​ En la temporada 2024-25, el SV Elversberg se aseguró el tercer lugar en la 2. Bundesliga, obteniendo un puesto en los playoffs de ascenso contra el 1. FC Heidenheim, que había terminado en el puesto 16 de la Bundesliga.​Sin embargo, fueron derrotados por 4-3 en el global, tras una derrota en casa por 2-1 que se selló en el tiempo de descuento.​\nEn la temporada 2025-26, lograron por primera vez el ascenso a la Bundesliga el 17 de mayo tras vencer al Preußen Münster por 3-0 y finalizar en la segunda colocación de la tabla.​\n\nEstadio\n\nEl club disputa sus partidos en el estadio Waldstadion an der Kaiserlinde también llamado Ursapharm-Arena, que cuenta con capacidad para 10.000 espectadores.\n\nPalmarés\n3. Bundesliga: 1\n2023\nRegionalliga Südwest: 1 (IV)\n2022\nOberliga Südwest: 2 (IV)\n1996, 1998\nVerbandsliga Saarland: 3 (IV)…",

      "history": "El RB Leipzig (oficialmente en alemán RasenBallsport Leipzig e. V., literalmente: Deportes de pelota sobre césped Leipzig, Asociación Registrada o Leipzig de manera abreviada, pronunciado /ˈʁbiː ˈlaɪptsɪç/) es una entidad deportiva de la ciudad de Leipzig, Sajonia, Alemania. Juega en la Bundesliga, máxima categoría del fútbol alemán. El equipo fue fundado en 2009 por la empresa austríaca de bebidas energéticas Red Bull GmbH, siendo el primer club del grupo empresarial creado desde cero.\nEl club partió desde la quinta y última división Alemana, ingresando al esquema del fútbol teutón comprando la licencia de otro equipo de esa misma división, el SSV Markranstädt, el cual se refundó ese mismo año. Desde entonces, el club ha alcanzado cuatro ascensos en solo siete temporadas, logrando llegar a la Bundesliga, de la que hoy es uno de los principales animadores. Disputa sus partidos como local en el Red Bull Arena, anteriormente llamado Zentralstadion.\nDebido a que las normas de la liga alemana de fútbol impiden que un equipo esté controlado directamente por una persona física o jurídica, una cláusula conocida como «regla 50+1», el R. B. Leipzig está constituido a efectos legales como un club de socios. Sin embargo, los únicos socios con derecho a voto son personas que están vinculadas directa o indirectamente con Red Bull, propietaria a su vez de varios clubes en otros países a través del consorcio Red Bull GmbH. Incluso inicialmente el club se llamaría Red Bull Leipzig, pero ante la negativa reglamentaria, buscaron un término cuyas iniciales siguieran siendo \"RB\": RasenBallsport o deporte balón-césped en español.\nEsto ha llevado a que numerosas aficiones rivales rechacen la existencia del equipo, al que consideran un ejemplo de la mercantilización del deporte profesional. Por ese motivo muchas aficiones se refieren de modo despectivo al club como Rattenball Leipzig.​ Por otro lado, sus defensores consideran que ha sido un estímulo para mejorar el fútbol en los nuevos estados de Alemania.\n\nHistoria\n\nFundación y primeros años\n\nEl nacimiento del RasenBallsport Leipzig está relacionado con las inversiones deportivas de Red Bull GmbH. La empresa de bebidas energéticas ya había adquirido clubes de fútbol en Austria (Red Bull Salzburg, 2004) y Estados Unidos (New York Red Bulls, 2006), y había planeado incursionar en el deporte alemán mediante la compra de un club ya existente, al que cambiarían los colores sociales y nombre por los de la multinacional.​…",

      "history": "El AFC Bournemouth​ (pronunciación en inglés: /ˈbɔːrnməθ/) es un equipo de fútbol inglés, de la ciudad de Bournemouth, en el condado de Dorset fundado el 1 de enero de 1890 como Boscombe St. John's Institute F. C. (y siendo reformado en 1899 como Boscombe F. C.). Desde la temporada 2022/23 juega en la Premier League, máxima categoría del fútbol de Inglaterra. Cambiaron a Bournemouth & Boscombe Athletic F. C. en 1923, antes de adoptar su actual nombre en 1972. Juegan desde 1910 en el Dean Court. Son apodados The Cherries («Los Cerezas») y sus colores son el rojo y negro.\nEl club ha sido una vez campeón de la segunda y de la tercera división inglesa, y dos veces campeón de la cuarta división. Además, a lo largo de su historia se han proclamado vencedores de la Southern League, la Football League Trophy, y la Football League Third Division South Cup.\nLa temporada 2015-16 fue la primera temporada del Bournemouth en la máxima categoría de fútbol de Inglaterra. El club fue entrenado por Scott Parker hasta la cuarta jornada de la temporada 2022-23, en la que fue destituido tras una derrota frente al Liverpool por 0-9.​\n\nHistoria\n\nBoscombe F.C.\nA pesar de que la fecha exacta de la fundación del club no se conoce, hay pruebas que demuestran su existencia desde el otoño de 1899, siendo la herencia del desaparecido Boscombe St. John's Lads Institute F.C.​ El club fue originalmente conocido como Boscombe F.C. y su primer presidente fue J.C. Nutt.​ \nEn su primera temporada (1899-1900) el Boscombe FC compitió en la Bournemouth and District Júnior League. Durante sus dos primeras temporadas jugaban de local en el campo de fútbol de Castlemain Avenue en Pokesdown. Desde la tercera temporada del club hace de local en el King's Park de Boscombe. En la temporada 1905-06, el Boscombe F.C. dejó de ser un club amateur.​\nYa en esa época, el club obtuvo su apodo de \"The Cherries\". Existen dos historias para este apodo, la primera es debido a las camisas a rayas de color cereza con las que jugaba el equipo, y la segunda es porque el Dean Court se construyó junto a una propiedad que, según se cree, albergaba numerosos cerezos. \nEn 1920, con la creación de la Third Division de la Football League, Boscombe fue promovido a la Southern League. \n\nBournemouth and Boscombe Athletic F.C.\nPara hacer al club más representativo del distrito, el nombre fue cambiado a Bournemouth and Boscombe Athletic F.C. en 1923. Durante ese mismo año, el club fue elegido para la nueva expansión de la Football League third Division.…",

      "history": "Paris Football Club es un club de fútbol francés de la ciudad de París. El club fue fundado en 1969 y desde la temporada 2025-26 competirá en la Ligue 1, el primer nivel del fútbol francés, por primera vez en casi 50 años de su última participación. El equipo juega sus partidos como local en el Estadio Jean-Bouin a partir de la temporada 2025-26.\nEl Paris Football Club fue fundado en 1969 y, más tarde, se fusionó con el Stade Saint-Germain para formar el París Saint-Germain Football Club. El actual Paris FC existe como escisión del París Saint-Germain. A diferencia de su contraparte, que ha llegado a establecer una base sólida, el Paris FC ha tenido dificultades para establecerse, después de haber pasado la mayor parte de su existencia en las divisiones amateurs.\nEl club es conocido por su cantera de jugadores, de la que han salido futbolistas profesionales como Jean-Christophe Thouvenel, Mamadou Sakho, Tijani Belaïd, Aymen Belaïd o Gabriel Obertan, Seko Fofana, Ibrahima Konaté, Nordi Mukiele, Axel Disasi, Karl Toko Ekambi, Mathys Tel, entre otros. Así como el entrenador Roger Lemerre, que ha dirigido a Francia.\n\nHistoria\nFue fundado en el año 1969 y más tarde se fusionó con el Stade Saint-Germain para formar al PSG. El actual Paris Football Club es resultado de la separación del equipo del PSG. Descontentos con sus contrapartes del PSG, decidieron establecer la nueva organización, aunque gran parte de su existencia la han pasado en las divisiones aficionadas de Francia, ya que la última vez que ha participado en la Ligue 1 fue en la temporada 1978/79.\nDesde 1979 el equipo ha pasado la mayor parte del tiempo luchando por establecerse en el fútbol profesional, consiguiendo volver a la Ligue 2 en la temporada 2017-18, categoría en la que se mantiene desde entonces. Consiguiendo entrar en los play-offs de ascenso a Ligue 1 en cuatro ocasiones.\nEn julio de 2020 el Paris FC recibió inversión por parte del Reino de Baréin, por lo que el estado árabe se convirtió en el propietario del 20% del club, además de convertirse en el patrocinador principal de la camiseta del cuadro parisino, sin embargo, se mantuvo a Pierre Ferracci como el principal accionista y presidente del club.​…",

      "wikiUrl": "https://es.wikipedia.org/wiki/Coventry_City_Football_Club",
      "history": "El Coventry City Football Club es un club de fútbol de Inglaterra, de la ciudad de Coventry en Midlands Occidentales. Fue fundado en 1883 Actualmente juega en la Premier League, la máxima división inglesa. Posee una rivalidad con el Leicester City en el llamado Derby M69 y con otros dos clubes que, al igual que el Coventry, se ubican en el condado de Midlands Occidentales: el Aston Villa y el Birmingham City.\n\nHistoria\n\nPrimeros años\nEl Coventry City nació en 1883 con el nombre de Singers F. C., tras una reunión entre William Stanley y siete compañeros de la Singer Cycle Company en el pub Lord Aylesford Inn, en el sector de Hillfields. Fue uno de los varios clubes del siglo xix vinculados a la industria de fabricación de bicicletas de Coventry, y el fundador de la empresa, George Singer, fue su primer presidente.​​​ El Singers ingresó a la liga del condado de Birmingham en 1884 y disputó cerca de cuarenta partidos durante sus cuatro primeras temporadas en Dowells Field, en la zona de Stoke.​​ En sus inicios, el equipo carecía de una plantilla fija y, en ocasiones, de equipamiento básico, como las redes de las porterías.​​ En 1887, el club cambió su localía al Stoke Road Ground, un recinto más grande que contaba con gradas rudimentarias, y comenzó a cobrar entrada a los espectadores.​ Las cinco temporadas siguientes fueron muy exitosas y culminaron con la conquista de dos títulos consecutivos de la Birmingham Junior Cup en 1891 y 1892.​\nEl club abrazó al profesionalismo en 1892, y llegó a la Birmingham & District League en 1894, donde compitió contra filiales pertenecientes a clubes consolidados, como el Aston Villa.​ Residentes de Coventry ajenos a la empresa de bicicletas comenzaron a apoyar al club, que cambió su nombre a Coventry City en 1898.​​ El estadio Highfield Road abrió en 1899, pero su construcción provocó una crisis financiera y consiguientes disputas salariales con los jugadores.​ El club atravesó varias temporadas deportivas med       "history": "El Real Racing Club de Santander, S. A. D., más conocido como Racing de Santander, Real Racing Club o simplemente Racing, es un club de fútbol español con sede en la ciudad de Santander (Cantabria). Fue fundado el 23 de febrero de 1913 como «Santander Racing Club».​ Desde la temporada 2026-27 juega en la Primera División de España, tras 14 temporadas de ausencia. \nSe constituyó legalmente el 14 de junio de ese mismo año. En 1922, el rey Alfonso XIII le concedió el título de «Real», lo que le permite portar la corona en su escudo. Es el único equipo cántabro que ha disputado la Primera División de España, en la que ha permanecido un total de 45 temporadas.\nEntre sus logros destaca un subcampeonato de Liga en la máxima categoría (1930-31) y unas semifinales de la Copa del Rey en dos ocasiones (2007-08 y 2009-10). Después de finalizar en sexta posición en la temporada 2007-08, el Racing jugó por primera vez en su historia la Copa de la UEFA.​ Cabe destacar que, en sus primeros años, fue el virtual campeón de la inconclusa Liga Máxima en el contexto de la Liga Española de Foot-ball—celebrada en la temporada 1927-28 y precursora de la posterior competición liguera unificada—, ya que ostentaba el mayor número de puntos en el momento de finalizar prematuramente el torneo. \nEn 1929 se convirtió en uno de los diez equipos participantes en la edición inaugural de la Primera División de España. Cuenta en su palmarés con tres ligas de Segunda División, una de Primera Federación, cuatro de Segunda B y tres de Tercera, más sendos campeonatos absolutos en Segunda, Primera Federación y Tercera. Su equipo filial, el Rayo Cantabria, ha ganado asimismo la Copa Federación en una ocasión.\nOcupa la 16.ª posición en la clasificación histórica de la Primera División y la 20.ª en la de Segunda. Cuenta con un Trofeo Pichichi en Primera, logrado por Salva Ballesta en el curso 1999-2000, y tres más en Segunda: los de Abel Fernández (1962-63), Santillana (1970-71) y Quique Estebaranz (1988-89). También posee dos Trofeos Zarra de Segunda División, ganados por Peque en la temporada 2023-24 y Andrés Martín en la temporada siguiente. Tres de sus integrantes han logrado coronarse como medallistas olímpicos a lo largo de su historia: Francisco Pagaza, plata en Amberes 1920; Ismael Ruiz Salmón, plata en Sídney 2000; y Ezequiel Garay, oro en Pekín 2008.…",

      "history": "La Unione Sportiva Lecce, también conocida como U. S. Lecce o Lecce, es un club de fútbol italiano de la ciudad de Lecce, en Apulia. Fue fundado el 15 de marzo de 1908, como Sporting Club Lecce, y refundado el 16 de septiembre de 1927, con la denominación actual. Milita en la Serie A, la primera división de fútbol del país.\nEl club ha obtenido dos títulos de Serie B (2009-2010 y 2021-2022), una Copa Italia Serie C (1975-1976) y un campeonato internacional, la Coppa Italo-Inglese Semiprofessionisti de 1976, a nivel semiprofesional. Por la Serie A, hasta la temporada 2024-2025, ha participado en 20 ocasiones, siendo la edición de 1985-1986 su primera vez, mientras que su mejor ubicación fue en la de 1988-1989, cuando finalizó en la 9ª posición.\nEl Lecce disputa sus partidos como local en el Estadio Via del Mare, inaugurado en 1966, y remodelado en 1985 y 2019, con capacidad para 31.533 espectadores. Su máximo rival es el Bari, con quien juega el llamado \"Derby de Puglia\".\n\n \n\nHistoria\nSe fundó como Sporting Club Lecce el 15 de marzo de 1908, e inicialmente incluía fútbol, atletismo y ciclismo. El primer presidente del club fue Francesco Marangi. Los primeros colores usados por Lecce durante este tiempo fueron rayas blancas y negras, conocidas en Italia como bianconeri.\nEn sus años de formación, Lecce jugó principalmente en ligas y competiciones regionales. Durante la temporada 1923–1924, el club se disolvió antes de regresar el 16 de septiembre de 1927 como Unione Sportiva Lecce. El club todavía llevaba rayas blancas y negras (similar al kit de la Juventus) en ese momento, y el primer presidente bajo el nombre de Unione Sportiva Lecce fue Luigi López y Rojo.\n\nLiga: primeros años 1930, 1940 y 1950\nLecce jugó contra Taranto Sport en un partido clave para ascender a la Serie B de la liga local del sur de Italia; Lecce fue victorioso ganando 3 por 2 después del tiempo extra. Ascendió a la Serie B para la temporada 1929–1930. El primer partido de la liga fue contra Novara el 6 de octubre de 1929, y fue victoria por 2-1. Lecce finalmente terminaría 13.º. Sin embargo, por segunda vez en la historia del club, cesó su actividad al final de la temporada 1931–1932.\nCuatro años después, Lecce regresó y compitió en la Serie C, terminando 11.º en su temporada de regreso.…",

      "history": "La Associazione Calcio Monza es un club de fútbol italiano de la ciudad de Monza, en Lombardía. Fue fundado en 1912 y refundado dos veces, y desde la temporada 2026-27 juega en la Serie A, máxima división del fútbol italiano.\n\nHistoria\nEl 1 de septiembre de 1912 fue fundado el Monza Foot Ball Club como fusión de dos equipos antecedentes, el Pro Monza y la Pro Italia. Los primeros colores del club fueron el blanco y el celeste.​ \nA lo largo de su historia, a través de varias refundaciones y fusiones, el Monza ganó 4 Copas Italia de Serie B (récord de victorias en este torneo) y una Copa anglo-italiana, y logró militar durante 38 temporadas en Serie B, la segunda división italiana.​Es el club con más temporadas en Serie B sin ascender a Serie A.[cita requerida]\nEn 2015, la entidad quebró y desapareció del fútbol profesional. El mismo año fue fundado el S.S.D. Monza 1912, heredero de la tradición deportiva del antiguo conjunto. En septiembre de 2018, el grupo financiero Fininvest, propiedad de Silvio Berlusconi, se hace con el control del club tras pagar 3 millones de euros a sus propietarios.​ El 1 de julio de 2019 cambió su nombre a Associazione Calcio Monza.​\nEl 8 de junio de 2020 el Monza regresa oficialmente a la Serie B Después de un campeonato dominado pero interrumpido debido al covid-19, Monza gana su grupo de Serie C con una ventaja de 16 puntos sobre sus rivales y finalmente el Monza vuelve a la Serie B tras 19 años con mucha ilusión, ambición y con los objetivos muy claros en mente, el ascenso a la Serie A .​\nDebutó en la Serie A en la temporada 2022-23.​\n\nInfraestructura\n\nEstadio\n\nEl primer campo de juego donde el FBC Monza comenzó a entrenar, jugando los primeros partidos, fue el Boschetti Reale, donde otros clubes de fútbol ya estaban presentes (el Convitto Fumagalli y el Veloce Club Monzese). Cortesía de Pro Victoria, juega en el terreno ubicado en via Vittorio Veneto en la esquina de via Duca d'Aosta en Triante, donde ahora se encuentra la Parroquia del Sagrado Corazón y su oratorio. Allí jugó el campeonato de la Tercera Categoría 1913-1914, pero cuando el Pro Victoria lo abandonó porque se mudó al Carlo Cattaneo, renunciando a renovar el alquiler anual, Monza tuvo que solicitar la adquisición, especificando que tenía la intención de ceñirlo con una empalizada de madera.…",

      "wikiUrl": "https://es.wikipedia.org/wiki/Como_1907",
      "history": "Como 1907 es un club de fútbol italiano de la ciudad de Como, en la región de Lombardía, Italia. Fue fundado originalmente bajo el nombre de Como Foot-ball Club el 25 de mayo de 1907, refundado como Calcio Como en 2005 y posteriormente Como 1907 en 2017. Desde la temporada 2024-25 compite en la Serie A, la máxima categoría del fútbol en Italia, tras ascender de Serie B en 2023-24. Disputa sus encuentros como local en el Estadio Giuseppe Sinigaglia, con capacidad para 13 602 espectadores.\nHa participado 14 veces en el campeonato de Serie A (mejor resultado un 4º puesto en la temporada 2025-26), y 36 veces en el de Serie B, que ha levantado en tres ocasiones. El Como se clasificó para la Liga de Campeones de la UEFA por primera vez en la historia para la temporada 2026-27, siendo la primera competición oficial internacional donde participa desde la Copa Mitropa de 1980-81.\nLas principales rivalidades del Como son con sus clubes vecinos, como el Derby del Lario contra el Lecco, el Derby Insubria contra el Varese FC, y contra el AC Monza, que se define como el Derby más caliente de la Serie B.\n\nHistoria\n\nFue fundado en 1907 con el nombre de Football Club Como. Durante los primeros años de vida después de su fundación, el Como jugó partidos amistosos y ligas locales, enfrentándose principalmente a equipos de la zona de Milán (US Milanese, Libertas, Juventus Italia) y de Suiza (Chiasso, Lugano, Bellinzona).​ En 1911 se fusionó con el club estudiantil Minerva manteniendo el nombre de F. C. Como. El 20 de octubre de 1912 se enfrentó en Turín al equipo del Savona para poder acceder al campeonato de “Prima Categoria”. El Como perdió el encuentro por 1-0 y tuvo que disputar la liguilla lombarda del campeonato de “Promozione”. El año siguiente se consiguió el objetivo de subir a la “Prima Categoria” donde jugó hasta el año 1922 cuando perdió contra el equipo del Piacenza las eliminatorias para participar a la nueva “Prima Divisione”.​\nEn 1926, después de juntarse con otro club de fútbol de la ciudad, el Esperia, pasó a llamarse Comense. En el 1927, ganó la Coppa Volta, eliminando en semifinal el FC Inter de Milán y ganando en la final por 1-0 al Genoa. Otro éxito lo tuvo el año siguiente ganando la final de la Coppa Turati contra el Brescia.​ En 1929 el Como no fue admitido a la nueva Serie B, a la cual ascendió en el año 1931 después de haber ganado la liga de “Prima Divisione” sin sufrir ni una derrota. En la segunda mitad de los años ’30 el equipo bajó y subió de categoría un par de veces y, jugando en la Serie C llegó la Segunda Guerra Mundial.​…",

function screenJornadas() {

var CATS = [
      { id: 'w1', short: '1 · X · 2', label: 'Ganador del partido' },
      { id: 'h', short: '1', label: 'Gana el equipo local' },
      { id: 'd', short: 'X', label: 'Empate' },
      { id: 'a', short: '2', label: 'Gana el equipo visitante' },
      { id: 'o15', short: '+ 1,5', label: 'Más de 1,5 goles' },
      { id: 'u15', short: '- 1,5', label: 'Menos de 1,5 goles' },
      { id: 'o25', short: '+ 2,5', label: 'Más de 2,5 goles' },

    ];

    function overAtLeast(f, k) {
      var K = 8, ph = [], pa = [], s = 0;
      for (var i = 0; i <= K; i++) {
        ph.push(Math.exp(-f.lh) * Math.pow(f.lh, i) / factorial(i));
        pa.push(Math.exp(-f.la) * Math.pow(f.la, i) / factorial(i));
      }
      for (var x = 0; x <= K; x++) {
        for (var y = 0; y <= K; y++) {
          if (x + y >= k) { s += ph[x] * pa[y]; }
        }
      }
      return s;
    }

function markets(l, m) {
      var f = forecast(l, m);
      if (!f) { return null; }
      var H = l.teamById[m.h], A = l.teamById[m.a];
      if (!H || !A) { return null; }
      var o15 = overAtLeast(f, 2);
      var o25 = overAtLeast(f, 3);
      var home = { p: f.home, label: 'Gana ' + H.name, priceKey: 'h' };
      var draw = { p: f.draw, label: 'Empate', priceKey: 'd' };
      var away = { p: f.away, label: 'Gana ' + A.name, priceKey: 'a' };
      var over15 = { p: o15, label: 'Más de 1,5 goles', priceKey: 'o15' };
      var under15 = { p: 1 - o15, label: 'Menos de 1,5 goles', priceKey: 'u15' };
      var over = { p: o25, label: 'Más de 2,5 goles', priceKey: 'o25' };
      var under = { p: 1 - o25, label: 'Menos de 2,5 goles', priceKey: 'u25' };
      var w1 = [home, draw, away].sort(function (x, y) { return y.p - x.p; })[0];
      var mix = [w1, over, under].sort(function (x, y) { return y.p - x.p; })[0];
      return { h: home, d: draw, a: away, o15: over15, u15: under15, o25: over, u25: under, w1: w1, mix: mix };
    }

function bookPrice(m, key) {
      return priceIn(m.id, key, state.book || ODDS.primary);
    }

    var COMBO_SIZES = [2, 3, 4, 5, 6, 7, 10];

    /**
     * Genera el pool de partidos disponibles para una categoría de mercado
     * Ordena por: tiene cuota > sin cuota, mayor probabilidad primero, luego fecha
     */
    function comboPool(cat) {
      var rows = [];
      var now = Date.now();
      ORDER.forEach(function (code) {
        var l = LG[code];
        if (!l || !l.matches) { return; }
        l.matches.forEach(function (m) {
          // Solo partidos próximos con fecha futura
          if (!isUpcoming(m)) { return; }
          if (new Date(m.utc).getTime() < now) { return; }
          var mk = markets(l, m);
          if (!mk) { return; }
          var sel = mk[cat];
          if (!sel) { return; }
          rows.push({ lg: l, m: m, sel: sel, price: bookPrice(m, sel.priceKey) });
        });
      });
      // Ordenar: primero las que tienen cuota, luego por probabilidad descendente, luego por fecha
      rows.sort(function (a, b) {
        if (!!a.price !== !!b.price) { return a.price ? -1 : 1; }
        if (a.sel.p !== b.sel.p) { return b.sel.p - a.sel.p; }
        if (a.m.utc !== b.m.utc) { return a.m.utc < b.m.utc ? -1 : 1; }
        return a.m.id - b.m.id;
      });
      return rows;
    }

    /**
     * Selecciona las primeras N patas del pool para formar una combinada
     * @param {Array} rows - Pool de partidos ordenados
     * @param {number} size - Tamaño deseado de la combinada
     * @returns {Array|null} - Array de patas o null si no hay suficientes
     */
    function comboFor(rows, size) {
      if (!Array.isArray(rows) || rows.length < size) {
        return null;
      }
      return rows.slice(0, size);
    }

    /**
     * Calcula probabilidades y cuota combinada para un conjunto de patas
     * @param {Array} legs - Patas de la combinada
     * @returns {{p: number, price: number|null}} - Probabilidad y cuota combinada
     */
    function comboTotals(legs) {
      if (!legs || legs.length === 0) {
        return { p: 0, price: null };
      }
      var p = 1, price = 1, complete = true;
      legs.forEach(function (x) {
        p *= x.sel.p;
        if (x.price) { price *= x.price; } else { complete = false; }
      });
      return { p: p, price: complete ? price : null };
    }

function oddsTag() {
      var when = String(ODDS.generated || '').replace('T', ' ').replace('Z', ' UTC');
      var n = ODDS_KEYS.length ? ODDS_KEYS.length + ' casas' : 'sin casa';
      return n + ' · ' + (when || 'sin fecha');
    }

    function comboCard(cat, legs, size) {
      var t = comboTotals(legs);
      var oddsLine = t.price
        ? '<span class="mono combo-odds-num">' + dec(t.price) + '</span><span class="kicker">cuota combinada · decimal</span>'
        : '<span class="mono combo-odds-num od-pending">—</span><span class="kicker">cuota combinada no disponible</span>';
      var list = legs.map(function (x, i) {
        var H = x.lg.teamById[x.m.h], A = x.lg.teamById[x.m.a];
        var price = x.price ? dec(x.price) : dec(1 / x.sel.p) + ' est.';
        var when = dfDay.format(new Date(x.m.utc)) + ' · ' + dfTime.format(new Date(x.m.utc));
        return '<li><button class="leg" data-action="open" data-match="' + x.m.id + '" aria-label="Ver detalle de ' + esc(H.name) + ' contra ' + esc(A.name) + '">' +
          '<span class="idx mono">' + (i + 1) + '</span>' +
          '<span class="od-field"><span class="t od-truncate">' + esc(H.name) + ' — ' + esc(A.name) + '</span>' +
          '<span class="meta od-truncate">' + esc(x.lg.code) + ' · ' + esc(x.sel.label) + ' · ' + price + ' · ' + esc(when) + '</span></span>' +
          '<span class="v mono">' + pct(x.sel.p) + '</span></button></li>';
      }).join('');
      return '<article class="combo">' +
        '<div class="combo-hd"><h2>' + size + ' partidos</h2>' +
        '<span class="combo-hd-r"><span class="kicker">' + esc(cat.label) + '</span>' +
        '<button class="btn is-ghost btn-sm" data-action="share" data-size="' + size + '" ' +
        'aria-label="Compartir la combinada de ' + size + ' partidos">' + ICON.share + '<span>Compartir</span></button></span></div>' +
        '<div class="combo-prob"><span class="lbl">Probabilidad de acierto</span>' +
        '<span class="mono combo-prob-num">' + pct(t.p) + '</span></div>' +
        '<div class="combo-odds">' + oddsLine + '</div>' +
        stakeRow('combo', t.price, comboStake(size), 'combo-return-' + size, ' data-size="' + size + '"') +
        '<ol class="legs">' + list + '</ol></article>';
    }

function cmodeRail() {
      var mk = function (id, label) {
        return '<button class="combo-chip" data-action="cmode" data-cmode="' + id + '" aria-pressed="' + (state.cmode === id) + '">' + esc(label) + '</button>';
      };
      return '<div class="rail-label"><span class="t">Cómo la armamos</span><span class="meta">' +
        (state.cmode === 'mine' ? 'tú eliges cada pata' : 'la app las elige') + '</span></div>' +
        '<div class="od-rail" style="--od-rail-pad:16px" role="group" aria-label="Tipo de combinada">' +
        mk('auto', 'Automáticas') + mk('mine', 'Mi combinada') + '</div>';
    }

    function screenCombinadas() {
      if (state.cmode === 'mine') { return screenMiCombinada(); }
      var cat = CATS.filter(function (c) { return c.id === state.cat; })[0] || CATS[0];
      var rows = comboPool(cat.id);
      var priced = rows.filter(function (r) { return r.price; }).length;
      var leagues = ORDER.filter(function (code) {
        return rows.some(function (r) { return r.lg.code === code; });
      });

      var catRail = '<div class="od-rail" style="--od-rail-pad:16px" role="group" aria-label="Mercado">' + CATS.map(function (c) {
        return '<button class="combo-chip" data-action="cat" data-cat="' + c.id + '" aria-pressed="' + (c.id === state.cat) + '">' +
          esc(c.short) + '</button>';
      }).join('') + '</div>';

      var cards = COMBO_SIZES.map(function (n) {
        var legs = comboFor(rows, n);
        var head = '<div class="combo-hd"><h2>' + n + ' partidos</h2><span class="kicker">' + esc(cat.label) + '</span></div>';
        if (!legs) {
          return '<article class="combo">' + head + '<p class="note" style="margin:0">Solo hay ' + rows.length +
            ' partidos por delante con este mercado, así que no se pueden armar ' + n + ' patas sin inventar datos. Prueba con otro mercado.</p></article>';
        }
        return comboCard(cat, legs, n);
      }).join('');

      var pool = rows.length

    var SEL_DEFS = [

    function selInfo(l, m, id) {
      var f = forecast(l, m);
      if (!f) { return null; }
      var H = l.teamById[m.h], A = l.teamById[m.a];
      if (!H || !A) { return null; }
      var o25 = overAtLeast(f, 3), o15 = overAtLeast(f, 2);
      var row = null;
      for (var i = 0; i < SEL_DEFS.length; i++) {
        if (SEL_DEFS[i].id !== id) { continue; }
        row = SEL_DEFS[i];
        break;
      }
      if (!row) { return null; }
      var p = null, label = '';
      if (row.kind === 'w1') {
        if (id === 'h') { p = f.home; label = 'Gana ' + H.name; }
        else { p = f.away; label = 'Gana ' + A.name; }
      } else if (row.kind === 'draw') { p = f.draw; label = 'Empate'; }
      else if (row.kind === 'over') { p = o25; label = 'Más de 2,5 goles'; }
      else if (row.kind === 'under') { p = 1 - o25; label = 'Menos de 2,5 goles'; }
      else if (row.kind === 'over15') { p = o15; label = 'Más de 1,5 goles'; }
      else if (row.kind === 'under15') { p = 1 - o15; label = 'Menos de 1,5 goles'; }
      if (p == null || !(p > 0)) { return null; }
      return { id: id, short: row.short, label: label, p: p };
    }

    function selsFor(l, m) {
      var out = [];
      SEL_DEFS.forEach(function (d) {
        var s = selInfo(l, m, d.id);
        if (s) { s.priced = booksWith(m.id, d.id).length; out.push(s); }
      });
      return out;
    }

    function ticketLegs() {
      var out = [];
      (state.ticket || []).forEach(function (t) {
        var f = matchById(t.mid);
        if (!f) { return; }
        var sel = selInfo(f.lg, f.m, t.sel);
        if (!sel) { return; }
        sel.priced = booksWith(t.mid, t.sel).length;
        out.push({ mid: t.mid, lg: f.lg, m: f.m, sel: sel });
      });
      return out;
    }

    function ticketBooks(legs) {
      var n = legs.length;
      if (!n) { return []; }
      var map = {};
      legs.forEach(function (x) {
        var e = oddsEntry(x.mid);
        var keys = e ? Object.keys(e.books) : [];
        keys.forEach(function (k) {
          if (!map[k]) { map[k] = { key: k, name: ODDS.bookName[k] || k, price: 1, ok: true, n: 0 }; }
          var p = selPrice(e.books[k], x.sel.id);
          if (p == null) { map[k].ok = false; }
          else { map[k].price *= p; map[k].n += 1; }
        });
      });
      var out = [];
      for (var k in map) {
        if (map[k].ok && map[k].n === n) { out.push(map[k]); }
      }
      out.sort(function (a, b) { return b.price - a.price; });
      return out;
    }

    function ticketProb(legs) {
      var p = 1;
      legs.forEach(function (x) { p *= x.sel.p; });
      return p;

          if (!oddsEntry(m.id)) { return; }
          out.push({ lg: l, m: m });
        });
      });
      out.sort(function (a, b) { return a.m.utc < b.m.utc ? -1 : a.m.utc > b.m.utc ? 1 : 0; });
      return out;

    function cssTone(name, fallback) {
      var v = '';
      try { v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); } catch (err) { v = ''; }
      return v || fallback;
    }
    function canvasTone(g, name, fallback) {
      var v = cssTone(name, '');
      if (!v) { return fallback; }
      g.fillStyle = '#010203';
      g.fillStyle = v;
      return g.fillStyle === '#010203' ? fallback : v;
    }
    function roundRect(g, x, y, w, h, r) {
      g.beginPath();
      g.moveTo(x + r, y);
      g.arcTo(x + w, y, x + w, y + h, r);
      g.arcTo(x + w, y + h, x, y + h, r);
      g.arcTo(x, y + h, x, y, r);
      g.arcTo(x, y, x + w, y, r);
      g.closePath();
    }
    function paintMark(g, x, y, size, ink) {
      var m = BRAND.mark;
      var k = size / m.box;
      var px = function (v) { return x + v * k; };
      var py = function (v) { return y + v * k; };
      var trace = function (pts) {
        pts.forEach(function (p, i) { if (i) { g.lineTo(px(p[0]), py(p[1])); } else { g.moveTo(px(p[0]), py(p[1])); } });
      };
      g.fillStyle = canvasTone(g, '--accent', '#2fd98a');
      roundRect(g, x, y, size, size, m.badge[4] * k);
      g.fill();
      g.strokeStyle = ink;
      g.fillStyle = ink;
      g.lineCap = 'round';
      g.lineJoin = 'round';
      g.lineWidth = m.trendW * k;
      g.beginPath();
      trace(m.trend);
      g.stroke();
      g.lineWidth = m.ballW * k;
      g.beginPath();
      g.arc(px(m.ball[0]), py(m.ball[1]), m.ball[2] * k, 0, Math.PI * 2);
      g.stroke();
      g.beginPath();
      trace(m.pent);
      g.closePath();
      g.fill();
    }
    function fitText(g, text, max) {
      if (g.measureText(text).width <= max) { return text; }
      var t = String(text);
      while (t.length > 1 && g.measureText(t + '…').width > max) { t = t.slice(0, -1); }
      return t + '…';
    }
    function tracked(g, text, x, y, sp) {
      var cx = x;
      text.split('').forEach(function (ch) { g.fillText(ch, cx, y); cx += g.measureText(ch).width + sp; });
    }
    function trackedRight(g, text, right, y, sp) {
      var chars = text.split('');
      var total = 0;
      chars.forEach(function (ch) { total += g.measureText(ch).width + sp; });
      tracked(g, text, right - Math.max(0, total - sp), y, sp);
    }

      g.fillText(pct(d.totals.p), W - pad - 36, probTop + 116);

      var y = legsTop;

        g.textAlign = 'right';
        g.font = '700 28px ' + CV_MONO;
        g.fillStyle = x.price ? fg : muted;
        g.fillText(x.price ? dec(x.price) : '—', W - pad - 36, y + 50);

        g.fillStyle = accent;
        g.fillText(pct(x.sel.p), W - pad - 36, y + 86);
        g.textAlign = 'left';

        y += legH + legGap;
      });

      var fy = y + 18;
      g.strokeStyle = line;
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(pad, fy);
      g.lineTo(W - pad, fy);
      g.stroke();

      g.font = '600 22px ' + CV_MONO;
      g.fillStyle = muted;
      tracked(g, 'CUOTA COMBINADA', pad, fy + 62, 2.5);
      g.font = '500 20px ' + CV_MONO;

      g.font = '500 20px ' + CV_MONO;
      g.fillStyle = muted;
      g.fillText(fitText(g, 'Probabilidades del modelo propio, no son cuotas de mercado · ' + SNAP.source, W - pad * 2), pad, H - 34);

      return cv;
    }

    function copyText(txt) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(txt);
      }
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      ta.remove();
      return ok ? Promise.resolve() : Promise.reject(new Error('copy'));
    }

function shareOpen(size) { shareOpenData(comboShareData(size)); }
    function shareOpenData(d) {
      if (!d) { toast('No hay partidos suficientes para esa combinada'); return; }
      var cv;
      try {
        cv = comboCardImage(d);
        d.url = cv.toDataURL('image/png');
      } catch (err) {
        d.url = '';
        toast('No se pudo generar la imagen en este navegador');
      }
      shareSeq += 1;
      var token = shareSeq;
      shareCtx = d;
      if (d.url) {
        cv.toBlob(function (blob) {
          if (!blob || shareSeq !== token || shareCtx !== d || typeof File === 'undefined') { return; }
          d.file = new File([blob], 'combinada-' + d.size + '-partidos.png', { type: 'image/png' });
        }, 'image/png');

    function shareSave(d) {
      if (!d.url) { toast('No hay imagen para guardar'); return; }
      var name = 'combinada-' + d.size + '-partidos.png';
      // Native wrapper: a WebView has no download manager, so a[download]
      // would silently do nothing. d.url is already a data: URL produced by
      // canvas.toDataURL() (see comboCardImage), which is exactly what the
      // AndroidSave bridge expects. The anchor stays as the browser fallback.
      if (window.AndroidSave && typeof window.AndroidSave.savePng === 'function') {
        window.AndroidSave.savePng(name, d.url);
        return;
      }
      var a = document.createElement('a');
      a.href = d.url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast('Imagen guardada');
    }

    function shareNative(d, text) {
      var title = 'Combinada de ' + d.size + ' partidos';
      try {
        if (d.file && navigator.canShare && navigator.canShare({ files: [d.file] })) {
          navigator.share({ files: [d.file], text: text, title: title }).catch(function () {});
          return;
        }
        if (navigator.share) {
          navigator.share({ text: text, title: title }).catch(function () {});
          return;
        }
      } catch (err) { shareSave(d); return; }
      shareSave(d);
    }

    function shareDo(kind) {
      var d = shareCtx;
      if (!d) { return; }
      var text = comboShareText(d);
      // location.href instead of window.open: the WebView drops window.open
      // silently, whereas a real navigation reaches the native wrapper's
      // shouldOverrideUrlLoading and is handed off to the installed app.
      if (kind === 'wa') { location.href = 'https://wa.me/?text=' + encodeURIComponent(text); return; }
      if (kind === 'tg') {
        location.href = 'https://t.me/share/url?text=' + encodeURIComponent(text);
        return;
      }
      if (kind === 'copy') {
        copyText(text).then(function () { toast('Texto copiado'); }, function () { toast('Este navegador no permite copiar'); });
        return;
      }
      if (kind === 'save') { shareSave(d); return; }
      shareNative(d, text);

    function pickVerdict(m, target) {
      if (m.st !== 'FINISHED') { return 'wait'; }
      var hg = m.hg, ag = m.ag;
      var ok = target === '1' ? hg > ag : target === 'X' ? hg === ag : target === '2' ? ag > hg
        : target === 'o15' ? (hg + ag) > 1.5 : target === 'u15' ? (hg + ag) <= 1.5
        : target === 'o25' ? (hg + ag) > 2.5 : target === 'u25' ? (hg + ag) <= 2.5 : (hg > 0 && ag > 0);
      return ok ? 'ok' : 'no';
    }

    function verifySeason() {
      var y0 = Number(SNAP.season);
      var winFrom = y0 + '-06-01';
      var winTo = (y0 + 1) + '-06-30';
      return ORDER.map(function (code) {
        var l = LG[code];
        var ms = l.matches;
        var teams = l.teams.length;
        var seen = {}, dup = 0, out = 0, lo = Infinity, hi = -Infinity;
        var byMd = {}, perTeam = {};
        ms.forEach(function (m) {
          if (seen[m.id]) { dup++; } else { seen[m.id] = 1; }
          var t = new Date(m.utc).getTime();
          if (t < lo) { lo = t; }
          if (t > hi) { hi = t; }
          var d = dfISO.format(new Date(t));
          if (d < winFrom || d > winTo) { out++; }
          if (!byMd[m.md]) { byMd[m.md] = {}; }
          if (!perTeam[m.h]) { perTeam[m.h] = 0; }
          if (!perTeam[m.a]) { perTeam[m.a] = 0; }
          byMd[m.md][m.h] = 1; byMd[m.md][m.a] = 1;
          perTeam[m.h]++; perTeam[m.a]++;
        });
        var exp = Math.round(ms.length * 2 / teams);
        var bad = Object.keys(perTeam).filter(function (t) { return perTeam[t] !== exp; }).length;
        var rounds = Object.keys(byMd);
        var badMd = rounds.filter(function (md) { return Object.keys(byMd[md]).length !== teams; }).length;
        return {
          code: code, name: l.name, teams: teams, ms: ms.length, rounds: rounds.length, exp: exp,
          played: ms.filter(function (m) { return m.st === 'FINISHED'; }).length,
          lo: dfDMY.format(new Date(lo)), hi: dfDMY.format(new Date(hi)),
          issues: [dup ? dup + ' identificadores repetidos' : '', out ? out + ' kicking fuera de temporada' : '',
            bad ? bad + ' equipos con un número de partidos distinto de ' + exp : '',
            badMd ? badMd + ' jornadas con equipos de más o de menos' : ''].filter(Boolean).join(', ')
        };
      });
    }

    function sheetCompare(l, m) {
      var H = l.teamById[m.h], A = l.teamById[m.a];
      var ctx = context(l, m.md);
      var hT = ctx.teams[m.h] || { hN: 0, aN: 0, hA: 0, aA: 0, form: [] };
      var aT = ctx.teams[m.a] || { hN: 0, aN: 0, hA: 0, aA: 0, form: [] };
      var f = forecast(l, m) || { homeGF: 0, awayGF: 0 };
      var rowH = l.table.filter(function (r) { return r.t === m.h; })[0] || { pos: '—', p: 0, pts: 0 };
      var rowA = l.table.filter(function (r) { return r.t === m.a; })[0] || { pos: '—', p: 0, pts: 0 };
      var csH = 0, csA = 0;
      ctx.played.forEach(function (x) {
        if (x.h === m.h && x.ag === 0) { csH++; }
        if (x.a === m.h && x.hg === 0) { csH++; }
        if (x.h === m.a && x.ag === 0) { csA++; }
        if (x.a === m.a && x.hg === 0) { csA++; }
      });
      function row(label, a, b) {

          '<span class="num mono">' + a + '</span><span class="num mono">' + b + '</span></div>';
      }
      var pair = ctx.played.filter(function (x) {
        return (x.h === m.h && x.a === m.a) || (x.h === m.a && x.a === m.h);
      });
      var h2h = pair.length
        ? '<ul class="reason">' + pair.map(function (x) {

function sheetOdds(l, m) {

          '<h3 class="odds-sel-label">' + esc(s.label) + '</h3>' +
          '<div class="product-grid">' + cards + '</div>' +

      var tags = ODDS_KEYS.filter(function (k) {

        '. La cifra entre par\u00e9ntesis es la probabilidad impl\u00edcita (1 \u00f7 cuota). ' +
        '\u00abest.\u00bb es la estimaci\u00f3n del modelo, no una cuota de mercado. En \u00abMi combinada\u00bb puedes multiplicar las patas por una misma casa.</p></section>';
    }

    function sheetForecast(l, m, f) {

        '<div class="kv-line"><span class="lbl">Ambos marcan</span><span class="bar-inline bar"><i class="seg-h" style="width:' + (f.btts * 100).toFixed(1) + '%"></i></span><span class="mono od-nowrap">' + pct(f.btts) + '</span></div>' +
        '</div>' +

        '<section class="card"><h2>Por qué</h2><ul class="reason">' +

        '</ul></section>' +

    function picksBlock(m) {
      var current = picks[m.id];
      var types = ['1', 'X', '2', 'o15', 'o25', 'u25', 'btts'];
