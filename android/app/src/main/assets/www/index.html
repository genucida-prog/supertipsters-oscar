    function sheetClubStats(l, team, row) {
      var ctx = context(l, 999);
      var s = ctx.teams[team.id] || { form: [], gf: 0, ga: 0, hN: 0, hG: 0, hA: 0, aN: 0, aG: 0, aA: 0 };
      var played = s.form.length;
      var gd = s.gf - s.ga;
      var wins = s.form.filter(function (f) { return f === 'V'; }).length;
      var draws = s.form.filter(function (f) { return f === 'E'; }).length;
      var losses = played - wins - draws;
      var points = wins * 3 + draws;
      return '<section class="card"><div class="h"><h2>Temporada ' + esc(SNAP.season) + '/' + String(Number(SNAP.season) + 1).slice(-2) + '</h2>' +
        '<span class="pill is-flat">' + esc(l.code) + '</span></div>' +
        '<div class="stat-strip" style="--od-cols:3">' +
        '<div class="cell"><span class="val mono">' + (row ? row.pos : '\u2014') + '</span><span class="lab">posici\u00f3n</span></div>' +
        '<div class="cell"><span class="val mono">' + played + '</span><span class="lab">partidos</span></div>' +
        '<div class="cell"><span class="val mono">' + points + '</span><span class="lab">puntos</span></div>' +
        '</div>' +
        '<div class="stat-strip" style="--od-cols:3;margin-top:8px">' +
        '<div class="cell"><span class="val mono">' + wins + '/' + draws + '/' + losses + '</span><span class="lab">ganados/empates/perdidos</span></div>' +
        '<div class="cell"><span class="val mono">' + s.gf + ':' + s.ga + '</span><span class="lab">goles a favor:en contra</span></div>' +
        '<div class="cell"><span class="val mono">' + (gd > 0 ? '+' : '') + gd + '</span><span class="lab">diferencia</span></div>' +
        '</div>' +
        '<div class="kv-list" style="margin-top:12px">' +
        '<div class="kv-line"><span class="lbl">En casa</span><span class="mono">' + s.hN + ' PJ \u00b7 ' + s.hG + ':' + s.hA + '</span></div>' +
        '<div class="kv-line"><span class="lbl">Fuera</span><span class="mono">' + s.aN + ' PJ \u00b7 ' + s.aG + ':' + s.aA + '</span></div>' +
        '<div class="kv-line"><span class="lbl">\u00daltimos 5</span><span class="form">' + clubForm(s.form, 5) + '</span></div>' +
        '</div>' +
        '<p class="note">Posici\u00f3n y puntos recalculados con los partidos ya jugados del snapshot. G = ganado, E = empate, P = perdido, \u00b7 = sin partidos.</p></section>';
    }

    function sheetClubVenue(c) {
      var st = c.stadium || {};
      var p = st.photo;
      var meta = [];
      if (st.city) { meta.push(esc(st.city)); }
      if (st.capacity) { meta.push('aforo ' + esc(String(st.capacity).replace(/\B(?=(\d{3})+(?!\d))/g, '.'))); }
      if (st.opened) { meta.push('inaugurado en ' + esc(String(st.opened))); }
      var media = p
        ? '<img class="club-photo od-media" src="' + esc(p.file) + '" width="' + p.w + '" height="' + p.h +
          '" alt="Foto de ' + esc(st.name) + '" loading="lazy" decoding="async">' +
          '<p class="credit">Foto: ' + esc(p.author || 'autor no indicado') + ' \u00b7 ' + esc(p.license || 'licencia no indicada') +
          ' \u00b7 <a href="' + esc(p.source) + '" target="_blank" rel="noopener">Wikimedia Commons</a></p>'
        : '<p class="note">No hay una fotograf\u00eda libre verificada de este estadio, as\u00ed que se muestra el esquema ilustrativo.</p>' + stadiumSvg();
      return '<section class="card"><div class="h"><h2>Estadio</h2>' +
        '<span class="pill is-flat">' + esc(st.qid || 'sin dato') + '</span></div>' +
        '<p class="t" style="margin:0 0 2px;font-size:15px;font-weight:650">' + esc(st.name || 'Estadio sin identificar') + '</p>' +
        '<p class="meta">' + (meta.length ? meta.join(' \u00b7 ') : 'Ciudad y aforo sin dato en la fuente') + '</p>' +
        '<div style="margin-top:10px">' + media + '</div></section>';
    }

    function sheetClubHonours(c) {
      var lines = clubHonours(c.honours);
      if (!lines.length) { return ''; }
      return '<section class="card"><h2>Palmar\u00e9s</h2><ul class="prose">' +
        lines.map(function (line) {
          var sub = !/[\d]/.test(line) && line.length < 46;
          return '<li' + (sub ? ' class="sub"' : '') + '>' + esc(line) + '</li>';
        }).join('') +
        '</ul><p class="note">Resumen del palmar\u00e9s publicada por Wikipedia; la fuente puede contener m\u00e1s detalles.</p></section>';
    }

    function sheetClubHistory(c) {
      var paras = clubParagraphs(c.history);
      var links = [];
      if (c.wikiUrl) { links.push('<a href="' + esc(c.wikiUrl) + '" target="_blank" rel="noopener">Wikipedia en espa\u00f1ol</a>'); }
      if (c.wikidataUrl) { links.push('<a href="' + esc(c.wikidataUrl) + '" target="_blank" rel="noopener">Wikidata ' + esc(c.qid) + '</a>'); }
      if (c.website) { links.push('<a href="' + esc(c.website) + '" target="_blank" rel="noopener">Web oficial</a>'); }
      var body = paras.length
        ? '<ul class="prose">' + paras.map(function (p) {
            var sub = p.length < 60 && !/[.!?]$/.test(p);
            return '<li' + (sub ? ' class="sub"' : '') + '>' + esc(p) + '</li>';
          }).join('') + '</ul>'
        : '<p class="note">Sin resumen disponible en la fuente.</p>';
      return '<section class="card"><div class="h"><h2>Historia</h2>' +
        '<span class="pill is-flat">' + esc(c.country || '') + '</span></div>' + body +
        (links.length ? '<p class="club-links" style="margin-top:12px">' + links.join('') + '</p>' : '') +
        '<p class="note">Texto adaptado de Wikipedia en espa\u00f1ol (CC BY-SA 4.0). Identidad y estadio desde Wikidata (CC0).</p></section>';
    }

    function renderClubSheet() {
      var loc = clubLocate(state.club);
      if (!loc) { return ''; }
      var l = loc.lg, team = loc.team;
      var c = clubData(state.club);
      var row = l.table.filter(function (r) { return r.t === team.id; })[0] || null;
      var body = c
        ? sheetClubStats(l, team, row) + sheetClubVenue(c) + sheetClubHonours(c) + sheetClubHistory(c)
        : '<section class="card"><h2>Sin ficha</h2><p class="note">No hay datos ampliados para este equipo.</p></section>';
      return '<div class="sheet-layer" id="sheetLayer">' +
        '<div class="sheet-scrim" data-action="close"></div>' +
        '<section class="sheet" role="dialog" aria-modal="true" aria-label="Ficha del club">' +
        '<div class="sheet-bar"><span class="od-field"><span class="kicker">' + esc(l.name) + ' \u00b7 ' + esc(team.tla) + '</span>' +
        '<span class="t">' + esc(team.name) + '</span></span>' +
        '<button class="icon-btn" data-action="close" aria-label="Cerrar ficha del club">' + ICON.close + '</button></div>' +
        '<div class="sheet-body od-scroll">' +
        '<section class="card"><div class="club-hero">' + crest(team, '48px') +
        '<span class="od-field"><span class="nm">' + esc(c && c.esName ? c.esName : team.name) + '</span>' +
        '<span class="meta">' + esc(c && c.country ? c.country : team.country) + ' \u00b7 fundado en ' + esc(String(team.founded)) +
        ' \u00b7 ' + esc(team.tla) + '</span></span></div></section>' +
        body + '</div></section></div>';
    }

    function sheetPlayed(l, m) {
      var H = l.teamById[m.h], A = l.teamById[m.a];
      var ctx = context(l, m.md);
      var H2 = ctx.teams[m.h], A2 = ctx.teams[m.a];
      var scored = m.hg != null && m.ag != null;
      var win = !scored ? statusLabel(m.st) : m.hg > m.ag ? H.name : m.hg === m.ag ? 'Empate' : A.name;
      var head = scored ? 'Resultado real' : 'Estado del partido';
      return '<section class="card"><h2>' + head + '</h2>' +
        '<div class="stat-strip" style="--od-cols:3">' +
        '<div class="cell"><span class="val mono">' + (scored ? m.hg : '—') + '</span><span class="lab">goles ' + esc(H.tla) + '</span></div>' +
        '<div class="cell"><span class="val mono">' + (scored ? m.ag : '—') + '</span><span class="lab">goles ' + esc(A.tla) + '</span></div>' +
        '<div class="cell"><span class="val" style="font-size:15px;line-height:1.3">' + esc(win) + '</span><span class="lab">' +
        (scored ? 'ganador' : 'situación') + '</span></div>' +
        '</div><p class="note">Jornada ' + m.md + ' · ' + esc(l.name) + '. Partido ya disputado: aquí no se calcula pronóstico para no usar el resultado.</p></section>' +
        '<section class="card"><h2>Cómo llegó cada equipo</h2><dl class="kv">' +
        '<dt>' + esc(H.name) + ' (partidos previos)</dt><dd class="mono">' + (H2 ? H2.form.length : 0) + ' PJ · ' + (H2 ? H2.gf + ':' + H2.ga : '—') + '</dd>' +
        '<dt>' + esc(A.name) + ' (partidos previos)</dt><dd class="mono">' + (A2 ? A2.form.length : 0) + ' PJ · ' + (A2 ? A2.gf + ':' + A2.ga : '—') + '</dd>' +
        '<dt>Estado antes de la jornada</dt><dd class="mono">' + ctx.n + ' partidos de liga</dd>' +
        '</dl><p class="note">Partidos y goles acumulados hasta la jornada anterior a este enfrentamiento.</p></section>';
    }

    function renderSheet() {
      if (state.club) { return renderClubSheet(); }
      var found = state.match ? matchById(state.match) : null;
      if (!found) { return ''; }
      var l = found.lg, m = found.m;
      var upcoming = isUpcoming(m);
      var f = upcoming ? forecast(l, m) : null;
      var body = (upcoming ? sheetForecast(l, m, f) : sheetPlayed(l, m)) +
        sheetVenue(l, m) + sheetCompare(l, m) + sheetOdds(l, m);
      return '<div class="sheet-layer" id="sheetLayer">' +
        '<div class="sheet-scrim" data-action="close"></div>' +
        '<section class="sheet" role="dialog" aria-modal="true" aria-label="Detalle del partido">' +
        '<div class="sheet-bar"><span class="od-field"><span class="kicker">' + esc(l.name) + ' · Jornada ' + m.md + '</span>' +
        '<span class="t">' + esc(l.teamById[m.h].name) + ' — ' + esc(l.teamById[m.a].name) + '</span></span>' +
        '<button class="icon-btn" data-action="close" aria-label="Cerrar detalle">' + ICON.close + '</button></div>' +
        '<div class="sheet-body od-scroll">' + sheetFixture(l, m, f) + body +
        '<p class="note">Estimación propia calculada con los partidos ya jugados de la temporada 2026/27. No es una cuota ni un consejo de apuesta.</p>' +
        '</div></section></div>';
    }

    function saveScroll() {
      var screen = document.getElementById('screen');
      if (screen) { scrollMemory[routeKey()] = screen.scrollTop; }
      var body = document.querySelector('.sheet-body');
      if (body) { scrollMemory.sheetKey = body.scrollTop; }
    }

    function render() {
      var html = state.tab === 'pronosticos' ? screenPronosticos()
        : state.tab === 'combinadas' ? screenCombinadas()
        : state.tab === 'historial' ? screenHistorial()
        : state.tab === 'tabla' ? screenTabla()
        : state.tab === 'modelo' ? screenModelo()
        : screenJornadas();

      html += '<nav class="tabbar" role="tablist" aria-label="Secciones">' + TABS.map(function (t) {
        return '<button class="tab" role="tab" data-action="tab" data-tab="' + t.id + '" aria-selected="' + (state.tab === t.id) + '">' +
          ICON[t.icon] + '<span>' + esc(t.label) + '</span></button>';
      }).join('') + '</nav>';

      html += renderSheet() + renderShare() + renderSyncSheet();
      app.innerHTML = '<div class="od-screen app-shell">' + html + '</div>';

      var next = document.getElementById('screen');
      if (next) {
        next.scrollTop = scrollMemory[routeKey()] || 0;
        centerChip(next, '.md-chip[aria-pressed="true"]');
        centerChip(next, '.league-chip[aria-pressed="true"]');
        centerChip(next, '.combo-chip[aria-pressed="true"]');
      }
      var sheetBody = document.querySelector('.sheet-body');
      if (sheetBody) { sheetBody.scrollTop = scrollMemory.sheetKey || 0; }
      if (state.match || state.club) {
        var closeBtn = app.querySelector('.sheet-bar .icon-btn');
        if (closeBtn) { closeBtn.focus(); }
      }
      pushWidget();
    }

    function centerChip(scope, selector) {
      var chip = scope.querySelector(selector);
      if (!chip || !chip.parentNode) { return; }
      var rail = chip.parentNode;
      if (rail.scrollWidth <= rail.clientWidth) { return; }
      rail.scrollLeft = chip.offsetLeft - (rail.clientWidth - chip.offsetWidth) / 2;
    }

    var toastTimer = null;
    function toast(msg) {
      var old = document.querySelector('.toast');
      if (old) { old.remove(); }
      var el = document.createElement('div');
      el.className = 'toast';
      el.setAttribute('role', 'status');
      el.innerHTML = ICON.check + '<span>' + esc(msg) + '</span>';
      document.querySelector('.phone-screen').appendChild(el);
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.remove(); }, 2200);
    }

    function go(next, replace) {
      saveScroll();
      state = next;
      writeHash(replace);
      render();
    }

    function pickProbability(l, m, target) {
      var f = forecast(l, m);
      if (!f) { return null; }
      if (target === '1') { return f.home; }
      if (target === 'X') { return f.draw; }
      if (target === '2') { return f.away; }
      if (target === 'o25') { return f.over; }
      if (target === 'u25') { return 1 - f.over; }
      if (target === 'o15') { return overAtLeast(f, 2); }
      if (target === 'u15') { return 1 - overAtLeast(f, 2); }
      return f.btts;
    }

    document.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-action]');
      if (!el) { return; }
      var action = el.dataset.action;
      var next = { tab: state.tab, league: state.league, md: state.md, match: state.match, club: state.club, cat: state.cat, cmode: state.cmode, book: state.book, ticket: state.ticket, addOpen: state.addOpen, addLg: state.addLg };

      if (action === 'reload') { location.reload(); return; }

      if (action === 'tab') {
        if (next.tab === el.dataset.tab) { return; }
        shareCtx = null;
        next.tab = el.dataset.tab;
        next.match = null;
        next.club = null;
        go(next);
        return;
      }
      if (action === 'league') {
        next.league = el.dataset.league;
        next.md = Math.min(LG[next.league].currentMatchday, LG[next.league].totalMatchdays);
        next.match = null;
        next.club = null;
        go(next);
        return;
      }
      if (action === 'md') {
        next.md = parseInt(el.dataset.md, 10);
        next.match = null;
        next.club = null;
        go(next);
        return;
      }
      if (action === 'next-md') {
        next.tab = 'jornadas';
        next.md = Math.min(LG[next.league].currentMatchday, LG[next.league].totalMatchdays);
        next.match = null;
        next.club = null;
        go(next);
        return;
      }
if (action === 'cat') {
        shareCtx = null;
        next.cat = el.dataset.cat;
        next.club = null;
        go(next);
        return;
      }
      if (action === 'cmode') {
        shareCtx = null;
        next.cmode = el.dataset.cmode;
        next.addOpen = false;
        next.match = null;
        next.club = null;
        go(next);
        return;
      }
      if (action === 'tsel') {
        var ts = state.ticket.map(function (t) {
          return (t.mid == el.dataset.mid) ? { mid: t.mid, sel: el.dataset.sel } : t;
        });
        if (!state.ticket.some(function (t) { return t.mid == el.dataset.mid; })) {
          ts.push({ mid: el.dataset.mid, sel: el.dataset.sel });
        }
        next.ticket = ts;
        saveTicket(ts);
        shareCtx = null;
        go(next, true);
        return;
      }
      if (action === 'tdel') {
        next.ticket = state.ticket.filter(function (t) { return String(t.mid) !== String(el.dataset.mid); });
        saveTicket(next.ticket);
        shareCtx = null;
        go(next, true);
        return;
      }
      if (action === 'tadd') {
        var am = el.dataset.mid;
        if (!state.ticket.some(function (t) { return String(t.mid) === String(am); })) {
          var ref = matchById(parseInt(am, 10));
          var ds = ref ? ticketDefaultSel(ref.lg, ref.m) : null;
          if (ds) {
            next.ticket = state.ticket.concat([{ mid: parseInt(am, 10), sel: ds }]);
            saveTicket(next.ticket);
          }
        }
        shareCtx = null;
        go(next, true);
        return;
      }
      if (action === 'add-open') { next.addOpen = true; next.match = null; go(next, true); return; }
      if (action === 'add-close') { next.addOpen = false; go(next, true); return; }
      if (action === 'add-lg') { next.addLg = el.dataset.lg; go(next, true); return; }
      if (action === 'ticket-clear') {
        next.ticket = [];
        next.addOpen = false;
        saveTicket(next.ticket);
        shareCtx = null;
        go(next, true);
        return;
      }
      if (action === 'share-ticket') {
        shareOpenData(ticketShareData());
        return;
      }
      if (action === 'share') {
        shareOpen(parseInt(el.dataset.size, 10) || 2);
        return;
      }
      if (action === 'share-do') {
        shareDo(el.dataset.kind);
        return;
      }
      if (action === 'close-share') {
        shareCtx = null;
        render();
        return;
      }
      if (action === 'open') {
        var found = matchById(parseInt(el.dataset.match, 10));
        if (!found) { return; }
        next.league = found.lg.code;
        next.md = found.m.md;
        next.match = found.m.id;
        next.club = null;
        go(next);
        return;
      }
      if (action === 'club') {
        var clubId = parseInt(el.dataset.team, 10);
        if (!clubLocate(clubId)) { return; }
        next.match = null;
        next.club = clubId;
        go(next);
        return;
      }
      if (action === 'close') {
        next.match = null;
        next.club = null;
        go(next);
        return;
      }
      if (action === 'theme') {
        toggleTheme();
        render();
        return;
      }
      if (action === 'pick') {
        var id = parseInt(el.dataset.match, 10);
        var loc = matchById(id);
        if (!loc || !isUpcoming(loc.m)) { return; }
        var type = el.dataset.pick;
        if (picks[id] && picks[id].type === type) {
          delete picks[id];
          savePicks();
          toast('Pronóstico retirado');
        } else {
          var prev = picks[id];
          var prob = pickProbability(loc.lg, loc.m, type);
          var pkey = PICK_PRICE_KEY[type];
          var odd = pkey ? priceIn(id, pkey, state.book || ODDS.primary) : null;
          picks[id] = {
            type: type, p: prob, at: new Date().toISOString(), lg: loc.lg.code, md: loc.m.md,
            odd: odd, stake: (prev && typeof prev.stake === 'number') ? prev.stake : null
          };
          savePicks();
          toast('Guardado: ' + PICK_LABEL[type] + (odd ? ' · cuota ' + dec(odd) : ''));
        }
        render();
        return;
      }
      if (action === 'unpick') {
        delete picks[el.dataset.match];
        savePicks();
        toast('Pronóstico retirado');
        render();
        return;
      }
      if (action === 'sync-open') {
        syncState.open = true;
        syncState.error = '';
        syncState.msg = '';
        render();
        return;
      }
      if (action === 'sync-close') {
        syncState.open = false;
        render();
        return;
      }
      if (action === 'sync-save') {
        saveSyncKeys();
        syncState.error = '';
        syncState.msg = 'Claves guardadas';
        render();
        return;
      }
      if (action === 'sync-run') {
        runRefresh(false);
        return;
      }
      if (action === 'minconf') {
        writeStored(MINCONF_KEY, el.dataset.p);
        go(next, true);
        return;
      }
      if (action === 'ticket-archive') {
        var archLegs = ticketLegs();
        if (!archLegs.length) { toast('Añade patas antes de guardar'); return; }
        var archBest = ticketBest(archLegs);
        var archRec = {
          at: new Date().toISOString(),
          stake: ticketStake(),
          price: archBest ? archBest.price : null,
          book: archBest ? archBest.name : null,
          legs: archLegs.map(function (x) {
            var AH = x.lg.teamById[x.m.h], AA = x.lg.teamById[x.m.a];
            return { mid: x.mid, sel: x.sel.id, label: x.lg.code + ' ' + AH.name + ' — ' + AA.name + ' (' + x.sel.short + ')' };
          })
        };
        var archHist = readHistory();
        archHist.push(archRec);
        saveHistory(archHist);
        next.ticket = [];
        saveTicket(next.ticket);
        shareCtx = null;
        toast('Combinada guardada en el historial');
        go(next, true);
        return;
      }
      if (action === 'hist-del') {
        saveHistory(readHistory().filter(function (x) { return x.at !== el.dataset.at; }));
        toast('Eliminada del historial');
        render();
        return;
      }
      if (action === 'update-check') {
        if (window.AndroidUpdate && typeof window.AndroidUpdate.check === 'function') {
          window.AndroidUpdate.check();
          toast('Buscando actualización…');
        } else {
          toast('Esta opción está disponible en la app Android');
        }
        return;
      }
    });

    // Live € handling: the stake inputs update their stored value and the
    // return right next to them without a full re-render, so focus survives.
    document.addEventListener('input', function (ev) {
      var el = ev.target;
      if (!el || !el.dataset) { return; }
      if (el.id === 'sync-fd') { writeStored(SYNC.FD_KEY, el.value.trim()); return; }
      if (el.id === 'sync-odds') { writeStored(SYNC.ODDS_KEY, el.value.trim()); return; }
      var kind = el.dataset.stake;
      if (!kind) { return; }
      var stake = parseFloat(el.value);
      if (!(stake > 0)) { stake = 0; }
      var price = parseFloat(el.dataset.price) || 0;
      var out = el.dataset.out ? document.getElementById(el.dataset.out) : null;
      if (out) { 
        var ret = stake * price;
        var profit = ret - stake;
        var profitClass = profit > 0 ? 'positive' : (profit < 0 ? 'negative' : '');
        out.textContent = (stake > 0 && price > 1) ? eur(ret) : '—';
        // Update profit display if exists
        var profitEl = document.getElementById(outId + '-profit');
        if (profitEl) {
          if (stake > 0 && price > 1) {
            profitEl.textContent = eur(profit);
            profitEl.className = 'stake-profit ' + profitClass;
          } else {
            profitEl.textContent = '—';
            profitEl.className = 'stake-profit';
          }
        }
      }
      if (kind === 'pick') {
        var pid = parseInt(el.dataset.match, 10);
        if (picks[pid]) {
          picks[pid].stake = stake > 0 ? stake : null;
          savePicks();
        }
      } else if (kind === 'ticket') {
        writeStored(TICKET_STAKE_KEY, stake > 0 ? String(stake) : '');
      } else if (kind === 'combo') {
        var map = readComboStakes();
        if (stake > 0) { map[el.dataset.size] = stake; } else { delete map[el.dataset.size]; }
        writeStored(COMBO_STAKE_KEY, JSON.stringify(map));
      }
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && syncState.open) {

    window.addEventListener('hashchange', function () {

    /* ===================== Actualización de datos desde el móvil =====================
       The page cannot call football-data.org directly (its CORS only authorises
       http://localhost, and the app runs on appassets.androidplatform.net), so
       the native NetBridge does the GET and calls us back. Everything here is
       optional: with no key the bundled snapshot keeps the app fully working. */
    var FD_SEASON = String(SNAP.season || '2026');
    var FD_SPACING_MS = 7000;
    var SPORT_BY_LG = {
      PL: 'soccer_epl',
      PD: 'soccer_spain_la_liga',
      SA: 'soccer_italy_serie_a',
      BL1: 'soccer_germany_bundesliga',
      FL1: 'soccer_france_ligue_one'
    };
    var REFRESH_WINDOW_H = 6;
    var TICKET_STAKE_KEY = 'od-ticket-stake-2627';
    var COMBO_STAKE_KEY = 'od-combo-stakes-2627';

    var syncState = { open: false, busy: false, msg: '', error: '' };

    var netSeq = 0;
    var netPending = {};
    window.__odNetResult = function (id, result) {
      var pending = netPending[id];
      if (!pending) { return; }
      delete netPending[id];
      if (result && result.status >= 200 && result.status < 300) {
        pending.resolve(result.body);
      } else {
        var why = (result && result.error) ? result.error : ('HTTP ' + (result && result.status));
        pending.reject(new Error(why));
      }
    };

    function netGet(url, headerName, headerValue) {
      return new Promise(function (resolve, reject) {
        if (window.AndroidNet && window.AndroidNet.get) {
          var id = 'r' + (++netSeq);
          netPending[id] = { resolve: resolve, reject: reject };
          try {
            window.AndroidNet.get(id, url, headerName || '', headerValue || '');
          } catch (e) {
            delete netPending[id];
            reject(e);
          }
          return;
        }
        // Fallback for a desktop preview: The Odds API allows any origin, so
        // only football-data.org will fail here and the caller reports it.
        var opts = {};
        if (headerName && headerValue) { opts.headers = {}; opts.headers[headerName] = headerValue; }
        fetch(url, opts).then(function (r) {
          return r.text().then(function (t) {
            if (r.ok) { resolve(t); } else { reject(new Error('HTTP ' + r.status + ' · ' + t.slice(0, 120))); }
          });
        }).catch(reject);
      });
    }

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function round2(n) { return Math.round(Number(n) * 100) / 100; }
    function isoNow() { return new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'); }

    /* ---------- normalización señales equipos (portado de tools/fetch-odds.mjs) ---------- */
    var NAME_NOISE = {
      fc: 1, cf: 1, afc: 1, sc: 1, ac: 1, as: 1, ss: 1, us: 1, sv: 1, sd: 1, rc: 1, cd: 1, ud: 1,
      rcd: 1, fk: 1, sk: 1, bk: 1, vfb: 1, rb: 1, tsv: 1, fsv: 1, tsg: 1, club: 1, calcio: 1, de: 1,
      del: 1, la: 1, le: 1, el: 1, and: 1, y: 1, the: 1, '1': 1, '04': 1, '05': 1, '07': 1, '96': 1,
      '98': 1, '1899': 1, '1846': 1, '1901': 1, '1907': 1, '1913': 1, '0': 1
    };
    function stripName(s) {
      return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\u0178/g, 'z').toLowerCase();
    }
    function tokens(s) {
      return stripName(s).replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(function (w) { return w && !NAME_NOISE[w]; });
    }
    function sim(a, b) {
      if (!a.length || !b.length) { return 0; }
      var pool = b.slice(), inter = 0;
      a.forEach(function (w) {
        var i = pool.indexOf(w);
        if (i >= 0) { inter++; pool.splice(i, 1); }
      });
      return inter / Math.max(a.length, b.length);
    }
    function pairSim(a1, a2, b1, b2) {
      return Math.max(Math.max(sim(a1, b1), sim(a2, b2)), Math.max(sim(a1, b2), sim(a2, b1)));
    }

    /* ---------- resultados y clasificación ---------- */
    function deriveTable(l) {
      var rows = {};
      l.teams.forEach(function (t) { rows[t.id] = { t: t.id, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }; });
      l.matches.forEach(function (m) {
        if (m.st !== 'FINISHED') { return; }
        var H = rows[m.h], A = rows[m.a];
        if (!H || !A || m.hg == null || m.ag == null) { return; }
        H.p++; A.p++;
        H.gf += m.hg; H.ga += m.ag; A.gf += m.ag; A.ga += m.hg;
        if (m.hg > m.ag) { H.w++; A.l++; H.pts += 3; }
        else if (m.hg === m.ag) { H.d++; A.d++; H.pts++; A.pts++; }
        else { A.w++; H.l++; A.pts += 3; }
      });
      var list = Object.keys(rows).map(function (k) { return rows[k]; });
      list.sort(function (a, b) {
        if (b.pts !== a.pts) { return b.pts - a.pts; }
        var dg = (b.gf - b.ga) - (a.gf - a.ga);
        if (dg) { return dg; }
        if (b.gf !== a.gf) { return b.gf - a.gf; }
        return String(a.t).localeCompare(String(b.t));
      });
      list.forEach(function (r, i) { r.pos = i + 1; });
      return list;
    }

    function applySeason(payloads) {
      var touched = 0;
      ORDER.forEach(function (code) {
        var pl = payloads[code];
        if (!pl || !pl.matches) { return; }
        var l = LG[code];
        if (!l) { return; }
        var byId = {};
        l.matches.forEach(function (m) { byId[m.id] = m; });
        pl.matches.forEach(function (rm) {
          var m = byId[rm.id];
          if (!m) { return; }
          if (rm.utcDate) { m.utc = rm.utcDate; }
          if (rm.status) { m.st = rm.status; }
          if (rm.status === 'FINISHED' && rm.score && rm.score.fullTime &&
              rm.score.fullTime.home != null && rm.score.fullTime.away != null) {
            m.hg = rm.score.fullTime.home;
            m.ag = rm.score.fullTime.away;
          }
        });
        l.byMd = {};
        l.matches.forEach(function (m) { (l.byMd[m.md] = l.byMd[m.md] || []).push(m); });
        l.finishedCount = l.matches.filter(function (m) { return m.st === 'FINISHED'; }).length;
        l.table = deriveTable(l);
        var played = l.matches.filter(function (m) { return m.st === 'FINISHED'; }).map(function (m) { return m.md; });
        var next = played.length ? Math.max.apply(null, played) + 1 : 1;
        l.currentMatchday = Math.min(next, l.totalMatchdays);
        l.updated = isoNow();
        touched++;
      });
      CTX = {};
      SNAP.generated = isoNow();
      if (touched) { writeStored(SYNC.SEASON_CACHE, JSON.stringify(SNAP)); }
      return touched;
    }

    /* ---------- cuotas ---------- */
    function buildOddsSnapshot(eventsBySport) {
      var wantLines = [1.5, 2.5];
      var upcoming = [];
      ORDER.forEach(function (code) {
        var l = LG[code];
        if (!l || !l.matches) { return; }
        l.matches.forEach(function (m) {
          if (m.st === 'FINISHED') { return; }
          var ts = Date.parse(m.utc);
          if (!(ts > Date.now())) { return; }
          var H = l.teamById[m.h], A = l.teamById[m.a];
          var hn = H ? H.name : '', an = A ? A.name : '';
          upcoming.push({ id: m.id, utc: m.utc, ts: ts, lg: code, md: m.md, hn: hn, an: an, th: tokens(hn), ta: tokens(an) });
        });
      });
      var byLeagueMinute = {};
      upcoming.forEach(function (m) {
        var k = m.lg + '|' + m.utc.slice(0, 16);
        (byLeagueMinute[k] = byLeagueMinute[k] || []).push(m);
      });
      var bookNames = {}, matches = {}, taken = {};
      ORDER.forEach(function (code) {
        (eventsBySport[code] || []).forEach(function (ev) {
          if (!ev || !ev.home_team || !ev.away_team) { return; }
          var eh = ev.home_team, ea = ev.away_team;
          var eth = tokens(eh), eta = tokens(ea);
          var target = null;
          var key = code + '|' + String(ev.commence_time).slice(0, 16);
          var exact = (byLeagueMinute[key] || []).filter(function (m) { return !taken[m.id]; });
          if (exact.length === 1) { target = exact[0]; }
          else if (exact.length > 1) {
            var top = null;
            exact.forEach(function (m) {
              var sc = pairSim(eth, eta, m.th, m.ta);
              if (!top || sc > top.sc) { top = { m: m, sc: sc }; }
            });
            if (top && top.sc >= 0.5) { target = top.m; }
          }
          if (!target) {
            var evMin = Date.parse(ev.commence_time), best = null;
            upcoming.forEach(function (m) {
              if (m.lg !== code || taken[m.id]) { return; }
              var dm = Math.abs(m.ts - evMin);
              if (dm > 45 * 60000) { return; }
              var sc = pairSim(eth, eta, m.th, m.ta);
              var score = sc * 100 - dm / 60000;
              if (!best || score > best.score) { best = { m: m, sc: sc, score: score }; }
            });
            if (best && best.sc >= 0.6) { target = best.m; }
          }
          if (!target) { return; }
          taken[target.id] = true;
          var books = {};
          (ev.bookmakers || []).forEach(function (b) {
            if (b && b.key) { bookNames[b.key] = b.title || b.key; }
            var row = {};
            (b.markets || []).forEach(function (mk) {
              if (mk.key === 'h2h') {
                (mk.outcomes || []).forEach(function (o) {
                  var nm = stripName(o.name), p = Number(o.price);
                  if (!(p > 1)) { return; }
                  if (nm === 'draw') { if (!row.d) { row.d = p; } }
                  else if (nm === stripName(eh)) { if (!row.h) { row.h = p; } }
                  else if (nm === stripName(ea)) { if (!row.a) { row.a = p; } }
                });
              } else if (mk.key === 'totals') {
                (mk.outcomes || []).forEach(function (o) {
                  var line = Number(o.point), p = Number(o.price);
                  var sn = stripName(o.name);
                  var side = sn === 'over' ? 'o' : sn === 'under' ? 'u' : null;
                  if (!(p > 1) || !side || !isFinite(line) || wantLines.indexOf(line) < 0) { return; }
                  if (!row.tot) { row.tot = {}; }
                  var kk = String(line);
                  if (!row.tot[kk]) { row.tot[kk] = {}; }
                  if (row.tot[kk][side] == null) { row.tot[kk][side] = p; }
                });
              }
            });
            var clean = {};
            if (row.h) { clean.h = round2(row.h); }
            if (row.d) { clean.d = round2(row.d); }
            if (row.a) { clean.a = round2(row.a); }
            if (row.tot) {
              clean.tot = {};
              Object.keys(row.tot).sort(function (x, y) { return Number(x) - Number(y); }).forEach(function (kk) {
                var t = row.tot[kk];
                if (!(t.o || t.u)) { return; }
                clean.tot[kk] = { o: t.o ? round2(t.o) : null, u: t.u ? round2(t.u) : null };
              });
              if (!Object.keys(clean.tot).length) { delete clean.tot; }
            }
            if (Object.keys(clean).length) { books[b.key] = clean; }
          });
          if (!Object.keys(books).length) { return; }
          matches[target.id] = { u: target.utc, lg: code, md: target.md, e: ev.id, hn: target.hn, an: target.an, books: books };
        });
      });
      var bookList = Object.keys(bookNames).map(function (k) { return { key: k, name: bookNames[k] }; })
        .sort(function (a, b) { return a.name.localeCompare(b.name); });
      return {
        schema: 'od-odds/v2',
        source: 'the-odds-api.com v4',
        season: SNAP.season,
        generated: new Date().toISOString(),
        markets: { h2h: true, totals: wantLines },
        bookmakers: bookList,
        matches: matches
      };
    }

    function applyOdds(snap) {
      ODDS = snap;
      reindexOdds();
      writeStored(SYNC.ODDS_CACHE, JSON.stringify(ODDS));
    }

    /* ---------- descargas ---------- */
    function getWithRetry(url, headerName, headerValue, tries) {
      return netGet(url, headerName, headerValue).catch(function (err) {
        var msg = String(err && err.message ? err.message : err);
        if (/429|too many/i.test(msg) && tries > 1) {
          setSyncStatus('Límite alcanzado, esperando 45 s…');
          return wait(45000).then(function () { return getWithRetry(url, headerName, headerValue, tries - 1); });
        }
        throw err;
      });
    }

    function refreshSeason(token) {
      var codes = ORDER.slice(), out = {}, chain = Promise.resolve();
      codes.forEach(function (code, i) {
        chain = chain.then(function () {
          setSyncStatus('Resultados ' + (i + 1) + '/' + codes.length + ' · ' + code + '…');
          var url = 'https://api.football-data.org/v4/competitions/' + code + '/matches?season=' + encodeURIComponent(FD_SEASON);
          return getWithRetry(url, 'X-Auth-Token', token, 3).then(function (body) {
            out[code] = JSON.parse(body);
            if (i < codes.length - 1) { return wait(FD_SPACING_MS); }
          });
        });
      });
      return chain.then(function () { return out; });
    }

    function refreshOdds(key) {
      var codes = ORDER.slice(), eventsBySport = {}, chain = Promise.resolve();
      var from = isoNow();
      var to = new Date(Date.now() + 12 * 864e5).toISOString().replace(/\.\d{3}Z$/, 'Z');
      codes.forEach(function (code, i) {
        var sport = SPORT_BY_LG[code];
        if (!sport) { return; }
        chain = chain.then(function () {
          setSyncStatus('Cuotas ' + (i + 1) + '/' + codes.length + ' · ' + code + '…');
          var url = 'https://api.the-odds-api.com/v4/sports/' + sport + '/odds/?' +
            'apiKey=' + encodeURIComponent(key) + '&regions=eu&markets=h2h,totals&oddsFormat=decimal&dateFormat=iso' +
            '&commenceTimeFrom=' + encodeURIComponent(from) + '&commenceTimeTo=' + encodeURIComponent(to);
          return getWithRetry(url, '', '', 3).then(function (body) {
            var j = JSON.parse(body);
            eventsBySport[code] = Array.isArray(j) ? j : [];
            if (i < codes.length - 1) { return wait(800); }
          });
        });
      });
      return chain.then(function () { return eventsBySport; });
    }

    function setSyncStatus(msg) {
      syncState.msg = msg;
      var el = document.getElementById('sync-status');
      if (el) { el.textContent = msg; }
    }

    function saveSyncKeys() {
      var fdEl = document.getElementById('sync-fd');
      var odEl = document.getElementById('sync-odds');
      if (fdEl) { writeStored(SYNC.FD_KEY, fdEl.value.trim()); }
      if (odEl) { writeStored(SYNC.ODDS_KEY, odEl.value.trim()); }
    }

    function runRefresh(silent) {
      if (syncState.busy) { return; }
      if (!silent) { saveSyncKeys(); }
      var fd = readStored(SYNC.FD_KEY) || '';
      var od = readStored(SYNC.ODDS_KEY) || '';
      syncState.busy = true;
      syncState.error = '';
      syncState.msg = 'Preparando…';
      if (!silent) { render(); }
      if (!fd && !od) {
        syncState.busy = false;
        syncState.error = 'Introduce al menos una clave para actualizar.';
        render();
        return;
      }
      var steps = Promise.resolve();
      if (fd) {
        steps = steps.then(function () { return refreshSeason(fd); }).then(function (out) {
          if (out && Object.keys(out).length) { applySeason(out); }
        });
      }
      if (od) {
        steps = steps.then(function () { return refreshOdds(od); }).then(function (evs) {
          var snap = buildOddsSnapshot(evs);
          if (Object.keys(snap.matches).length) { applyOdds(snap); }
        });
      }
      steps.then(function () {
        syncState.busy = false;
        syncState.msg = 'Datos actualizados · ' + new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        writeStored(SYNC.LAST, isoNow());
        render();
        toast('Datos actualizados');
      }).catch(function (err) {
        syncState.busy = false;
        syncState.error = String(err && err.message ? err.message : err);
        syncState.msg = '';
        render();
      });
    }

    function autoRefreshOnBoot() {
      var fd = readStored(SYNC.FD_KEY);
      var od = readStored(SYNC.ODDS_KEY);
      if (!fd && !od) { return; }
      var lastRaw = readStored(SYNC.LAST);
      var last = lastRaw ? Date.parse(lastRaw) : 0;
      if (last && Date.now() - last < REFRESH_WINDOW_H * 3600000) { return; }
      if (typeof navigator !== 'undefined' && navigator.onLine === false) { return; }
      runRefresh(true);
    }

    /* ---------- importe apostado ---------- */
    function eur(x) { return Number(x).toFixed(2).replace('.', ',') + ' €'; }
    function pickStake(id) {
      var p = picks[id];
      return (p && typeof p.stake === 'number' && p.stake > 0) ? p.stake : null;
    }
    function ticketStake() {
      var v = parseFloat(readStored(TICKET_STAKE_KEY));
      return v > 0 ? v : null;
    }
    function readComboStakes() {
      try { var m = JSON.parse(readStored(COMBO_STAKE_KEY)); return (m && typeof m === 'object') ? m : {}; }
      catch (e) { return {}; }
    }
    function comboStake(size) {
      var v = readComboStakes()[size];
      return (typeof v === 'number' && v > 0) ? v : null;
    }

    /* ---------- filtro de confianza mínima ---------- */
    var MINCONF_KEY = 'od-minconf-2627';
    function minConf() {
      var v = parseFloat(readStored(MINCONF_KEY));
      return v > 0 ? v : 0;
    }
    function bestSelP(lg, m) {
      var mx = 0;
      selsFor(lg, m).forEach(function (s) { if (s.p > mx) { mx = s.p; } });
      return mx;
    }

    /* ---------- historial de combinadas ---------- */
    var HISTORY_KEY = 'od-history-2627';
    var SEL_TO_PICK = { h: '1', d: 'X', a: '2', o15: 'o15', u15: 'u15', o25: 'o25', u25: 'u25' };
    function readHistory() {
      try { var a = JSON.parse(readStored(HISTORY_KEY)); return a && a.length ? a : []; }
      catch (e) { return []; }
    }
    function saveHistory(list) { writeStored(HISTORY_KEY, JSON.stringify(list)); }
    function ticketOutcome(entry) {
      var legs = entry.legs || [];
      if (!legs.length) { return 'unknown'; }
      var allDone = true, allOk = true;
      for (var i = 0; i < legs.length; i++) {
        var f = matchById(legs[i].mid);
        if (!f || f.m.st !== 'FINISHED') { allDone = false; break; }
        if (pickVerdict(f.m, SEL_TO_PICK[legs[i].sel] || legs[i].sel) !== 'ok') { allOk = false; }
      }
      return !allDone ? 'pending' : (allOk ? 'won' : 'lost');
    }
    function historyCard() {
      var hist = readHistory();
      if (!hist.length) { return ''; }
      hist = hist.slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; });
      var rows = hist.map(function (h) {
        var st = ticketOutcome(h);
        var pill = st === 'won' ? '<span class="pill is-good">Ganada</span>'
          : st === 'lost' ? '<span class="pill is-bad">Perdida</span>'
            : st === 'pending' ? '<span class="pill is-warn">Pendiente</span>'
              : '<span class="pill is-flat">Sin resultado</span>';
        var pl = null;
        if (h.stake && h.price && (st === 'won' || st === 'lost')) {
          pl = st === 'won' ? h.stake * h.price - h.stake : -h.stake;
        }
        return '<div class="hist-row"><div class="body">' +
          '<span class="kicker">' + esc(dfLong.format(new Date(h.at))) + ' · ' + (h.legs || []).length + ' patas</span>' +
          '<span class="ttl od-clamp-2">' + esc((h.legs || []).map(function (x) { return x.label || x.sel; }).join(' · ')) + '</span>' +
          '<span class="meta mono">' + (h.stake ? 'importe ' + eur(h.stake) : 'sin importe') + (h.price ? ' · cuota ' + dec(h.price) : ' · sin cuota') + '</span>' +
          '</div><div class="od-stack" style="--od-gap:6px;justify-items:end">' + pill +
          (pl == null ? '' : '<span class="mono ' + (pl >= 0 ? 'is-good' : 'is-bad') + '">' + (pl >= 0 ? '+' : '') + eur(pl) + '</span>') +
          '<button class="icon-btn" data-action="hist-del" data-at="' + esc(h.at) + '" aria-label="Borrar del historial">' + ICON.close + '</button>' +
          '</div></div>';
      }).join('');
      return '<section class="card"><div class="h"><h2>Historial de combinadas</h2><span class="pill is-flat">' + hist.length + '</span></div>' +
        '<div class="hist-list">' + rows + '</div>' +
        '<p class="note">Cada combinada guardada se evalúa con los resultados reales. La ganancia usa el importe y la cuota combinada de la casa en el momento de guardarla.</p></section>';
    }

    /* ---------- cartera (bankroll) ---------- */
    function bankrollData() {
      var staked = 0, returned = 0, settled = 0, bets = 0;
      var byMarket = {}, byLeague = {}, curve = [];
      Object.keys(picks).forEach(function (key) {
        var e = picks[key];
        var found = matchById(parseInt(key, 10));
        if (!found) { return; }
        var m = found.m;
        var hasBet = typeof e.stake === 'number' && e.stake > 0;
        if (!hasBet) { return; }
        bets++;
        if (m.st !== 'FINISHED') { return; }
        settled++;
        var ok = pickVerdict(m, e.type) === 'ok';
        var ret = (ok && e.odd) ? e.stake * e.odd : 0;
        staked += e.stake; returned += ret;
        curve.push({ t: Date.parse(m.utc), net: ret - e.stake });
        var tkey = PICK_LABEL[e.type] || e.type;
        if (!byMarket[tkey]) { byMarket[tkey] = { n: 0, ok: 0 }; }
        byMarket[tkey].n++; if (ok) { byMarket[tkey].ok++; }
        var lkey = e.lg || found.lg.code;
        if (!byLeague[lkey]) { byLeague[lkey] = { n: 0, ok: 0 }; }
        byLeague[lkey].n++; if (ok) { byLeague[lkey].ok++; }
      });
      curve.sort(function (a, b) { return a.t - b.t; });
      var run = 0;
      var pts = curve.map(function (p) { run += p.net; return { t: p.t, v: run }; });
      return { staked: staked, returned: returned, settled: settled, bets: bets, net: returned - staked, byMarket: byMarket, byLeague: byLeague, pts: pts };
    }
    function sparkline(pts) {
      if (pts.length < 2) { return ''; }
      var W = 300, H = 64, pad = 6;
      var vs = pts.map(function (p) { return p.v; });
      var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
      var span = (hi - lo) || 1;
      var step = (W - pad * 2) / (pts.length - 1);
      var coords = pts.map(function (p, i) {
        var x = pad + i * step;
        var y = H - pad - ((p.v - lo) / span) * (H - pad * 2);
        return x.toFixed(1) + ',' + y.toFixed(1);
      });
      var zeroY = (lo <= 0 && hi >= 0) ? (H - pad - ((0 - lo) / span) * (H - pad * 2)) : null;
      var up = pts[pts.length - 1].v >= 0;
      return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Evolución del saldo">' +
        (zeroY != null ? '<line class="spark-zero" x1="' + pad + '" y1="' + zeroY.toFixed(1) + '" x2="' + (W - pad) + '" y2="' + zeroY.toFixed(1) + '"/>' : '') +
        '<polyline class="spark-line' + (up ? '' : ' is-down') + '" points="' + coords.join(' ') + '"/></svg>';
    }
    function hitTable(title, obj) {
      var keys = Object.keys(obj);
      if (!keys.length) { return ''; }
      keys.sort(function (a, b) { return obj[b].n - obj[a].n; });
      return '<div class="hit-col"><h3>' + esc(title) + '</h3><dl class="kv">' + keys.map(function (k) {
        var r = obj[k];
        return '<dt>' + esc(k) + '</dt><dd class="mono">' + Math.round(r.ok / r.n * 100) + '% · ' + r.ok + '/' + r.n + '</dd>';
      }).join('') + '</dl></div>';
    }
    function bankrollCard() {
      var b = bankrollData();
      if (!b.bets) {
        return '<section class="card"><h2>Cartera</h2><p class="note">Guarda una cuota y un importe en tus pronósticos para ver aquí el balance: apostado, devuelto, beneficio y aciertos por mercado y liga.</p></section>';
      }
      var roi = b.staked ? Math.round((b.net / b.staked) * 100) : null;
      var hasHits = Object.keys(b.byMarket).length || Object.keys(b.byLeague).length;
      return '<section class="card"><div class="h"><h2>Cartera</h2><span class="pill is-flat">' + b.bets + (b.bets === 1 ? ' apuesta' : ' apuestas') + '</span></div>' +
        '<div class="stat-strip" style="--od-cols:4">' +
        '<div class="cell"><span class="val mono">' + eur(b.staked) + '</span><span class="lab">apostado</span></div>' +
        '<div class="cell"><span class="val mono">' + eur(b.returned) + '</span><span class="lab">devuelto</span></div>' +
        '<div class="cell"><span class="val mono ' + (b.net >= 0 ? 'is-good' : 'is-bad') + '">' + (b.net >= 0 ? '+' : '') + eur(b.net) + '</span><span class="lab">balance</span></div>' +
        '<div class="cell"><span class="val mono">' + (roi == null ? '—' : (roi >= 0 ? '+' : '') + roi + '%') + '</span><span class="lab">ROI</span></div>' +
        '</div>' +
        (b.pts.length > 1 ? sparkline(b.pts) : '') +
        '<p class="note">' + b.settled + ' de ' + b.bets + ' con importe ya resueltas. Balance = devuelto − apostado, con la cuota guardada en cada pronóstico.</p>' +
        (hasHits ? '<div class="hit-grid">' + hitTable('Aciertos por mercado', b.byMarket) + hitTable('Aciertos por liga', b.byLeague) + '</div>' : '') +
        '</section>';
    }

    /* ---------- avisos nativos: notificación y widget ---------- */
    function scheduleRoundEnd() {
      if (!(window.AndroidNotify && typeof window.AndroidNotify.schedule === 'function')) { return; }
      var last = 0, label = '';
      ORDER.forEach(function (code) {
        var l = LG[code];
        var md = l.currentMatchday;
        (l.byMd[md] || []).forEach(function (m) {
          if (!isUpcoming(m)) { return; }
          var t = Date.parse(m.utc);
          if (t > last) { last = t; label = l.name + ' · J' + md; }
        });
      });
      if (!last) { return; }
      var end = last + 2 * 3600000;
      if (end - Date.now() > 4 * 24 * 3600000) { return; }
      try {
        window.AndroidNotify.schedule(end, 'Jornada terminada', label + ' ya tiene resultados. Abre la app para ver tus aciertos.');
      } catch (e) { /* bridge unavailable */ }
    }
    function widgetSnapshot() {
      var nextM = null, nextL = null;
      ORDER.forEach(function (code) {
        var l = LG[code];
        var md = l.currentMatchday;
        (l.byMd[md] || []).forEach(function (m) {
          if (!isUpcoming(m)) { return; }
          if (!nextM || Date.parse(m.utc) < Date.parse(nextM.utc)) { nextM = m; nextL = l; }
        });
      });
      var lines = [];
      if (nextM && nextL) {
        var H = nextL.teamById[nextM.h], A = nextL.teamById[nextM.a];
        lines.push(nextL.name + ' · J' + nextM.md);
        lines.push(H.tla + ' — ' + A.tla + ' · ' + dfDM.format(new Date(nextM.utc)) + ' ' + dfTime.format(new Date(nextM.utc)));
      }
      var pl = [];
      Object.keys(picks).forEach(function (k) {
        var e = picks[k];
        var f = matchById(parseInt(k, 10));
        if (f && isUpcoming(f.m)) {
          pl.push(f.lg.teamById[f.m.h].tla + '-' + f.lg.teamById[f.m.a].tla + ' ' + PICK_LABEL[e.type] + ' ' + pct(e.p));
        }
      });
      if (pl.length) { lines.push('Mis pronósticos: ' + pl.slice(0, 2).join(' · ')); }
      if (!lines.length) { lines.push('Sin partidos próximos'); }
      return JSON.stringify({ lines: lines });
    }
    function pushWidget() {
      if (!(window.AndroidWidget && typeof window.AndroidWidget.update === 'function')) { return; }
      try { window.AndroidWidget.update(widgetSnapshot()); } catch (e) { /* bridge unavailable */ }
    }

    // Shared markup: an € field plus the live return it produces at [attr] price.
    function stakeRow(kind, price, value, outId, extra) {
      var ret = (price && value) ? value * price : 0;
      var profit = ret - (value || 0);
      var profitClass = profit > 0 ? 'positive' : (profit < 0 ? 'negative' : '');
      var profitHtml = (price && value && profit !== 0)
        ? '<span class="stake-profit ' + profitClass + '" id="' + outId + '-profit">' + eur(profit) + '</span>'
        : '<span class="stake-profit" id="' + outId + '-profit">—</span>';
      return '<div class="stake-row"><label class="stake-lab">Importe</label>' +
        '<input class="stake-input" type="number" inputmode="decimal" min="0" step="0.5"' +
        ' data-stake="' + kind + '"' + (extra || '') + ' data-price="' + (price || '') + '"' +
        ' data-out="' + outId + '" value="' + (value == null ? '' : value) + '" placeholder="0" aria-label="Importe apostado en euros">' +
        '<span class="stake-return mono" id="' + outId + '">' +
        ((price && value) ? eur(ret) : '—') + '</span>' + profitHtml + '</div>';
    }

    function syncCardHtml() {
      var hasFd = !!readStored(SYNC.FD_KEY);
      var hasOd = !!readStored(SYNC.ODDS_KEY);
      var lastRaw = readStored(SYNC.LAST);
      var when = lastRaw ? String(lastRaw).replace('T', ' ').replace(/\..*$/, '').replace('Z', ' UTC') : 'nunca';
      return '<section class="card"><div class="h"><h2>Actualizar datos</h2>' +
        '<span class="pill is-flat">' + ((hasFd || hasOd) ? 'configurado' : 'sin claves') + '</span></div>' +
        '<p>Descarga los resultados de la jornada y las cuotas actuales directamente desde el móvil. Las claves se guardan solo en este dispositivo y nunca se incluyen en la app.</p>' +
        '<dl class="kv"><dt>Última actualización</dt><dd class="mono">' + esc(when) + '</dd>' +
        '<dt>football-data.org</dt><dd>' + (hasFd ? 'clave guardada' : 'sin clave') + '</dd>' +
        '<dt>The Odds API</dt><dd>' + (hasOd ? 'clave guardada' : 'sin clave') + '</dd></dl>' +
        '<div class="btn-row"><button class="btn" data-action="sync-open" aria-label="Abrir configuración de sincronización">' + ICON.save + '<span>Actualizar ahora</span></button></div>' +
        '<p class="note">Sin clave la app sigue funcionando con el snapshot incluido. Con clave intenta actualizar sola al abrir, como mucho una vez cada ' + REFRESH_WINDOW_H + ' horas.</p></section>';
    }

    function updateCardHtml() {
      var native = typeof window !== 'undefined' && window.AndroidUpdate && typeof window.AndroidUpdate.check === 'function';
      return '<section class="card"><div class="h"><h2>Versión de la app</h2>' +
        '<span class="pill is-flat">' + (native ? 'Android' : 'vista web') + '</span></div>' +
        '<p>La aplicación comprueba sola si hay una versión nueva cada vez que la abres. Si quieres forzar la comprobación ahora, pulsa el botón.</p>' +
        '<div class="btn-row"><button class="btn" data-action="update-check"' + (native ? '' : ' disabled') + ' aria-label="Buscar versión nueva">' + ICON.model + '<span>Buscar versión nueva</span></button></div>' +
        (native ? '' : '<p class="note">Esta opción solo funciona dentro de la app instalada en Android.</p>') +
        '</section>';
    }

    function renderSyncSheet() {
      if (!syncState.open) { return ''; }
      var fd = readStored(SYNC.FD_KEY) || '';
      var od = readStored(SYNC.ODDS_KEY) || '';
      var status;
      if (syncState.busy) { status = '<p class="note" style="margin:0">Actualizando…</p>'; }
      else if (syncState.error) { status = '<p class="note" style="margin:0" id="sync-error"><span style="color:var(--red)">' + esc(syncState.error) + '</span></p>'; }
      else { status = '<p class="note" style="margin:0" id="sync-status">' + esc(syncState.msg || 'Listo para actualizar.') + '</p>'; }
      return '<div class="sheet-layer" id="syncLayer">' +
        '<div class="sheet-scrim" data-action="sync-close"></div>' +
        '<section class="sheet" role="dialog" aria-modal="true" aria-label="Actualizar datos">' +
        '<div class="sheet-bar"><span class="od-field"><span class="kicker">Actualización</span><span class="t">Datos en directo</span></span>' +
        '<button class="icon-btn" data-action="sync-close" aria-label="Cerrar">' + ICON.close + '</button></div>' +
        '<div class="sheet-body od-scroll">' +
        '<section class="card"><h2>Claves de acceso</h2>' +
        '<p>Introduce tus claves gratuitas una vez. Se guardan solo en este dispositivo y nunca se suben a ningún servidor ni se incluyen en el APK.</p>' +
        '<label class="stake-lab" for="sync-fd">Token de football-data.org</label>' +
        '<input class="sync-input" id="sync-fd" type="text" autocomplete="off" spellcheck="false" value="' + esc(fd) + '" placeholder="X-Auth-Token">' +
        '<label class="stake-lab" for="sync-odds">Clave de The Odds API</label>' +
        '<input class="sync-input" id="sync-odds" type="text" autocomplete="off" spellcheck="false" value="' + esc(od) + '" placeholder="api key">' +
        status +
        '<div class="btn-row" style="margin-top:12px">' +
        '<button class="btn" data-action="sync-run"' + (syncState.busy ? ' disabled' : '') + ' aria-label="' + (syncState.busy ? 'Sincronizando' : 'Ejecutar sincronización') + '">' + (syncState.busy ? 'Actualizando…' : 'Actualizar ahora') + '</button>' +
        '<button class="btn is-ghost" data-action="sync-save" aria-label="Guardar claves de API">Guardar claves</button>' +
        '</div></section>' +
        '<section class="card"><h2>Qué se actualiza</h2><ul class="reason">' +
        '<li><span><b>Resultados y clasificación</b> de las 5 grandes ligas desde football-data.org (5 peticiones).</span></li>' +
        '<li><span><b>Cuotas 1X2 y de 2,5 goles</b> de las casas desde The Odds API (5 peticiones).</span></li>' +
        '<li><span>La app intenta actualizar sola al abrir, como mucho una vez cada ' + REFRESH_WINDOW_H + ' horas, solo si hay claves guardadas.</span></li>' +
        '</ul></section>' +
        '</div></section></div>';
    }

    installFavicon();
    state = readHash();
    if (!location.hash) { writeHash(true); }
    render();
    setTimeout(function() {
      var btn = document.getElementById('themeToggle');
      if (btn) { btn.textContent = THEME === 'light' ? '🌙' : '☀️'; btn.setAttribute('aria-label', THEME === 'light' ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro'); }
    }, 0);
    autoRefreshOnBoot();
    scheduleRoundEnd();
    // While the app stays open, retry the automatic refresh every 20 minutes.
    setInterval(autoRefreshOnBoot, 20 * 60 * 1000);
  })();
  </script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
