<!doctype html>
<!--
  Open Design · OD Next handheld shell — Android (centered punch-hole camera, right-side volume and power keys).
  Presentation shell for a phone-app prototype: keep the handset markup and
  CSS, put the product inside the APP CONTENT slot (`.phone-content`). The
  shell sets no typography, palette, spacing, or navigation for the app.
  Derived from the Open Design mobile-app template (Apache-2.0).
-->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2fd98a" />
  <meta name="description" content="Predicciones y combinadas de fútbol con cuotas en tiempo real" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.json" />
  <title>Super Tipsters Oscar</title>
  <style>
    /* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
       Put this @layer first; product CSS outside the layer always wins. */
    @layer od-layout {
      :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

      /* containers */
      .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
      .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
      .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
      .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
      .od-fill    { flex: 1 1 0; min-width: 0; }
      .od-fixed   { flex: none; }
      .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

      /* stacked information: each piece is its own line — never sibling inline spans */
      .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
      :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
      .od-tile { display: grid; grid-template-rows: auto 1fr; }
      :where(.od-tile) > :where(*) { display: block; }

      /* media keeps its intrinsic ratio by default; never a distorted or cropped
         cover by accident. height:auto lets the ratio win over an <img height="…">
         attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
         AND add .od-media-cover together (per the core rule, only where a crop is
         deliberate — tile thumbs, decorative fills — never on full-frame content). */
      .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
      .od-media-cover { object-fit: cover; }

      /* data text only — authored copy is rewritten to its budget instead */
      .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
      .od-clamp-2 { -webkit-line-clamp: 2; }
      .od-clamp-3 { -webkit-line-clamp: 3; }
      .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
      .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
      .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

      /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
      .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
      .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

      /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
      .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
                 padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
      .od-rail::-webkit-scrollbar { display: none; }
      :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
      :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

      .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
      .od-touch  { min-width: 44px; min-height: 44px; }
    }
    /* /OD-LAYOUT-PRIMITIVES v1 */

    :root {
      --phone-screen-width: 412px;
      --phone-screen-height: 915px;
      --phone-bezel: 10px;
      --phone-outer-radius: 46px;
      --phone-screen-radius: 38px;
      --phone-safe-top: 52px;
      --phone-safe-bottom: 28px;
      --phone-system-fg: #17181a;
      --phone-screen-bg: #f6f7f9;
      --phone-stage-bg: #e8eaee;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 14%, rgba(255,255,255,.95), transparent 36%),
        var(--phone-stage-bg);
      color: #191a1d;
      font-family: Roboto, "Noto Sans", system-ui, sans-serif;
    }

    .phone-frame {
      position: relative;
      width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
      height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
      padding: var(--phone-bezel);
      border-radius: var(--phone-outer-radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.2), transparent 18%),
        linear-gradient(155deg, #414348 0%, #23252a 44%, #0c0d10 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.13),
        inset 0 0 0 2px rgba(0,0,0,.84),
        0 34px 72px -22px rgba(8,10,14,.56),
        0 11px 25px -10px rgba(8,10,14,.34);
      isolation: isolate;
    }

    .phone-frame::before,
    .phone-frame::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 92px;
      bottom: 92px;
      width: 2px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.14) 18%, transparent 32%, transparent 72%, rgba(255,255,255,.07) 88%, transparent);
    }
    .phone-frame::before { left: 0; }
    .phone-frame::after { right: 0; }

    .hardware-button {
      position: absolute;
      right: -3px;
      width: 4px;
      border-radius: 3px;
      background: linear-gradient(90deg, #08090b, #2d3036 62%, #08090b);
      box-shadow: inset 0 1px rgba(255,255,255,.1);
    }
    .hardware-button.volume { top: 205px; height: 92px; }
    .hardware-button.power { top: 322px; height: 70px; background: linear-gradient(90deg, #08090b, #3c424c 62%, #08090b); }

    .phone-screen {
      position: relative;
      width: var(--phone-screen-width);
      height: var(--phone-screen-height);
      overflow: hidden;
      border-radius: var(--phone-screen-radius);
      background: var(--phone-screen-bg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }

    .phone-content {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-top: var(--phone-safe-top);
      padding-bottom: var(--phone-safe-bottom);
      background: var(--phone-screen-bg);
    }
    .phone-content::-webkit-scrollbar { display: none; }

    .punch-hole {
      position: absolute;
      z-index: 20;
      top: 14px;
      left: 50%;
      width: 14px;
      height: 14px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #283343 0 10%, #090b0f 30%, #000 72%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.08), inset 0 0 3px #000;
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      z-index: 15;
      inset: 0 0 auto;
      height: var(--phone-safe-top);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr);
      align-items: start;
      padding: 14px 19px 0;
      color: var(--phone-system-fg);
      pointer-events: none;
    }
    .status-time {
      justify-self: start;
      display: flex;
      align-items: center;
      height: 16px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: .01em;
    }
    .status-cutout-zone { width: 64px; }
    .status-icons {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      height: 16px;
      gap: 5px;
    }
    .status-icons svg { display: block; flex: none; fill: currentColor; }
    .status-icons .wifi { width: 15px; height: 12px; }
    .status-icons .cellular { width: 14px; height: 12px; }
    .status-icons .battery { width: 9px; height: 14px; }

    .gesture-indicator {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 8px;
      width: 108px;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: var(--phone-system-fg);
      opacity: .86;
      pointer-events: none;
    }

    /* Presentation scaling: keep the whole handset visible on short viewports. */
    @media (max-height: 998px) { .phone-frame { zoom: 0.9; } }
    @media (max-height: 904px) { .phone-frame { zoom: 0.82; } }
    @media (max-height: 829px) { .phone-frame { zoom: 0.74; } }
    @media (max-height: 754px) { .phone-frame { zoom: 0.66; } }
    /* Narrow viewports: the handset chrome collapses and the screen fills the
       viewport, so the app behaves like a real phone page instead of
       scrolling sideways. */
    @media (max-width: 480px) {
      body { padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
      .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
      .phone-screen { width: 100%; height: 100%; border-radius: 0; }
    }

    /* Native Android wrapper. Only present in the packaged assets/www copy.
       The device already draws its own status and navigation bars, and the
       WebView is laid out inside those insets, so the simulated handset has to
       be flattened to full bleed and its fake chrome removed. This is NOT gated
       on a media query: a tablet or a large screen is wider than 480px and
       would otherwise fall back to the fixed-size bezel plus the `zoom` rules
       above. Specificity (0,2,1) beats both `.phone-frame` and the
       `@media (max-height: ...)` blocks, so no !important is needed. */
    body[data-native] { padding: 0; display: block; }
    body[data-native] .phone-frame {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: 0;
      border-radius: 0;
      background: none;
      box-shadow: none;
      zoom: 1;
    }
    body[data-native] .phone-frame::before,
    body[data-native] .phone-frame::after,
    body[data-native] .hardware-button,
    body[data-native] .status-bar,
    body[data-native] .punch-hole,
    body[data-native] .gesture-indicator { display: none; }
    body[data-native] .phone-screen {
      width: 100%;
      height: 100%;
      border-radius: 0;
      box-shadow: none;
    }
    body[data-native] .phone-content { padding-top: 0; padding-bottom: 0; }

    :root {
      --bg:         oklch(15.5% 0.012 262);
      --surface:    oklch(19% 0.014 262);
      --surface-2:  oklch(23% 0.016 262);
      --surface-3:  oklch(27.5% 0.018 262);
      --line:       oklch(30% 0.018 262);
      --line-soft:  oklch(24% 0.014 262);
      --fg:         oklch(97% 0.004 262);
      --fg-2:       oklch(87% 0.008 262);
      --muted:      oklch(73% 0.014 262);
      --accent:     oklch(79% 0.155 152);
      --accent-dim: oklch(79% 0.155 152 / 0.16);
      --accent-ink: oklch(16% 0.035 152);
      --amber:      oklch(83% 0.135 84);
      --amber-dim:  oklch(83% 0.135 84 / 0.16);
      --amber-ink:  oklch(20% 0.05 84);
      --red:        oklch(72% 0.17 22);
      --red-dim:    oklch(72% 0.17 22 / 0.16);
      --red-ink:    oklch(20% 0.05 22);
      --font-sans:  system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      --font-mono:  ui-monospace, "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
      --r-sm: 6px;
      --r-md: 10px;
      --r-lg: 14px;
      --dur: 170ms;
      --ease: cubic-bezier(.2, .7, .3, 1);
      --crest: 22px;
      --phone-screen-bg: var(--bg);
      --phone-system-fg: var(--fg);
    }

    /* Modo claro */
    :root.light {
      --bg:         oklch(98% 0.002 262);
      --surface:    oklch(95% 0.003 262);
      --surface-2:  oklch(91% 0.004 262);
      --surface-3:  oklch(87% 0.005 262);
      --line:       oklch(82% 0.006 262);
      --line-soft:  oklch(88% 0.004 262);
      --fg:         oklch(15% 0.012 262);
      --fg-2:       oklch(28% 0.010 262);
      --muted:      oklch(45% 0.008 262);
      --accent:     oklch(45% 0.145 152);
      --accent-dim: oklch(45% 0.145 152 / 0.12);
      --accent-ink: oklch(97% 0.004 152);
      --amber:      oklch(55% 0.155 84);
      --amber-dim:  oklch(55% 0.155 84 / 0.12);
      --amber-ink:  oklch(97% 0.004 84);
      --red:        oklch(55% 0.185 22);
      --red-dim:    oklch(55% 0.185 22 / 0.12);
      --red-ink:    oklch(97% 0.004 22);
    }

    .app { height: 100%; color: var(--fg); font-family: var(--font-sans); font-size: 16px; line-height: 1.5; }
    .app-shell { background: var(--bg); }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .kicker {
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .meta { display: block; font-size: 12px; line-height: 1.4; color: var(--muted); }
    .num  { font-variant-numeric: tabular-nums; }

    :where(button, a, [tabindex]):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: var(--r-sm);
      box-shadow: 0 0 0 4px oklch(79% 0.155 152 / 0.3);
    }

    .app-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--line-soft);
    }
    .app-bar .titles { display: grid; gap: 1px; flex: 1 1 0; min-width: 0; }
    .app-bar h1 { margin: 0; font-size: 19px; line-height: 1.2; letter-spacing: -0.02em; }
    .emblem { flex: none; width: 30px; }
    .emblem .od-media { width: 100%; height: auto; }
/* Cartel de marca: el color se calcula a partir de --mark-hue para poder
       desplazarlo de forma continua entre los tonos de la paleta. */
    @property --mark-hue {
      syntax: '<number>';
      inherits: true;
      initial-value: 152;
    }
    .bar-mark {
      --mark-hue: 152;
      --mark-fill: oklch(79% 0.155 var(--mark-hue));
      --mark-ink: oklch(16% 0.035 var(--mark-hue));
      flex: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px 4px 5px;
      border-radius: 999px;
      background: var(--mark-fill);
      color: var(--mark-ink);
      box-shadow:
        0 0 0 1px color-mix(in oklab, var(--mark-fill) 62%, var(--bg)),
        0 0 16px -4px color-mix(in oklab, var(--mark-fill) 70%, transparent),
        inset 0 1px 0 color-mix(in oklab, #fff 34%, transparent);
    }
    .bar-mark .brand-mark { --mark: 17px; }
    .bar-mark .bm-badge { fill: var(--mark-ink); }
    .bar-mark .bm-trend,
    .bar-mark .bm-ball { fill: none; stroke: var(--mark-fill); }
    .bar-mark .bm-pent { fill: var(--mark-fill); stroke: none; }
    .bar-mark .bm-text {
      display: block;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      white-space: nowrap;
    }
@keyframes mark-cycle {
      0%, 100% { --mark-hue: 152; }
      50%      { --mark-hue: 84; }
    }
    @keyframes mark-glow {
      0%, 100% { box-shadow: 0 0 0 1px color-mix(in oklab, var(--mark-fill) 62%, var(--bg)), 0 0 13px -4px color-mix(in oklab, var(--mark-fill) 58%, transparent), inset 0 1px 0 color-mix(in oklab, #fff 32%, transparent); }
      50%      { box-shadow: 0 0 0 1px color-mix(in oklab, var(--mark-fill) 88%, var(--bg)), 0 0 22px -2px color-mix(in oklab, var(--mark-fill) 88%, transparent), inset 0 1px 0 color-mix(in oklab, #fff 52%, transparent); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .bar-mark { animation: mark-glow 3.6s ease-in-out infinite, mark-cycle 7.5s ease-in-out infinite; }
    }

    .brand-mark { width: var(--mark, 30px); height: var(--mark, 30px); flex: none; }
    .brand-lock { display: flex; align-items: center; gap: 12px; }
    .brand-lock .bt { display: block; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    .brand-lock .bs { display: block; font-size: 12px; color: var(--muted); }

    .screen { padding: 0 16px 20px; }
    .screen > section + section { margin-top: 20px; }
    .block { display: grid; gap: 8px; }
    .rule { height: 1px; background: var(--line-soft); }

    .rail-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px 8px;
    }
    .rail-label .t { font-size: 15px; font-weight: 600; }

    .league-chip {
      display: grid;
      grid-template-columns: 20px auto;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--surface);
      color: var(--fg-2);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
    }
    .league-chip .tla { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; color: var(--muted); }
    .league-chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-dim); color: var(--fg); }
    .league-chip[aria-pressed="true"] .tla { color: var(--accent); }
    .league-chip .od-media { width: 100%; height: auto; }

    .md-chip {
      position: relative;
      min-width: 44px;
      min-height: 44px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--surface);
      color: var(--fg-2);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
    }
    .md-chip.is-done { color: var(--muted); border-color: var(--line-soft); }
    .md-chip.is-done::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 6px;
      width: 4px;
      height: 4px;
      margin-left: -2px;
      border-radius: 50%;
      background: var(--muted);
    }
    .md-chip.is-now { border-color: var(--accent); background: var(--accent-dim); color: var(--fg); }
    .md-chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--fg); }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--fg-2);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .02em;
      white-space: nowrap;
    }
    .pill.is-good { background: var(--accent-dim); color: var(--accent); }
    .pill.is-warn { background: var(--amber-dim); color: var(--amber); }
    .pill.is-bad  { background: var(--red-dim);   color: var(--red); }
    .pill.is-flat { background: var(--surface-2); color: var(--muted); }

    .match-list { display: grid; gap: 8px; }
    .match {
      display: grid;
      gap: 10px;
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line-soft);
      border-radius: var(--r-lg);
      background: var(--surface);
      color: var(--fg);
      text-align: left;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    .match-top { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: start; }
    .kick-time { display: block; font-size: 15px; font-weight: 600; color: var(--fg); }
    .sides { display: grid; gap: 6px; }
    .side { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: center; }
    .side .name { font-size: 15px; line-height: 1.35; color: var(--fg); }
    .side.is-away .name { color: var(--fg-2); }
    .verdict { display: grid; gap: 3px; justify-items: end; text-align: right; }
    .verdict .big { display: block; font-size: 16px; font-weight: 700; }
    .score { display: block; font-size: 17px; font-weight: 700; letter-spacing: 0; }

    .probbar { display: flex; height: 5px; gap: 2px; }
    .probbar .seg { display: block; height: 5px; border-radius: 2px; }

    /* Product/odds grid in match cards */
    .odds-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line-soft);
    }
    @media (min-width: 480px) {

    .sync-input { margin: 4px 0 10px; font-size: 13px; }
    .pick-row .stake-row { margin-top: 8px; }
    .leg {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      width: 100%;
      min-height: 44px;
      padding: 7px 10px;
      border: 1px solid var(--line-soft);
      border-radius: var(--r-md);
      background: var(--surface-2);
      color: var(--fg);
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }
    .leg .idx {
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--surface);
      color: var(--muted);
      font-size: 11px;
    }
    .leg .v { font-size: 13.5px; color: var(--fg); }

    .stad-head { display: flex; align-items: center; gap: 11px; }
    .stadium { display: block; width: 100%; height: auto; }
    .st-stand { fill: var(--surface-2); stroke: var(--line-soft); stroke-width: 1; }
    .st-turf { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .st-mark { fill: none; stroke: var(--fg-2); stroke-opacity: .34; stroke-width: 1.2; }
    .st-mark .st-dot { fill: var(--accent); stroke: none; }
    .st-goal { fill: var(--line); }
    .st-home { fill: var(--accent); opacity: .85; }
    .st-label {
      fill: var(--muted);
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: .14em;
    }

    .vs-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 74px 74px;
      gap: 8px;
      align-items: center;
      padding: 8px 0;
      border-top: 1px solid var(--line-soft);
      font-size: 13.5px;
    }
    .vs-row .lbl { color: var(--muted); }
    .vs-row .num { text-align: right; }
    .vs-head {
      padding-bottom: 6px;
      border-top: 0;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .02em;
      color: var(--fg-2);
    }
    .od-muted { color: var(--muted); }

    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    }

    /* Cartera, historial, aciertos y evolución del saldo */
    .is-good { color: var(--accent); }
    .is-bad { color: var(--red); }
    .spark { width: 100%; height: 64px; margin: 12px 0 2px; display: block; }
    .spark-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .spark-line.is-down { stroke: var(--red); }
    .spark-zero { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
    .hit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-top: 12px; }
    .hit-col h3 { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
    .hist-list { display: grid; gap: 8px; margin-top: 12px; }
    .hist-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 14px 12px;
      border: 1px solid var(--line-soft);
      border-radius: var(--r-md);
      background: var(--surface);
      transition: border-color var(--dur) var(--ease);
    }
    .hist-row:hover { border-color: var(--accent); }
    .hist-row .body { min-width: 0; flex: 1; display: grid; gap: 3px; }
    .hist-row .ttl { font-size: .86rem; line-height: 1.3; }
  </style>
</head>

      "history": "El TSG 1899 Hoffenheim (Turn-und Sportgemeinschaft 1899 Hoffenheim e.V. en alemán), conocido simplemente como Hoffenheim es un club de fútbol de la ciudad de Sinsheim, en el estado de Baden-Wurtemberg, Alemania. Fundado el 1 de julio de 1899, actualmente participa en la primera categoría del fútbol alemán, la 1. Bundesliga. En 2005 se separó el departamento de fútbol bajo la identidad corporativa del TSG 1899 Hoffenheim Fußball-Spielbetriebs GmbH, con sede en Zuzenhausen.\n\nHistoria\nEl primer Hoffenheim fue fundado en 1899, pero el actual data de 1945, cuando el club de gimnasia Turnverein Hoffenheim, fundado el 1 de julio de 1899 y el club de fútbol \"Fußballverein Hoffenheim\" (fundado en 1921) se fusionaron. En los años 1990, el club seguía siendo un humilde equipo amateur que jugaba en la séptima división de la Baden-Württemberg A-Liga. Sin embargo, paulatinamente mejoraron su rendimiento y en 1996 alcanzaron la Verbandsliga Nordbaden (5ª división).\nAlrededor de 1999, el exjugador Dietmar Hopp volvió al club de su juventud, pero no como jugador, sino como propietario del equipo. Hopp era el cofundador de la firma de software SAP e invirtió parte de su fortuna en el club. Sus contribuciones dieron resultado casi de inmediato, en 2000 el Hoffenheim terminó primero en la Verbandsliga y ascendió a la cuarta división (Oberliga Baden-Württemberg). Luego, otro primer lugar aupó al club hasta la Regionalliga Süd (III división) para la temporada 2001-02, el equipo finalizó en 13 posición dando lugar en su primera temporada en la Regionalliga, pero mejoraron su rendimiento considerablemente al año siguiente, logrando un quinto puesto.\nEl club participó por primera vez en la DFB Pokal en la temporada 2003-04 en la que protagonizó un gran papel, avanzando a los cuartos de final eliminando a algunos clubes de la 2. Bundesliga como Eintracht Trier y al Bayer 04 Leverkusen de la 1. Bundesliga antes de ser eliminado por otro club de la 2. Bundesliga, el VfB Lübeck.\nEn el 2005 hubo negociaciones para fusionar al 1899 Hoffenheim con el FC Astoria Walldorf y el SV Sandhausen para crear el FC Heidelberg 06, sin embargo, el proyecto se desechó debido a la resistencia de estos últimos y el desacuerdo sobre si la localización del estadio del nuevo club en Heidelberg o Eppelheim. Hopp se posicionó claramente a favor de establecer la sede en Heidelberg, pero no pudo vencer la resistencia de la firma local Wild Werke.…",

      "history": "El Bayer 04 Leverkusen (en alemán: Bayer 04 Leverkusen Fußball GmbH​), también conocido como Bayer Leverkusen, o simplemente Leverkusen, es un club de fútbol con sede en Leverkusen, Renania del Norte-Westfalia, Alemania. El club compite en la Bundesliga, la máxima categoría del fútbol alemán. Disputa sus encuentros como local en el estadio BayArena, que dispone de una capacidad para 30 210 espectadores. \nEl club fue fundado en 1904 por empleados de la empresa farmacéutica alemana Bayer AG, cuya sede se encuentra en Leverkusen y de la que el club toma su nombre. Antiguamente era el departamento más conocido del TSV Bayer 04 Leverkusen, un club deportivo cuyos miembros también participan en atletismo, gimnasia, baloncesto, balonmano sobre hierba y otros deportes, como el RTHC Bayer Leverkusen (remo, tenis y hockey). En 1999, el departamento de fútbol se separó del club deportivo y ahora es una entidad independiente llamada formalmente Bayer 04 Leverkusen Fußball GmbH.​ El Bayer ascendió por primera vez a la Bundesliga en 1979, y desde entonces ha permanecido en la máxima división. Los colores principales del club son el rojo y el negro, ambos utilizados como color principal de la camiseta y con franjas rojas y negras también como colores de casa.\nEl Bayer Leverkusen había sido cinco veces subcampeón de la Bundesliga sin ganar la competición, todo un récord en el fútbol alemán hasta la temporada 2024, donde resultaron campeones por primera vez en su historia sin perder ningún partido bajo la dirección de Xabi Alonso, sumando un nuevo récord en el fútbol alemán y en el fútbol europeo, tras 51 partidos oficiales sin perder. El club también tiene en su palmarés una 2. Bundesliga en 1979 (Grupo Norte), una Copa de la UEFA en 1988, y dos DFB-Pokal en 1993 y 2024, temporada donde consiguieron el \"doblete\".​ Ha disputado doce ediciones de la Liga de Campeones de la UEFA, resultando subcampeón en 2002, cayendo 2-1 ante el Real Madrid en la final. Además,       "history": "El Borussia Dortmund, (oficialmente en alemán Ballspielverein Borussia 09 e.V. Dortmund,​​​​ o Borussia Dortmund pronunciado /boˈʁʊsi̯a ˈdɔʁtmʊnt/ ()​​ bajo la identidad corporativa Borussia Dortmund GmbH & Co. KGaA)​​ abreviado como BVB es una entidad deportiva situada en Dortmund, en la región Rin-Ruhr del estado federado de Renania del Norte-Westfalia, Alemania. Fue fundada el 19 de diciembre de 1909 como un club de fútbol, actividad por la que es principalmente conocido y en la que llegó a situarse como el segundo equipo más laureado del país. Disputa la máxima categoría alemana, la Bundesliga, donde se ubica igualmente en la segunda posición histórica con ocho títulos, o cuarto atendiendo al cómputo global de los distintos campeonatos históricos.\nCompleta el palmarés con cinco Copas de Alemania y seis Supercopas a nivel nacional; y a nivel internacional ha sido campeón de la Recopa de Europa en 1966, siendo el primer club alemán en ganar un título internacional, la Liga de Campeones de la UEFA en 1997 (y subcampeón en 2013 y 2024), y la Copa Intercontinental en 1997. También resultó subcampeón de la Copa de la UEFA en 1993 y 2002, y de la Supercopa de Europa 1997. Es, además, uno de los quince equipos de Europa que ha disputado una final en las tres principales competiciones UEFA, y único club germano junto al FC Bayern de Múnich en consagrarse campeón del mundo por la FIFA.\nBajo su lema «Echte Liebe» (Amor Verdadero),​ «die borussen»​​ son conocidos por su ferviente afición. Su estadio, el Signal Iduna Park (históricamente Westfalenstadion), cuenta con una capacidad de 81.365 espectadores (el de mayor aforo en Alemania),​ y está catalogado como estadio de máxima categoría por la UEFA,​ además de tener el promedio de asistencia más alto de todos los clubes de fútbol del mundo. Entre ellos se encuentra «the Yellow Wall» (el muro amarillo), en referencia al color del equipo y la apariencia que da la aglomeración de los aficionados en su pronunciada grada sur.​​ A fecha de 2022 cuenta con más de 157 000 socios,​ únicamente superado en Alemania por el Fußball-Club Gelsenkirchen-Schalke y el FC Bayern de Múnich, sus principales rivales y con los cuales disputa «el derbi del Ruhr» y «Der Klassiker».​​ Si bien por historia su enjundia es con el conjunto minero —una de las mayores rivalidades del fútbol alemán— con los bávaros llegó a disputar una final de la Liga de Campeones, candente en los años recientes por la supremacía del país.…",

      "history": "El Bayern de Múnich,​​​ (en alemán: Fußball-Club Bayern München e.V.​) (pronunciado /ˈfuːsbalˌklʊp ˈbaɪɐn ˈmʏnçn̩/ ()) también conocido como FC Bayern (pronunciado /ˌɛft͡seː ˈbaɪɐn/ ()) o simplemente Bayern, es una entidad deportiva profesional de la ciudad de Múnich (Alemania). Fue fundado el 27 de febrero de 1900 por once jugadores capitaneados por Franz John.​ Es uno de los clubes de mayor prestigio en el mundo,​ conocido además por su sección de fútbol profesional, que participa en la 1. Bundesliga. Disputa sus partidos como local desde 2005 en el Allianz Arena, denominado popularmente en alemán «Schlauchboot»​ —trad. «bote inflable», por su forma—, que cuenta con una capacidad de 75 024 espectadores,​ el duodécimo de mayor tamaño en Europa.​​\nAbocado desde sus inicios al desarrollo del balompié, adquirió muy pronto un carácter multideportivo y desarrolló varias otras disciplinas —las cuales algunas fueron desapareciendo con el devenir de los años—. La gestión del equipo es responsabilidad de una sociedad filial del club llamada FC Bayern München AG, el cual gestiona el patrimonio económico y las actividades en el Allianz Arena. El 75 % del capital de esta sociedad anónima es del club, el otro 24.99 % se divide entre las empresas Adidas AG, Audi AG y Allianz SE.​\nEs el club más laureado en la historia de la Bundesliga,​ con 35 títulos ligueros incluyendo el campeonato alemán de 1932 —cuando el torneo todavía no se encontraba bajo su actual formato unificado—. También lo es de la Copa y de la Supercopa de Alemania —posee 21 y 12 trofeos respectivamente—.​\nA nivel internacional, el Bayern fue tercero —con un voto menos que el Manchester United— en la elección del Club del Siglo de la FIFA,​​ mientras que en el estudio realizado por la IFFHS para determinar al mejor club del siglo xx, ocupó la novena y quinta posición en el mundo y Europa respectivamente.​ Igualmente, es uno de los cinco equipos que ha ganado el derecho a conservar en propiedad la Copa de Europa, y utiliza el distintivo de múltiple campeón del torneo —tras ganar de forma consecutiva en 1974, 1975 y 1976—.…",
      "historySource": "https://es.wikipedia.org/wiki/Bayern_de_M%C3%BAnich",
      "honours": "El Bayern es la entidad más exitosa del fútbol alemán por haber ganado el mayor número de campeonatos de liga y copa nacional. También es el club de fútbol alemán que ha conquistado más campeonatos internacionales: catorce trofeos.​\nEn la Recopa de Europa, el Bayern ganó su única final disputada en 1967. También ganó la Copa de la UEFA en 1996.…",

      "history": "FC Schalke 04 (en alemán: Fußball-Club Gelsenkirchen-Schalke 04 e. V.), conocido como Schalke 04, es un club de fútbol de Gelsenkirchen, en la región urbana Rin-Ruhr, Alemania. Fue fundado el 4 de mayo de 1904 y desde la temporada 2026/27 juega en la 1. Bundesliga, la máxima categoría del fútbol alemán, luego de 3 años de ausencia. El club también ofrece otras actividades como baloncesto, balonmano, atletismo e incluso deportes electrónicos.\nEn su palmarés destacan siete antiguos campeonatos, siete subcampeonatos de Bundesliga, y cinco Copas de Alemania, entre otros trofeos. También ganó su mayor trofeo europeo en 1997 derrotando a Inter por penales para obtener la Copa UEFA, actualmente denominada Liga Europa.​\nEl club cuenta actualmente con 210 000 socios,​ lo que lo convierte en el tercer club con más socios en Alemania. Ha sido uno de los equipos de fútbol profesional más populares de Alemania, aunque el apogeo del club se produjo en las décadas de 1930 y 1940. Además, mantiene una rivalidad con Borussia Dortmund, con quien disputa el «Derbi del Ruhr». Juega de local en la Veltins-Arena que cuenta con una capacidad de 62 271 espectadores.\n\nHistoria\n\nFundación y primeros años\nEl Schalke 04 fue fundado en 1904, bajo el nombre de Turnverein 1877, en compañía de algunos estudiantes que destacaban como deportistas profesionales. Sus primeros colores fueron el rojo y amarillo. Al equipo no le era permitido unirse a la liga oficial hasta 1912.\nLuego de varios cambios en el nombre oficial del club y diversos inconvenientes que ocurrieron sobre todo con el estallido de la Primera Guerra Mundial, el club adopta en 1924 el nombre que hasta la actualidad conserva: FC Schalke 04, y con la adopción definitiva de la camiseta de color azul real o azul cobalto, adoptaron el apodo que mantienen hasta ahora «Die Königsblauen» (en español: Los Azules Reales). Por estos años en el equipo jugaban, en su mayoría, jugadores que se desempeñaban como trabajadores en las minerías de carbón de Gelsenkirchen, y de ahí su otro apodo: «Die Knappen» (en español: Los mineros).\n\nSchalker Kreisel\nEn el año 1925 el club contrata por primera vez a un técnico profesional y con él el equipo empezó a dominar en las ligas regionales en las que participaba. Así empezó a participar en los campeonatos nacionales y también a cimentar las bases del equipo que dominaría Alemania en las siguientes décadas.\nDurante este periodo el equipo utilizó un innovador sistema de juego que se haría famoso con el nombre de «Schalker Kreisel», precursor de los actuales rondos.…",

      "history": "El Hamburger Sport-Verein e. V.​ (en español, Club Deportivo Hamburgués), comúnmente conocido como Hamburgo o por sus siglas HSV, es un club de fútbol con sede en Hamburgo, Alemania. Desde la temporada 2025-26 juega en la 1. Bundesliga, tras 7 años de ausencia.\nEl actual HSV fue fundado el 2 de junio de 1919 luego de una fusión de tres clubes, traza oficialmente su origen al 29 de septiembre de 1887 cuando se fundó el primero de sus predecesores, el SC Germania convirtiéndolo en uno de los más antiguos del país. El HSV posee la singular distinción de haber jugado continuamente en la primera división del sistema de ligas alemán desde el final de la Primera Guerra Mundial. El Hamburgo jugó en la Bundesliga desde la fundación de la misma, en 1963, hasta su histórico descenso en 2018, siendo el club fundador de la liga alemana que más temporadas disputó en la máxima categoría sin descender, superado en 2021 por el Bayern Múnich.​\nEl equipo es uno de los clubes más populares del fútbol alemán, ha ganado el campeonato nacional / Bundesliga seis veces, la DFB-Pokal tres veces y la DFL-Ligapokal dos veces. Además, ganaron dos títulos internacionales: La Recopa de Europa 1976-77 y la Copa de Europa 1982-83 sumando un total de trece títulos. El jugador más destacado que pasó por el equipo y jugó en la selección alemana fue Felix Magath.\nLa equipación local del club es camiseta blanca, pantalón corto rojo y medias azul y negro. El apodo más común del equipo es \"die Rothosen\" (los Pantalones Rojos). Como es uno de los clubes más antiguos de Alemania, también se conoce como el \"der Dinosaurier\" (el Dinosaurio). Su principal rivalidad histórica es con otro histórico equipo alemán, S. V. Werder Bremen, con el que disputan el «Nordderby» o derbi del Norte, y con el F.C. San Pauli, con sede en Hamburgo, con el cual disputan el \"Hamburg Stadtderby\" o derbi de Hamburgo. También es muy famosa su rivalidad con el Bayern Múnich, el equipo más exitoso del país.\n\nHistoria\n\nInicios hasta la Segunda Guerra Mundial\nEl Hamburg Sport-Verein (HSV) remonta su origen a la fusión del Der Hohenfelder Sportclub y el Wandsbek-Marienthaler Sportclub el 29 de septiembre de 1887 para formar el SC Germania Hamburg, al que normalmente se hace referencia como SC Germania. Este fue el primero de tres clubes que se fusionaron el 2 de junio de 1919 para crear el HSV en su forma actual.…",

      "history": "VfB Stuttgart​ (Verein für Bewegungsspiele Stuttgart 1893 e. V.,​ en alemán y oficialmente, o VfB Stuttgart de manera abreviada, pronunciado /faʊ̯ ʔɛf beː ˈʃtʊtɡaʁt/ o por sus siglas VfB) es una entidad deportiva profesional de la ciudad de Stuttgart, Alemania. Fue fundado el 9 de septiembre de 1893 siendo uno de los clubes más antiguos, históricos y con mayor tradición en el país, es conocido por su sección de fútbol profesional. Actualmente participa en la 1. Bundesliga, la máxima categoría del fútbol nacional, la cual ubica a Stuttgart como el cuarto equipo en la tabla histórica.\nOcupa la quinta posición en la tabla histórica de la Bundesliga, disputa sus partidos como local desde 1933 en el MHPArena que cuenta con una capacidad de 60.449 espectadores y también cuenta con 130.000 socios.​\nHa ganado 5 campeonatos de primera división, 3 Bundesligas y 2 Campeonatos alemanes, 4 Copas de Alemania, 1 Supercopa alemana y 2 torneos de 2. Bundesliga su estadio donde juega como local es el MHPArena, un estadio situado en el distrito de Bad Cannstatt que cuenta con una capacidad de 60.449 espectadores y su última remodelación fue en el año 2011, su mayor rivalidad en la actualidad sigue siendo con el Bayern de Múnich, el cual ambos juegan uno de los clásicos más importantes del país llamado Südderby, en español, (Derbi del Sur).\n\nHistoria\n\nPrimeros años hasta la Segunda Guerra Mundial\n\nEl Verein für Bewegungsspiele Stuttgart se formó a través de una fusión el 2 de abril de 1912 de las partes predecesoras Stuttgarter FV y Kronen-Club Cannstatt tras una reunión en el hotel Concordia en Cannstatt. Cada uno de estos clubes estaba formado por alumnos de escuela con raíces de clase media que aprendieron nuevos deportes como el fútbol de la mano de expatriados ingleses como William Cail.​\n\nDécadas de 1930 y 1940\nEn 1933, el Stuttgart se trasladó al estadio Neckar, el sitio de su terreno actual. El fútbol alemán se reorganizó ese mismo año bajo el Tercer Reich en dieciséis divisiones de primer nivel llamadas Gauligas. Stuttgart jugó en la Gauliga Württemberg y disfrutó de un éxito considerable allí, ganando títulos de división en 1935, 1937, 1938, 1940 y 1943 antes de que el sistema Gauliga colapsara a mitad de la temporada 1944-45 debido a la Segunda Guerra Mundial, el club tuvo una rivalidad con S. Kickers durante este período.…",

      "history": "El Werder Bremen​ (en alemán: Sportverein Werder Bremen von 1899 e. V.,​ pronunciado /ˈvɛʁdɐ ˈbʁeːmən/ (), Bremen de manera abreviada) es una entidad deportiva profesional de la ciudad de Bremen, Alemania. Fue fundado el 4 de febrero de 1899, y es uno de los clubes alemanes más laureados e históricos en el país, conocido por su sección de fútbol profesional. Cuenta con 40.376 socios.​ Disputa sus partidos como local en el Weserstadion, viste camiseta verde con pantalón blanco y medias verdes. Participa en la 1. Bundesliga, la primera división alemana.\nEl Werder Bremen ha ganado la Bundesliga en cuatro ocasiones (1964-65, 1987-88, 1992-93 y 2003-04), la Copa de Alemania en seis ediciones (1960-61, 1990-91, 1993-94, 1998-99, 2003-04 y 2008-09) siendo el club que más veces la ha conseguido por detrás del club Bayern Múnich, la extinta Copa de la Liga de Alemania en una ocasión, y la Supercopa de Alemania en cuatro ocasiones. El último título obtenido fue la Supercopa de Alemania en 2009, título que disputaron por haber ganado previamente la Copa de Alemania el mismo año.​ No obstante, su mayor éxito notorio nacional tuvo lugar en 2004, cuando lograron hacer un histórico doblete al proclamarse campeones tanto de Liga como de Copa.\nEn Europa, ganaron la Recopa de Europa en 1992 y la Copa Intertoto en la edición 1997-98. Disputaron la final de la Liga Europa de la UEFA 2008-09, que perdieron en la prórroga ante el Shaktar Donetsk.​\nEl rival tradicional de Werder Bremen es Hamburgo, con quien disputa el Derbi del Norte de Alemania. También mantiene un enfrentamiento con Bayern de Múnich, el equipo más exitoso del país.\nSu máximo goleador histórico es el futbolista peruano Claudio Pizarro con 153 goles.\n\nHistoria\n\nPrimeros años hasta la Segunda Guerra Mundial\n\nEl S.V. Werder Bremen, conocido anteriormente como FV Werder, el 4 de febrero de 1899, escolares de 16 años de círculos comerciales fundaron el club de fútbol Werder von 1899, un club de fútbol puro, precursor del actual SV Werder Bremen. Habían ganado un balón de fútbol en una competición de juego de la soga y jugaron con él por primera vez en Stadtwerder, lo que sentó las bases para el FV Werder Bremen y su nombre.​ Ya en diciembre de 1899, el FV Werder se unió a la Asociación de Fútbol de Bremen. En los primeros años, solo los hombres pudieron convertirse en miembros que tuvieran una educación superior o que pudieran obtener una mayoría de dos tercios en la junta,​ disputó su primer partido oficial el 10 de septiembre de 1899 ante el ahora extinto ASC Bremen, llevándose la victoria por 1-0.…",

      "history": "El 1. FSV Mainz 05 (1. Fußball- und Sportverein Mainz 05 e.V.) es un club deportivo alemán con sede en la ciudad de Maguncia.​ Fue fundado en 1905 y actualmente compite en la 1. Bundesliga, la máxima categoría del fútbol alemán.​\nEl club cuenta con aproximadamente 30.000 socios, lo que lo posiciona entre las entidades deportivas con mayor número de afiliados en Alemania.​\nEntre sus mayores logros futbolísticos destacan su participación en la primera división alemana entre 2004 y 2007, y de forma continua desde 2009. En la temporada 2008/09 alcanzó las semifinales de la Copa de Alemania, y en la campaña 2015/16 finalizó en la sexta posición de la Bundesliga, lo que le permitió clasificarse directamente a la fase de grupos de la UEFA Europa League.​​\nLas oficinas comerciales del club están ubicadas en la calle Isaac-Fulda-Allee, en el distrito de Mainz-Gonsenheim.​ Para garantizar su competitividad económica y deportiva, la empresa municipal GVG construyó un estadio con capacidad para 33.305 espectadores en el distrito de Mainz-Bretzenheim. Este recinto, conocido actualmente como Mewa Arena, fue inaugurado el 3 de julio de 2011 y ha sido la sede de los partidos como local del primer equipo desde la temporada 2011/12.​​ El club alquila el estadio desde el 5 de mayo de 2009.\n\nHistoria\nUn intento fallido de fundar un club de fútbol en la ciudad en 1903 fue seguido dos años más tarde por la exitosa creación del 1. Mainzer Fussballclub Hassia 1905. Tras varios años de juego en la Süddeutschen Fußballverband (Liga de Fútbol del Sur de Alemania), el club se fusionó con el FC Hermannia 07 -el antiguo equipo de fútbol de Mainzer TV 1817- para formar el 1. Mainzer Fussballverein Hassia 05, que dejó de llamarse \"Hassia\" en agosto de 1912. Tras la Primera Guerra Mundial, en 1919, se produjo otra fusión con el Sportverein 1908 de Maguncia, que dio lugar a la formación del 1. Mainzer Fußball- und Sportverein 05. Die Nullfünfer (\"05\") fue un club sólido que ganó varios campeonatos de la liga regional en el periodo de entreguerras y se clasificó para la ronda inicial de los campeonatos nacionales en 1921, tras ganar la Kreisliga Hessen.\nA finales de la década de 1920 y principios de la de 1930, el club obtuvo buenos resultados en la Bezirksliga Main-Hessen - Gruppe Hessen, incluyendo el primer puesto en 1932 y 1933. Esto le valió al equipo una plaza en la Gauliga Südwest, una de las 16 nuevas ligas de primera división que se formaron en la reorganización del fútbol alemán bajo el Tercer Reich.…",

      "history": "El F. C. Augsburgo​ (oficialmente y en alemán: Fußball-Club Augsburg 1907 e. V.​) es un club de fútbol profesional alemán de la ciudad de Augsburgo, en Baviera. Fue fundado el día 8 de agosto de 1907 y compite en la 1. Bundesliga, la máxima categoría del fútbol nacional. Disputa sus partidos como local en el estadio WWK Arena, inaugurado en 2009.\n\nUniforme\nUniforme titular: Camiseta blanca con mangas verdes, pantalón blanco y medias blancas.\nUniforme alternativo: Camiseta roja, pantalón rojo y medias rojas.\nTercer uniforme: Camiseta negra con mangas rojas, pantalón negro y medias negras.\n\nEvolución del uniforme\nEn la temporada 2025/26, el FC Augsburg presentó por primera vez en su historia una equipación local diseñada por un aficionado del club.\nEl diseño es obra del español Antonio Herrero (39 años), nacido en Madrid y residente en Sevilla, su proyecto pasó a convertirse en la camiseta oficial local del club para la temporada 2025/26. La prenda, fabricada por Mizuno, presenta una base blanca con una franja diagonal roja y verde en el frontal, el motivo de la piña (elemento del escudo) en relieve, el año de fundación «1907» en la nuca y, por primera vez, la inscripción «FC Augsburg» en la espalda con la tipografía propia del club..\nEl nuevo uniforme se estrenó sobre el terreno de juego en el último partido de la temporada en casa, disputado en el WWK Arena, donde Antonio Herrero hizo la presentación antes del inicio del partido junto a Michael Ströll (director general),la camiseta estuvo disponible para la venta en la tienda oficial del club y en los puntos de venta del estadio.​\n\nTitular\n\nEstadio\nEn 2009 inauguró su nuevo estadio, el Impuls Arena, con una capacidad de 30 000 espectadores.\n\nOrganigrama deportivo\n\nPlantilla 2026-27\n\nEntrenadores\n\nPalmarés\n\nReferencias\n\nEnlaces externos\n Wikimedia Commons alberga una categoría multimedia sobre F. C. Augsburgo.\nSitio web oficial\nAugsburg en UEFA",

      "history": "El Sport-Club Friburgo,​​ (Sport-Club Freiburg e.V. en alemán) o conocido simplemente como Friburgo, es un club de fútbol de la ciudad de Friburgo, en Baden-Wurtemberg, Alemania. Actualmente disputa en la 1. Bundesliga, la máxima categoría del fútbol alemán. Fue fundado el 30 de mayo de 1904, tras la fusión del Freiburger Fußballverein 04 y el FC Schwalbe Freiburg.\n\nHistoria\nEl club remonta sus orígenes a un par de clubes fundados en 1904: Freiburger Fußballverein 04 fue fundado en marzo de ese año; FC Schwalbe Freiburg lo fue apenas dos meses más tarde. Ambos clubs experimentaron varios cambios de nombre: FC Schwalbe se convirtió en FC Mars en 1905, luego en Unión Freiburg en 1906. El Freiburger Fußballverein 04 se convirtió en Freiburg Sportverein en 1909. Tres años más tarde, ambos equipos formaron el Sportclub Freiburg.​\nEn 1918, después de la devastación de la Primera Guerra Mundial, el SC Friburgo concretó un arreglo temporal con Freiburger FC para poder poner en campo un equipo completo. El nuevo equipo se llamó el KSG Friburgo.​ El año siguiente, SC Friburgo se asoció al FT 1844 Friburgo como el departamento de fútbol de ese club. Este acuerdo terminó en el año 1928 cuando realizaron un arreglo para compartir estadio con el PSV (Polizeisportvereins) Friburgo 1924 que duró hasta 1930, cuando el PSV desapareció. El SC Friburgo acordó otra vez con el FT 1844 Friburgo en 1938.\nAl final de la Segunda Guerra Mundial, las fuerzas aliadas​ de ocupación disolvieron la mayoría de las organizaciones existentes en Alemania, incluyendo los clubes de fútbol y de deportes en general. Se permitió que pudieran reorganizarse pasado un año, pero se requirió a los clubes que cambiaran de nombre para que no pudieran ser asociados con el reciente pasado Nazi. El SC Friburgo, por lo tanto, tomó el nombre VfL Friburgo. En 1950, las autoridades francesas de ocupación comenzaron a permitir a los viejos clubs recuperar su identidad y finalmente, en 1952, el club volvió a llamarse SC Friburgo.\nEn este punto, la historia del club había sido caracterizada por modestos éxitos. En los años 30, el SC Friburgo jugó en la Berzirkliga (II) y consiguió unos pocos títulos locales.​ \nSiendo un club pequeño, SC Friburgo es conocido por el espíritu de lucha y juego en equipo. Esto los condujo a la 2.ª Bundesliga en 1978–79, donde jugaron una década y media antes de ascender en 1993 a la 1. Bundesliga, la primera división del fútbol alemán.…",

    "18": {

      "history": "El Borussia Mönchengladbach​ (en alemán: Borussia Verein für Leibesübungen 1900 e.V. Mönchengladbach​), conocido habitualmente bajo sus abreviaturas de Mönchengladbach o Gladbach,​ es un club de fútbol situado en la ciudad de Mönchengladbach, Renania del Norte-Westfalia, Alemania. Milita en la Bundesliga, la primera división alemana.\nEl Borussia Mönchengladbach se fundó en 1900, con un nombre derivado de una forma latinizada de «Prusia»: «Borussia», que era un nombre popular para los clubes alemanes del antiguo Reino de Prusia.​ El equipo se incorporó a la Bundesliga en 1965 y conoció la mayor parte de su éxito en la década de 1970, cuando, bajo la dirección de Hennes Weisweiler y luego de Udo Lattek, se formó una plantilla joven con un estilo de juego rápido y agresivo la cual dio pie al apodo del club: «Die Fohlen» (Los potros).​ Durante este periodo, el Mönchengladbach ganó cinco veces la Bundesliga, dos veces la Copa de la UEFA y alcanzó una final de la Copa de Europa en 1977.\nDesde 2004, el Borussia Mönchengladbach juega en el Borussia-Park, después de haber jugado en el Bökelbergstadion desde 1919. Por número de socios, es el sexto club más grande de Alemania, con más de 94 000.​ Además, el club ocupa el quinto lugar en la tabla histórica de la Bundesliga.​ El principal rival del Mönchengladbach es el F. C. Colonia, contra el que disputa el «Derbi de Renania». Sus rivales secundarios son el Borussia Dortmund, el Bayer Leverkusen y el Fortuna Düsseldorf.\n\nHistoria\n\nFundación y primeros años\nEl predecesor del club Borussia Mönchengladbach fue un grupo de jóvenes jugadores que, tras abandonar el club deportivo TC Germania Gladbach el 17 de noviembre de 1899, fundaron una asociación de juego llamada «F. C. Borussia» en el distrito de Eicken,​​ Mönchengladbach. Borussia es el nombre latino de Prusia, estado al que perteneció Mönchengladbach hasta la unificación alemana.​\n\nEl Borussia fue el segundo club de fútbol consagrado de la ciudad de Mönchengladbach. El F. C. Mönchengladbach, fundado seis años antes, en 1894, se convirtió rápidamente en el primer rival del Borussia Mönchengladbach. Mientras que el F. C. Mönchengladbach estaba decentemente establecido, al joven Borussia le resultaba difícil garantizar un acceso regular a los campos de entrenamiento y al equipamiento. Como consecuencia, el equipo se afilió a la Marianische Jünglings-Kongregation Mönchengladbach Eicken, una asociación deportiva católica bastante conservadora.…",

      "history": "El Eintracht Fráncfort​​ (Eintracht Frankfurt e.V.,​ pronunciado /ˈaɪntʁaxt ˈfʁaŋkfʊʁt/, en alemán y oficialmente)​ es una entidad deportiva de Fráncfort del Meno, Alemania. Fundado en 1899, es conocido por su sección de fútbol profesional, que participa en la 1. Bundesliga, la máxima categoría del fútbol nacional.\nEl equipo disputa sus partidos como local en el Waldstadion y, a fecha de 2025, cuenta con más de ciento cincuenta y cinco mil socios.​\nEl club fue fundado el 8 de marzo de 1899, los colores del club son el rojo y el negro, que se refleja en su uniforme, y en menor medida el blanco, mientras que el escudo del club es el águila de Fráncfort (en rojo y blanco), su departamento de fútbol es considerado uno de los grandes clubes tradicionales del fútbol alemán. Pese a ser un club tan longevo solo ha logrado un campeonato de liga y cinco copas alemanas. En el panorama internacional, el Eintracht alcanzó la final de la Copa de Europa en 1960, pero perdió ante el Real Madrid Club de Fútbol. Siete años después, ganaría la Copa Intertoto de la UEFA en 1967. Dos décadas después de la caída frente al Real Madrid, el club ganó la Copa de la UEFA en 1980, sumando así su segundo título internacional. Luego de cuarenta y dos años, en 2022, alcanzaría su tercer título internacional al ganar la Liga Europa de la UEFA tras vencer al Rangers en los penales. De su prolífica cantera han surgido jugadores internacionales como Jürgen Grabowski, Bernd Hölzenbein, Thomas Berthold o Andreas Möller.\nEl Eintracht también mantiene otros diecisiete departamentos para diversos deportes, además de ser uno de los seis clubes con más afiliados del deporte en Alemania.​\n\nHistoria\n\nFundación y primeros años\n\nLos orígenes del equipo se remontan a un par de clubes de fútbol fundados en 1899: el Frankfurter Fußball-Club Viktoria von 1899, considerado como el equipo de fútbol «original» en la historia del club, y el Frankfurter Fußball-Club Kickers von 1899. Ambos clubes fueron fundadores de la nueva Nordkreis-Liga en 1909. Estos dos equipos se fusionaron en mayo de 1911 para convertirse en Frankfurter Fußball Verein (Kickers-Viktoria), un éxito instantáneo, llevando tres títulos de liga de 1912 a 1914 en la Nordkreis-Liga y calificando para el Campeonato del sur de Alemania en cada una de esas temporadas. A su vez, Frankfurter FV se unió al club de gimnasia Frankfurter Turngemeinde von 1861 para formar TuS Eintracht Fráncfort de 1861 en 1920.…",

    "28": {

      "wikiUrl": "https://es.wikipedia.org/wiki/F._C._Union_Berlin",
      "history": "El 1. Fútbol Club Unión Berlín,​​ (1. Fußballclub Union Berlin e. V.​ pronunciado /ˈfuːsbalˌklʊp ʔuˈni̯oːn bɛʁˈliːn/ () en alemán y oficialmente, o Union Berlin​ de manera abreviada pronunciado /ʔuˈni̯oːn bɛʁˈliːn/) es una entidad deportiva profesional de Berlín, la capital de Alemania. Fue fundado sobre la base del FC Olympia Oberschöneweide, club fundado en 1906, y es conocido por su sección de fútbol profesional, que participa en la 1. Bundesliga, la primera división alemana.\nEl equipo disputa sus partidos como local en el Stadion An der Alten Försterei, situado en el distrito berlinés de Köpenick, y juega actualmente en la 1. Bundesliga, después de haber logrado su ascenso ante el histórico VfB Stuttgart el 27 de mayo de 2019. La temporada 2019-20 fue su primera temporada en la primera división del fútbol alemán después de la reunificación, actualmente el Berlín cuenta con 37,417 socios.​​\nEl club es uno de los dos equipos de la capital alemana que lleva el nombre Union surgido durante la Guerra Fría y jugó en la República Democrática Alemana, mientras que el Sport-Club Union 06 Berlin jugaba en el Oeste.\nEl himno de los hinchas del Berlín es \"Eisern Union\" cantado por Nina Hagen.\n\nHistoria\n\nOrígenes del club\nEl nombre 1. FC Union Berlin fue utilizado por dos clubes de fútbol que compartían un origen común en el FC Olympia Oberschöneweide, fundado en 1906 en el distrito Oberschöneweide de Berlín. El equipo tomó el nombre de Union Oberschöneweide en 1910. El Union fue uno de los primeros clubes de Berlín, en el período de entreguerras, regularmente ganó campeonatos locales y compitió a nivel nacional, incluyendo una aparición en la final del campeonato alemán de 1923 que perdió con el Hamburgo.\nDesde el principio el equipo fue apodado Schlosserjungs (\"trabajadores metalúrgicos\"), debido a su entonces uniforme totalmente azul marino, que recordaba a la típica ropa de trabajo usada en las fábricas del distrito industrial de Oberschöneweide. El himno popular de los aficionados del Union, \"Eisern Union!\" (\"unión del hierro\" o \"los del hierro\"), también surgió en este momento. Desde su fundación, el club tenía una imagen clara de clase obrera, en contraste con otros clubes locales con orígenes de clase media, como el Viktoria 89 Berlin, Blau-Weiß 90 Berlin, BSV 92 Berlin o Tennis Borussia Berlin.\nEn 1933, el fútbol alemán se reorganizó bajo el Tercer Reich en 16 divisiones superiores conocidas como Gauligen. Oberschöneweide pasó a formar parte de la Gauliga Berlin-Brandenburg, donde, por lo general, obtuvo resultados discretos.…",

      "history": "El SC Paderborn 07, conocido simplemente como Paderborn 07 es un club de fútbol, ubicado en la ciudad de Paderborn, Renania del Norte-Westfalia, Alemania. Fue fundado en 1907, tras la unión del FC Paderborn y el TuS Schloß Neuhaus con el nombre TuS Paderborn-Neuhaus y tomó su nombre actual en 1953. Desde la temporada 2026/27 se desempeñará en la 1. Bundesliga, la máxima división del fútbol alemán.\n\nHistoria\nEl club Neuhaus fue fundado en 1907 como el SV 07 Neuhaus y en 1959 se unió al TuS 1910 Sennelager y pasó a llamarse TuS Schloss Neuhaus. Los equipos de Neuhaus y de Paderborn y luego la unión de ambos, jugaron la mayor parte de sus historias en la primera división.\nEl club es el más conocido por estar envuelto, aparentemente en forma involuntaria, en un caso notorio de corrupción en el fútbol. El 21 de agosto de 1984, jugando por la Copa de Alemania, el SC Paderborn 07 derrotó 4:2 al Hamburgo SV. En enero de 2005 se descubrió que el árbitro del partido, había aceptado dinero de sindicatos del juego croatas para \"arreglar\" el partido. Durante el desarrollo del mismo pitó dos penaltis inexistentes y expulsó un jugador en forma más que discutible. Pronto se supo que este partido era solamente uno de muchos donde la mafia había comprado árbitros, entrenadores y jugadores para influir en el resultado de los partidos. El escándalo se convirtió en el más grande del fútbol alemán en treinta años.\nEn la temporada 2002/03, el SC Paderborn se estrena en la Regionalliga Nord (Tercera División en el sistema de fútbol alemán), en la que participaría durante 4 temporadas consecutivas.\nUn constante mejoramiento en la Regionalliga Nord (III) llevó al Paderborn a avanzar a la segunda división en 2005. Pasaron la mayor parte de la década siguiente como equipo de media tabla hacia abajo en la 2. Bundesliga antes de abrirse paso en la temporada 2013-2014. Una victoria por 2-1 en casa sobre Aalen el 11 de mayo de 2014 le aseguró un segundo puesto y un ascenso a la 1. Bundesliga por primera vez en la historia del club. Sin embargo, la celebración duró poco ya que fueron relegados inmediatamente de la Bundesliga en la temporada 2014–15. Luego después de solo seis victorias y 28 puntos en la temporada 2015-16, el SC Paderborn fue relegado a la 3. Bundesliga, terminando en el puesto 18. El club se ubicó en el puesto 18 por tercera temporada consecutiva (en tres ligas diferentes) cuando finalizó la temporada 2016-17, pero evitó otro descenso en el sistema de ligas del fútbol alemán debido al descenso del TSV 1860 Múnich desde la 2. Bundesliga a la Regionalliga Bayern.…",

    "57": {
      "qid": "Q9617",

      "wikiUrl": "https://es.wikipedia.org/wiki/Arsenal_Football_Club",
      "history": "El Arsenal Football Club es un club de fútbol con sede en Holloway, Londres, Inglaterra. Disputa la máxima categoría del fútbol inglés, la Premier League. Es uno de los clubes más laureados del fútbol inglés, ha ganado 48 títulos nacionales, incluyendo 14 campeonatos de liga y un récord de 14 FA Cup; 2 Copa de la Liga, 18 Community Shield y el Trofeo del Centenario de la Liga. También ha ganado dos títulos internacionales: la Copa de Ferias en 1970 y la Recopa de Europa en 1994. En términos de trofeos ganados en general es el tercer club más exitoso y laureado de Inglaterra.\nFundado en 1886 en el sudeste de Londres, en 1893, se convirtió en el primer club del sur de Inglaterra en unirse a la Football League, y llegó a la Primera División en 1904. Descendió solo una vez, en 1913, continúa la racha más larga en la primera división, y ha ganado la segunda mayor cantidad de partidos de alto nivel en la historia del fútbol inglés. Ganó sus primeros títulos —cinco ligas y dos FA Cups— en los años 1930. Luego de un período de escasez en los años posteriores a la Segunda Guerra Mundial, se convirtió en el segundo club del siglo XX en ganar el doblete, obteniendo el Campeonato de Liga y la FA Cup de la temporada 1970-71. Los logros siguieron en los años 1990 y 2000. Durante esos años, Arsenal ganó un doblete de copas nacionales, dos dobletes de Liga y Copa, y dos bicampeonatos de la Copa de Inglaterra. Finalizó una temporada de Liga invicto y se convirtió en el primer club de Londres en llegar a la final de la Liga de Campeones de la UEFA en 2005-06, donde cayó contra el F. C. Barcelona. También resultó subcampeón de la Liga de Campeones en 2025-26, cayendo ante el Paris Saint-Germain F. C. en penaltis. Entre 1998 y 2017, el Arsenal se clasificó para la UEFA Champions League durante 19 temporadas consecutivas.\nHerbert Chapman, quien cambió la suerte del Arsenal para siempre, ganó para el club su primera medalla de plata, y su legado llevó al club a dominar la década de 1930; Chapman, sin embargo, murió de neumonía en 1934, a la edad de 55 años. Ayudó a introducir la formación WM, los reflectores y los números de camiseta; también agregó las mangas blancas y un rojo más brillante a la camiseta del club. Arsène Wenger es el entrenador con más años de servicio y ganó la mayor cantidad de trofeos. Ganó un récord de siete Copas FA, y su equipo ganador del título estableció un récord inglés de la racha invicta más larga en la historia de la Premier League con 49 partidos entre 2003 y 2004, recibiendo el apodo de «The Invincibles» (Los invencibles en español).…",

      "history": "El Aston Villa Football Club es un club de fútbol del Reino Unido con sede en Birmingham (Inglaterra) fundado en 1874. Disputa la Premier League, máxima categoría del fútbol inglés, ininterrumpidamente desde 2019, si bien es uno de los equipos más representativos de la élite del país y es únicamente superado por el Everton Football Club en presencias en la máxima categoría.​ Es uno de los miembros fundadores de la Football League en 1888 y de la Premier League en 1992.​ Disputa sus encuentros como local en el estadio Villa Park, también centenario, con capacidad para 42 000 espectadores.\nAston Villa ha sido un club inglés líder desde la década de 1880, cuando su equipo fue pionero del juego moderno. Este estilo de pase combinado corto y rápido fue introducido por el escocés George Ramsay, quien fue nombrado primer entrenador de fútbol profesional del mundo en 1886. El club influyó en el avance del deporte hacia el profesionalismo en 1885, y fue el director de la Villa, William McGregor, quien fundó la primera liga de fútbol del mundo en 1888.\nLos seis títulos de la English Football League y seis FA Cup estableció al Aston Villa como el club más exitoso de Inglaterra, posición que ocupó desde la década de 1890 hasta la de 1970. Villa anotó 128 goles en la temporada 1930-31, que sigue siendo el récord de todos los tiempos en la máxima categoría, sin embargo, el club comenzó su primer declive a mediados de la década de 1930; Las décadas de 1940 y 1950 fueron en general un período de mediocridad seguido de un fuerte declive en la década de 1960, salvado previamente por el triunfo en la FA Cup 1956-57, que culminó con la adquisición del club por Doug Ellis en 1968 y el primer y único descenso al tercer nivel del fútbol inglés en 1969-70. Villa regresó a la élite desde mediados de la década de 1970 bajo el mando de Ron Saunders, quien llevó al club a un séptimo título de liga de la máxima categoría en 1980-81 y a su primera Community Shield. Se convirt       "history": "El Fulham Football Club es un club de fútbol profesional con sede en Fulham, en el oeste de Londres, Inglaterra. El club compite en la Premier League, la máxima categoría del fútbol inglés. Fundado en 1879, disputa sus partidos como local en Craven Cottage desde 1896. El Fulham mantiene rivalidades en los denominados derbis del oeste de Londres con el Chelsea, el Brentford y el Queens Park Rangers. El club adoptó una indumentaria compuesta por camiseta blanca y pantalón negro en 1896, combinación que ha utilizado de forma continuada desde entonces.\nFundado en 1879, es el club de fútbol profesional más antiguo de Londres. Se incorporó a la Southern League en 1898, donde conquistó dos títulos de la First Division (1905–06 y 1906–07), además de dos campeonatos de la Second Division y un título de la Western League. En 1907 fue admitido en la Second Division de la Football League. Tras descender, ganó la Third Division South en la temporada 1931–32, logrando el ascenso cuatro años después de su relegación.\nEl club se proclamó campeón de la Second Division en la temporada 1948–49, aunque descendió tras tres campañas en la máxima categoría. Regresó a la First Division en 1958–59 y, con la destacada actuación de su jugador estrella Johnny Haynes, logró mantenerse en la élite hasta que sufrió descensos consecutivos en 1968 y 1969. Ascendió nuevamente en la temporada 1970–71 y alcanzó la final de la FA Cup 1974–75.\nDurante las décadas siguientes, el club alternó entre la segunda y la cuarta categoría del fútbol inglés hasta su adquisición por el empresario Mohamed Al-Fayed en 1997. Bajo su propiedad, el Fulham ganó dos títulos divisionales en tres temporadas, logrando el ascenso a la Premier League en 2001. Posteriormente, obtuvo la Copa Intertoto de la UEFA en 2002 y fue subcampeón de la Liga Europa de la UEFA en 2010.\nTras trece temporadas consecutivas en la máxima categoría, el Fulham descendió en 2014. Desde entonces, y bajo la propiedad del empresario Shahid Khan, el club ha alternado entre la Premier League y la Championship. Entre las temporadas 2017–18 y 2021–22, el Fulham cambió de división en cinco campañas consecutivas, descendiendo tras ganar las finales del play-off de la Championship en 2018 y 2020. En la temporada 2021–22 se proclamó campeón de la Championship, consolidándose en la Premier League desde 2022.\n\nHistoria\nEl Fulham Football Club fue fundado en 1879 con el nombre de Fulham St Andrew's Church Sunday School FC. (Club de Fútbol Escuela dominical de la iglesia de St. Andrew de Fulham). Todos los primeros jugadores fueron Cristianos.…",

      "history": "El Liverpool Football Club (pronunciación en inglés: /ˈlɪvərpul ˈfʊtbɔl klʌb/) es un club de fútbol profesional inglés con sede en Liverpool, Inglaterra, que disputa la Premier League, máxima competición futbolística en dicho país. Fue oficialmente registrado como club de fútbol por John Houlding el 6 de junio de 1892, aunque originalmente fue nombrado «Everton F. C. and Athletic Grounds Ltd.» ante la Asociación Inglesa de Fútbol. En 1893 se unió a la Football League.\nEs la institución con el mayor número de campeonatos en todo tipo de competencias oficiales entre los clubes del fútbol inglés sumando un total de setenta títulos oficiales. Asimismo es el club inglés con la máxima cifra de títulos internacionales,​ con una Copa Mundial de Clubes de la FIFA, seis Copas de Europa, tres Copas de la UEFA y cuatro Supercopas de la UEFA. A nivel nacional, ha ganado veinte títulos de liga — máximo ganador compartido —,​ ocho Copas de Inglaterra,​ diez Copas de la Liga,​​ —siendo el equipo que más ha ganado dicha competición— dieciséis Community Shields y una Supercopa de la Liga.\nSi bien ganó su primer título de liga en 1901, fue durante la décadas de 1970 y 1980 cuando la institución, bajo la conducción técnica primero de Bill Shankly y posteriormente de Bob Paisley, obtuvo siete títulos internacionales y once campeonatos de liga. Fue miembro fundador de la «Premier League» en 1992 y del grupo G-14. Sus colores distintivos históricamente son el rojo —por lo cual reciben el apelativo de «The Reds»—, y en menor medida el blanco. Disputa sus partidos como local en el Estadio de Anfield desde su formación, que posee una capacidad de 61 276 espectadores.\nEs considerado uno de los clubes más populares de Inglaterra y del mundo; también es el noveno con mayor cantidad de ingresos al 2014, con un lucro anual de €306 millones.​ Fue calificado por la revista Forbes como el octavo club de fútbol más valuado en el mundo en 2015, con una suma total de $982 millones.​ Sus principales rivalidades son con el Everton, con quien disputa el derbi de Merseyside, y con el Manchester United Football Club, cuyos partidos entre sí son referidos como el derbi del Noroeste de Inglaterra.…",

      "history": "El Manchester City Football Club es un club de fútbol de la ciudad de Mánchester, Inglaterra, que juega en la Premier League. Fue fundado el 23 de noviembre de 1880 bajo el nombre de St. Mark's (West Gorton), luego pasó a llamarse Ardwick Association Football Club en 1887 y finalmente, el 16 de abril de 1894, adquirió su denominación actual. El club disputa sus partidos en el Etihad Stadium desde 2003, habiendo jugado en el Maine Road desde 1923. El club adoptó su camiseta de local celeste en 1894 en la primera temporada de la versión actual del club, y se han utilizado desde entonces.​ \nEl Manchester City ingresó a la Football League en 1892 y ganó su primer trofeo oficial con la FA Cup en 1904. No obstante, el club disfrutó de su mayor período de éxito a finales de los años 1960 y principios de los 1970, cuando ganó el campeonato de Liga de First Division, FA Cup, Copa de la Liga y la Recopa de Europa bajo la dirección técnica primero de Joe Mercer y luego de Malcolm Allison. Después de perder la final de la FA Cup de 1981, el club pasó por un período de decadencia, que culminó con el descenso a la tercera división del fútbol inglés en 1998.\nDespués de recuperar su sitio en la Premier League en 2002, el 1 de septiembre de 2008 Abu Dhabi United Group for Development and Investment, un grupo inversor de los Emiratos Árabes con Mansour bin Zayed Al-Nahyan como máximo accionista, se hizo con el control del club por unos 250 millones de euros, relevando al ex primer ministro de Tailandia, Thaksin Shinawatra, hasta entonces dueño de la entidad. Desde la llegada de los nuevos dueños, el club ha obtenido un total de 17 títulos oficiales, entre los que se destacan ocho Premier League (2012, 2014, 2018, 2019, 2021, 2022, \n2023 y 2024), además de disputar por primera vez una final de la Liga de Campeones de la UEFA en 2021, dónde perdería por 1-0 ante el Chelsea F. C. Disputó su segunda final de la Liga de Campeones de la UEFA, en 2023, donde derrotó por ue han ganado el máximo campeonato de clubes de fútbol a nivel mundial,​ cuando el 30 de noviembre de 1999 conquistó la Copa Intercontinental​ y el 21 de diciembre de 2008 la Copa Mundial de Clubes,​ ambas disputadas en Japón, derrotando a los representantes de la Copa Libertadores: Palmeiras y Liga de Quito respectivamente por idéntico marcador, 1-0. Siendo (de los clubes británicos), el primer y máximo ganador de los títulos mundiales de clubes.…",

esde la primera vez que se enfrentaron en 1883, y es considerado por la FIFA como una de las rivalidades clásicas del fútbol, además de ser señalado como uno de los enfrentamientos más importantes de Inglaterra y uno de los más antiguos del mundo.​ Una enemistad que traspoló al foot-ball y que provenía de siglos atrás, con episodios en la Guerra Civil, los levantamientos jacobitas o la rivalidad comercial durante la Revolución Industrial.​ Ambos fueron los más laureados de Inglaterra a comienzos del siglo XX.​…",

      "history": "El Sunderland Association Football Club es un club de fútbol profesional inglés, fundado el 17 de octubre de 1879 en la ciudad de Sunderland en Tyne y Wear al noreste de Inglaterra. Actualmente disputa la Premier League, la máxima categoría del fútbol inglés, y desde su fundación, ha sido considerado por palmarés e historia como el mejor equipo en el noreste de Inglaterra. \nSunderland ganó 6 campeonatos de Liga de Inglaterra (1892, 1893, 1895, 1902, 1913 y 1936), y finalizó como subcampeón en cinco ocasiones, un registro solo superado por otros cinco clubes. El club ha ganado 2 Copas de Inglaterra (1937 y 1973) —competición conocida como FA Cup en inglés—, y ha sido subcampeón en otras dos oportunidades (1913 y 1992). Ha ganado una Supercopa de Inglaterra —competición conocida como Community Shield— en 1936, siendo subcampeón de la misma al año siguiente. Sunderland fue finalista de la Copa de la Liga en 1985 y 2014, perdiendo ante Norwich City y Manchester City respectivamente.\nTras un período de éxito a fines del siglo XIX, con varios títulos liga, ganó su primera FA Cup en 1937 con un triunfo 3-1 ante el Preston North End, y se mantuvo en la máxima categoría durante 68 temporadas sucesivas. Tras la Segunda Guerra Mundial, el título obtenido más importante fue la FA Cup en 1973, cuando el club derrotó por 1-0 al Leeds United. Durante este período el club obtuvo cinco títulos de segunda categoría y uno de la tercera.\nSunderland juega sus partidos como local en el Stadium of Light, con capacidad para 49 000 espectadores desde 1997, tras haber abandonado el antiguo Roker Park. La capacidad original del estadio era de 42 000 espectadores, pero fue aumentada a la capacidad actual en el año 2000. El club mantiene una gran rivalidad con el Newcastle United, con quien disputa el Tyne & Wear Derby desde 1898. Tras ascender a la máxima categoría en 2007, se convirtió en uno de los clubes de fútbol más ricos del mundo, estando valuado en USD $93 millones       "history": "El Tottenham Hotspur Football Club es un club de fútbol con sede en el distrito de Tottenham, Londres, que compite en la Premier League de Inglaterra. Ejerció como local en el White Hart Lane hasta la temporada 2016-17, cuando este fue demolido para ser reconstruido por completo. En las temporadas 2017-18 y 2018-19 el estadio donde ejercieron de local fue Wembley y en ocasiones especiales juegan partidos allí. Su estadio, el Tottenham Hotspur Stadium se erigió en el mismo lugar donde se demolió el White Hart Lane, con capacidad para 65,000 espectadores e inaugurado el 3 de abril de 2019.\nFundado en 1882, el club ganó por primera vez la Football Association Cup en la edición 1900-01 siendo el único club en vencerla sin pertenecer a la Football League —máxima división del fútbol inglés hoy conocida como Premier League— desde que se inaugurase la categoría en 1888 (participaba entonces en la Southern League).​ Fue también el primer club del siglo xx en conseguir el doblete nacional de Liga y Copa durante la temporada 1960-61, y tras defender con éxito la F. A. Cup en 1962, se convirtió en el primer equipo británico en vencer una competición internacional de la UEFA, al conquistar la Recopa de Europa en 1963.​ Cerró su década más exitosa con otro título de la F. A. Cup en 1967. Posteriormente ganó la English Football League Cup (es. Copa de la Liga) en dos ocasiones, así como la edición inaugural de la Copa de la UEFA en 1972, por lo que fue el primer club británico en lograr dos trofeos europeos distintos. Sus éxitos continuaron con el devenir de los años y con su último campeonato de la E. F. L. Cup de 2008, registró una racha de seis décadas consecutivas con al menos un trofeo de las principales competiciones del país, logro sólo igualado por el Manchester United.​​ En total, los «spurs» han ganado dos Campeonatos de Liga, ocho Campeonatos de Copa, cuatro Copas de la Liga y siete Community Shield (o Supercopas) en el apartado nacional, sumando un total de veintiún títulos, y una Recopa de Europa y tres trofeos de la Liga Europa de la UEFA (dos como Copa de la UEFA) en el panorama internacional.\nEn la temporada 2018-19 estuvo cerca de convertirse en el sexto club europeo en vencer las tres principales competiciones de la UEFA, pero fue derrotado en la final de la Liga de Campeones de la UEFA 2018-19 por el Liverpool.​\nEl lema del club es Audere est facere (que significa Atreverse es lograrlo),​ y su emblema actual es un gallo sobre un balón de fútbol clásico.…",
